      :root {
        --bg: #0a0a0a;
        --bg-raised: #111111;
        --bg-sunk: #050505;
        --line: #1c1c1c;
        --line-strong: #2e2e2e;
        --ink: #ededed;
        --ink-muted: #8f8f8f;
        --ink-dim: #5e5e5e;
        --accent: #ff4f1f;
        --accent-ink: #0a0a0a;
        --focus: var(--accent);
        --success: #3ddc84;
        --warning: #ffb020;
        --danger: #ff6b81;
        --info: #7aa2ff;
        --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.6);
        --font-pixel: "Forge Sans", "Geist Mono", ui-monospace, monospace;
        --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
        --hatch: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 9px);
        --ctl: 28px;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #f7f7f5;
        --bg-raised: #ededea;
        --bg-sunk: #ffffff;
        --line: #e2e2de;
        --line-strong: #c4c4be;
        --ink: #111111;
        --ink-muted: #5c5c58;
        --ink-dim: #80807a;
        --accent: #c93a10;
        --accent-ink: #0a0a0a;
        --success: #157a3e;
        --warning: #8a5300;
        --danger: #b4233f;
        --info: #2f5bd1;
        --shadow-pop: 0 8px 24px rgba(17, 17, 17, 0.12);
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border-radius: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/16px var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--accent);
        color: var(--accent-ink);
      }
      [data-i] {
        display: inline-flex;
        flex: none;
      }
      .px {
        display: inline-block;
        flex: none;
        width: 16px;
        height: 16px;
        shape-rendering: crispEdges;
      }
      .px .o {
        opacity: 0.4;
      }
      .eyebrow {
        font: 500 11px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .dim {
        color: var(--ink-dim);
      }
      .muted {
        color: var(--ink-muted);
      }
      .led {
        display: inline-block;
        flex: none;
        width: 6px;
        height: 6px;
        background: var(--ink-dim);
      }
      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border: 1px solid var(--line-strong);
        font: 500 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: var(--ctl);
        height: var(--ctl);
        flex: none;
        border: 1px solid transparent;
        color: var(--ink-muted);
      }
      .icon-btn:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .icon-btn.boxed {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        flex: none;
      }
      .btn:hover {
        border-color: var(--ink);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--ink));
      }
      .btn.ghost {
        border-color: transparent;
        color: var(--ink-muted);
      }
      .btn.ghost:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
      }
      .seg button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: calc(var(--ctl) - 2px);
        padding: 0 10px;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        white-space: nowrap;
      }
      .seg button + button {
        border-left: 1px solid var(--line-strong);
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }
      .seg button:hover:not([aria-pressed="true"]) {
        color: var(--ink);
      }
      .seg.icons button {
        width: calc(var(--ctl) - 2px);
        padding: 0;
        justify-content: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 7px;
        border: 1px solid var(--line-strong);
        font: 400 11.5px/1 var(--font-sans);
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .chip .sq {
        width: 6px;
        height: 6px;
        flex: none;
      }
      .chip .px {
        width: 12px;
        height: 12px;
      }
      .av {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        flex: none;
        background: var(--bg-sunk);
        border: 1px solid var(--line-strong);
        font: 500 8.5px/1 var(--font-mono);
        color: var(--ink);
      }
      .av.me {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        font: 700 9px/1 var(--font-pixel);
        text-transform: uppercase;
        color: var(--ink);
      }
      .logo.lg {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }
      .pop {
        position: fixed;
        z-index: 60;
        min-width: 220px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
        padding: 4px;
        display: none;
      }
      .pop.open {
        display: block;
      }
      .pop .h {
        padding: 8px 10px 6px;
      }
      .pop a,
      .pop button.r {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 30px;
        padding: 0 10px;
        color: var(--ink-muted);
        text-align: left;
      }
      .pop a:hover,
      .pop button.r:hover,
      .pop button.r[aria-selected="true"] {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .pop a kbd,
      .pop button.r kbd,
      .pop button.r .k {
        margin-left: auto;
      }
      .pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      /* app frame shared by the apps: a side, an inset panel with handles, a foot */
      .app {
        display: grid;
        grid-template-columns: var(--side) minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
      }
      .side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 8px 12px 0;
      }
      .side-head {
        display: flex;
        align-items: center;
        gap: 4px;
        height: var(--ctl);
        margin-bottom: 10px;
      }
      .ws {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px 0 4px;
        border: 1px solid transparent;
        min-width: 0;
        flex: 1;
      }
      .ws:hover {
        border-color: var(--line-strong);
      }
      .ws .tile {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .ws .tile .px {
        width: 12px;
        height: 12px;
      }
      .ws b {
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ws .chev {
        color: var(--ink-dim);
      }
      .searchbox {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        background: var(--bg-sunk);
        color: var(--ink-dim);
        width: 100%;
        text-align: left;
      }
      .searchbox:hover {
        border-color: var(--line-strong);
        color: var(--ink-muted);
      }
      .searchbox span:nth-child(2) {
        flex: 1;
      }
      .nav {
        flex: 1;
        overflow: auto;
        margin: 0 -4px;
        padding: 0 4px 12px;
        scrollbar-width: none;
      }
      .nav-sec {
        margin-top: 14px;
      }
      .nav-h {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        color: var(--ink-dim);
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        width: 100%;
        text-align: left;
      }
      .nav-h:hover {
        color: var(--ink-muted);
      }
      .nav-h .car {
        margin-left: auto;
        transition: transform 0.12s;
      }
      .nav-h[aria-expanded="false"] .car {
        transform: rotate(-90deg);
      }
      .it {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--nav-row, 28px);
        padding: 0 8px;
        color: var(--ink-muted);
        border: 1px solid transparent;
        white-space: nowrap;
        width: 100%;
        text-align: left;
      }
      .it:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .it[aria-current="page"] {
        color: var(--ink);
        background: var(--bg-raised);
        border-color: var(--line);
      }
      .it[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: -5px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--accent);
      }
      .it .lbl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .it .k {
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .side-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 44px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        margin: 0 -12px;
        padding-left: 12px;
        padding-right: 12px;
      }
      .mainwrap {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 8px 8px 0 0;
      }
      .panel {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line-strong);
        background: var(--bg);
      }
      .panel::before,
      .panel::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        pointer-events: none;
        z-index: 3;
      }
      .panel::before {
        top: -4px;
        left: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .panel::after {
        bottom: -4px;
        right: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        height: var(--ctl);
        margin: 4px 2px 4px 4px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .foot .led {
        background: var(--success);
      }
      .foot a:hover {
        color: var(--ink);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font: 500 13px/16px var(--font-sans);
      }
      .crumb a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 5px 0 4px;
        margin-left: -4px;
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .crumb a:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .crumb .sep {
        color: var(--ink-dim);
      }
      .crumb b {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .head .acts {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .menu {
        display: none !important;
      }
      .tk-hover:hover {
        --t: var(--accent);
        background-image:
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t));
        background-size:
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px;
        background-position:
          top left,
          top left,
          top right,
          top right,
          bottom left,
          bottom left,
          bottom right,
          bottom right;
        background-repeat: no-repeat;
      }
      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: fixed;
          inset: 0 auto 0 0;
          width: 280px;
          z-index: 30;
          background: var(--bg);
          border-right: 1px solid var(--line);
          transform: translateX(-100%);
          transition: transform 0.2s;
        }
        .app.drawer .side {
          transform: none;
          box-shadow: var(--shadow-pop);
        }
        .mainwrap {
          padding: 0;
        }
        .panel {
          border: 0;
        }
        .panel::before,
        .panel::after {
          display: none;
        }
        .menu {
          display: inline-grid !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* Notion's measures (packages/ui of the notion project), drawn in the Forgeron language. */
      :root {
        --side: 270px;
        --nav-row: 30px;
        --page: 720px;
        --margin: 96px;
        --indent: 24px;
      }
      .side {
        padding-top: 6px;
      }
      .tree .it {
        padding-left: calc(8px + var(--lvl, 0) * 12px);
      }
      .tree .it .tg {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        margin-left: -2px;
        color: var(--ink-dim);
        transition: transform 0.12s;
      }
      .tree .it .tg[aria-expanded="false"] {
        transform: rotate(-90deg);
      }
      .tree .it .tg.none {
        visibility: hidden;
      }
      .tree .it .ic {
        display: inline-flex;
      }
      .tree .it .hov {
        display: none;
        gap: 2px;
        margin-left: auto;
      }
      .tree .it:hover .hov {
        display: inline-flex;
      }
      .tree .it .hov span {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        color: var(--ink-dim);
      }
      .tree .it .hov span:hover {
        color: var(--ink);
        background: var(--line);
      }
      .tree .it.dragging {
        opacity: 0.4;
      }
      .tree .it.drop-before {
        box-shadow: inset 0 2px 0 var(--accent);
      }
      .tree .it.drop-after {
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .tree .it.drop-in {
        border-color: var(--accent);
        background: var(--bg-raised);
      }
      .tree .it input.rn {
        flex: 1;
        min-width: 0;
        height: 22px;
        padding: 0 4px;
        border: 1px solid var(--accent);
        background: var(--bg-sunk);
        outline: none;
        font-size: 13px;
      }
      .nav-h .add {
        display: none;
        place-items: center;
        width: 18px;
        height: 18px;
        margin-left: auto;
        color: var(--ink-dim);
      }
      .nav-h .add:hover {
        color: var(--ink);
        background: var(--line);
      }
      .nav-h:hover .add {
        display: grid;
      }
      .nav-h .add + .car {
        margin-left: 4px;
      }
      .ed {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
        margin-right: 8px;
        white-space: nowrap;
      }
      .icon-btn.on {
        color: var(--accent);
      }
      .icon-btn.sm {
        width: 22px;
        height: 22px;
      }
      .lockc {
        cursor: pointer;
        margin-right: 4px;
      }
      .lockc:hover {
        border-color: var(--ink-muted);
        color: var(--ink);
      }
      .btn.danger {
        border-color: var(--danger);
        color: var(--danger);
      }
      .btn.danger:hover {
        background: var(--danger);
        color: var(--accent-ink);
      }
      .fi {
        width: 100%;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        outline: none;
        font-size: 13px;
      }
      .fi:focus {
        border-color: var(--accent);
      }

      /* page */
      .pwrap {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .pwrap > .body {
        flex: 1;
        min-width: 0;
      }
      .tbanner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 44px;
        padding: 6px 16px;
        flex-wrap: wrap;
        background: color-mix(in srgb, var(--danger) 14%, var(--bg));
        border-bottom: 1px solid var(--danger);
        font-size: 13px;
      }
      .tbanner .btn {
        height: 26px;
      }
      .cover {
        position: relative;
        height: 200px;
        border-bottom: 1px solid var(--line);
        flex: none;
        overflow: hidden;
      }
      .cover canvas {
        position: absolute;
        left: 0;
        top: calc(var(--pos, 0.5) * -80%);
        display: block;
        width: 100%;
        height: 180%;
        image-rendering: pixelated;
      }
      .cover .cv-acts {
        position: absolute;
        right: 16px;
        bottom: 12px;
        display: none;
        gap: 0;
        background: var(--bg);
        border: 1px solid var(--line-strong);
      }
      .cover:hover .cv-acts:not(:empty),
      .cover.repos .cv-acts {
        display: inline-flex;
      }
      .cover .cv-acts button {
        height: 26px;
        padding: 0 10px;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .cover .cv-acts button + button {
        border-left: 1px solid var(--line-strong);
      }
      .cover .cv-acts button:hover {
        color: var(--ink);
      }
      .cover .rp-hint {
        display: none;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 6px 10px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        font: 400 11px/16px var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink);
        pointer-events: none;
      }
      .cover.repos {
        cursor: ns-resize;
        touch-action: none;
      }
      .cover.repos .rp-hint {
        display: block;
      }
      .page {
        max-width: calc(var(--page) + 2 * var(--margin));
        margin: 0 auto;
        padding: 0 var(--margin) 160px;
      }
      .page.full {
        max-width: none;
      }
      .p-icon {
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        margin-top: -39px;
        position: relative;
        z-index: 1;
        border: 1px solid var(--line-strong);
        background: var(--bg);
        color: var(--ink);
      }
      .p-icon:hover {
        border-color: var(--ink-muted);
      }
      .page.locked .p-icon {
        pointer-events: none;
      }
      .p-icon .px {
        width: 44px;
        height: 44px;
      }
      .p-icon.nocover {
        margin-top: 72px;
      }
      .p-gap {
        height: 56px;
      }
      .p-tools {
        display: flex;
        gap: 4px;
        height: 28px;
        margin-top: 16px;
        opacity: 0;
        transition: opacity 0.12s;
      }
      .page:hover .p-tools,
      .p-tools:focus-within {
        opacity: 1;
      }
      .p-title {
        margin-top: 4px;
        font: 700 40px/48px var(--font-sans);
        letter-spacing: -0.025em;
        outline: none;
      }
      .p-title:empty::before {
        content: "Untitled";
        color: var(--ink-dim);
      }
      .p-props {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 6px 0;
      }
      .p-prop {
        display: grid;
        grid-template-columns: 160px minmax(0, 1fr);
        align-items: center;
        min-height: 32px;
        font-size: 13.5px;
      }
      .p-prop dt {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-dim);
      }
      .p-prop dd {
        margin: 0;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }

      /* blocks */
      .blocks {
        margin-top: 20px;
        font-size: 16px;
        line-height: 24px;
      }
      .page.small .blocks {
        font-size: 14px;
        line-height: 21px;
      }
      .page.small .p-title {
        font-size: 32px;
        line-height: 40px;
      }
      .blk {
        position: relative;
        padding: 3px 2px;
        min-height: 30px;
      }
      .blk .gut {
        position: absolute;
        left: -52px;
        top: 3px;
        display: flex;
        gap: 2px;
        opacity: 0;
        transition: opacity 0.1s;
      }
      .blk:hover .gut,
      .blk.focus .gut,
      .blk.sel .gut {
        opacity: 1;
      }
      .page.locked .blk .gut {
        display: none;
      }
      .blk .gut button {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        color: var(--ink-dim);
      }
      .blk .gut button:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .blk .gut [data-handle] {
        cursor: grab;
      }
      .blk.sel {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .blk.dragging {
        opacity: 0.4;
      }
      .blk.drop-before {
        box-shadow: 0 -2px 0 var(--accent);
      }
      .blk.drop-after {
        box-shadow: 0 2px 0 var(--accent);
      }
      .c-muted .tx,
      .c-muted.b-quote {
        color: var(--ink-muted);
      }
      .c-accent .tx {
        color: var(--accent);
      }
      .c-success .tx {
        color: var(--success);
      }
      .c-warning .tx {
        color: var(--warning);
      }
      .c-danger .tx {
        color: var(--danger);
      }
      .c-info .tx {
        color: var(--info);
      }
      .bg-muted {
        background: color-mix(in srgb, var(--ink-muted) 14%, transparent);
      }
      .bg-accent {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .bg-success {
        background: color-mix(in srgb, var(--success) 14%, transparent);
      }
      .bg-warning {
        background: color-mix(in srgb, var(--warning) 14%, transparent);
      }
      .bg-danger {
        background: color-mix(in srgb, var(--danger) 14%, transparent);
      }
      .bg-info {
        background: color-mix(in srgb, var(--info) 14%, transparent);
      }
      .tx {
        outline: none;
        min-height: 24px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .blk.focus .tx:empty::before {
        content: attr(data-ph);
        color: var(--ink-dim);
      }
      .tx b,
      .tx strong {
        font-weight: 600;
      }
      .tx code {
        font: 400 0.85em/1 var(--font-mono);
        padding: 2px 5px;
        background: var(--bg-raised);
        border: 1px solid var(--line-strong);
        color: var(--accent);
      }
      .tx a.u {
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--ink-dim);
      }
      .b-h1 .tx {
        font: 700 30px/38px var(--font-sans);
        letter-spacing: -0.02em;
        margin-top: 28px;
      }
      .b-h2 .tx {
        font: 600 23px/31px var(--font-sans);
        letter-spacing: -0.015em;
        margin-top: 20px;
      }
      .b-h3 .tx {
        font: 500 13px/22px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin-top: 16px;
      }
      .page.small .b-h1 .tx {
        font-size: 26px;
        line-height: 34px;
      }
      .page.small .b-h2 .tx {
        font-size: 20px;
        line-height: 28px;
      }
      .b-todo,
      .b-bullet,
      .b-number {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .b-todo > .tx,
      .b-bullet > .tx,
      .b-number > .tx {
        flex: 1;
      }
      .chk {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        margin-top: 4px;
        flex: none;
        border: 1.5px solid var(--ink-muted);
        color: var(--accent-ink);
      }
      .chk[aria-checked="true"] {
        background: var(--accent);
        border-color: var(--accent);
      }
      .chk .px {
        width: 12px;
        height: 12px;
      }
      .b-todo.done > .tx {
        color: var(--ink-dim);
        text-decoration: line-through;
      }
      .bul {
        width: 16px;
        height: 24px;
        flex: none;
        display: grid;
        place-items: center;
      }
      .bul::before {
        content: "";
        width: 6px;
        height: 6px;
        background: var(--ink);
      }
      .num {
        width: 22px;
        flex: none;
        font: 400 14px/24px var(--font-mono);
        color: var(--ink-muted);
      }
      .b-quote {
        border-left: 3px solid var(--ink);
        padding-left: 16px;
        margin: 4px 0;
      }
      .b-callout {
        display: flex;
        gap: 12px;
        padding: 14px 16px;
        margin: 6px 0;
        border: 1px solid var(--line-strong);
        background: var(--bg-raised);
      }
      .b-callout .cic {
        color: var(--accent);
        margin-top: 4px;
      }
      .b-callout .tx {
        flex: 1;
      }
      .b-code {
        margin: 6px 0;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
      }
      .b-code .lang {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 28px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
      }
      .b-code .tx {
        padding: 14px 16px;
        font: 400 13px/20px var(--font-mono);
        color: var(--ink-muted);
      }
      .b-divider {
        padding: 10px 2px;
      }
      .b-divider hr {
        border: 0;
        border-top: 1px solid var(--line-strong);
        margin: 0;
      }
      .b-toggle .th {
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .b-toggle .tg {
        display: grid;
        place-items: center;
        width: 20px;
        height: 24px;
        color: var(--ink-muted);
        transition: transform 0.12s;
        flex: none;
      }
      .b-toggle[data-open="false"] .tg {
        transform: rotate(-90deg);
      }
      .b-toggle .tin {
        padding-left: 26px;
        color: var(--ink-muted);
      }
      .b-toggle[data-open="false"] .tin {
        display: none;
      }
      .mention {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 4px;
        margin: 0 1px;
        border-bottom: 1px solid var(--ink-dim);
        color: var(--ink);
        font-weight: 500;
        white-space: nowrap;
        vertical-align: baseline;
        cursor: pointer;
      }
      .mention .logo {
        width: 16px;
        height: 16px;
        font-size: 7px;
        transform: translateY(2px);
      }
      .mention:hover {
        background: var(--bg-raised);
        border-bottom-color: var(--accent);
      }
      .mention .via {
        font: 400 10px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      .b-table {
        margin: 8px 0;
        overflow-x: auto;
      }
      .b-table table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
        line-height: 20px;
      }
      .b-table td,
      .b-table th {
        border: 1px solid var(--line-strong);
        padding: 7px 10px;
        text-align: left;
        font-weight: 400;
      }
      .b-table th {
        background: var(--bg-raised);
        font: 500 11px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }

      /* inline database */
      .db {
        margin: 12px 0;
      }
      .db-h {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        border-bottom: 1px solid var(--line);
      }
      .db-h b {
        font: 600 15px/20px var(--font-sans);
      }
      .db-h .seg {
        margin-left: auto;
      }
      .db table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13.5px;
      }
      .db th {
        height: 34px;
        padding: 0 10px;
        text-align: left;
        font: 500 11px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .db th .px {
        width: 12px;
        height: 12px;
        vertical-align: -1px;
        margin-right: 6px;
      }
      .db td {
        height: 36px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .db td + td,
      .db th + th {
        border-left: 1px solid var(--line);
      }
      .db tr.r:hover td {
        background: var(--bg-raised);
      }
      .db tr.r td:first-child a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
      }
      .db tr.r td:first-child a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .db .new td {
        color: var(--ink-dim);
        cursor: pointer;
      }
      .db .new td:hover {
        color: var(--ink);
      }
      .db .av + .av {
        margin-left: -4px;
      }

      /* home */
      .home {
        max-width: 960px;
        margin: 0 auto;
        padding: 64px 32px 120px;
      }
      .home h1 {
        font: 500 26px/1.1 var(--font-pixel);
        text-transform: uppercase;
        text-align: center;
      }
      .home .sec {
        margin-top: 40px;
      }
      .home .sec .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        color: var(--ink-dim);
      }
      .recent {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .rc {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 148px;
        border: 1px solid var(--line-strong);
        background: var(--bg-raised);
        overflow: hidden;
      }
      .rc canvas {
        display: block;
        width: 100%;
        height: 46px;
        image-rendering: pixelated;
        border-bottom: 1px solid var(--line);
      }
      .rc .rc-ic {
        position: absolute;
        left: 12px;
        top: 28px;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
      }
      .rc b {
        margin: 30px 12px 0;
        font-weight: 500;
        font-size: 13.5px;
        line-height: 18px;
      }
      .rc small {
        margin: auto 12px 10px;
        display: flex;
        align-items: center;
        gap: 6px;
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .rc:hover {
        border-color: var(--ink-muted);
      }
      .cal {
        border: 1px solid var(--line-strong);
      }
      .cal li {
        display: grid;
        grid-template-columns: 96px 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .cal li:last-child {
        border-bottom: 0;
      }
      .cal time {
        font: 400 12px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .cal b {
        font-weight: 500;
      }

      /* slash menu */
      .slash {
        width: 265px;
        max-height: 360px;
        overflow: auto;
      }
      .slash .h {
        padding: 8px 10px 4px;
        color: var(--ink-dim);
      }
      .slash button.r .ico,
      .mn .gl {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        flex: none;
        border: 1px solid var(--line-strong);
        background: var(--bg-raised);
        color: var(--ink);
        font: 600 10px/1 var(--font-mono);
      }
      .slash button.r .k {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .slash .foot2 {
        display: flex;
        justify-content: space-between;
        padding: 8px 10px;
        border-top: 1px solid var(--line);
        margin-top: 4px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }

      /* generic menus */
      .mn {
        width: 268px;
      }
      .mn.subm {
        width: 244px;
      }
      .mn .msrch {
        padding: 4px 4px 6px;
      }
      .mn .ml-list {
        max-height: min(440px, 64vh);
        overflow: auto;
      }
      .mn .h {
        color: var(--ink-dim);
      }
      .mn button.r .ml {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mn button.r .k {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
        display: inline-flex;
      }
      .mn button.r .k.ck {
        color: var(--accent);
      }
      .mn button.r.danger:hover,
      .mn button.r.danger[aria-selected="true"] {
        color: var(--danger);
      }
      .mn button.r[disabled] {
        opacity: 0.38;
        pointer-events: none;
      }
      .mn .swc {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        border: 1px solid var(--line-strong);
        font: 600 12px/1 var(--font-sans);
      }
      .mn .mfoot {
        padding: 8px 10px 6px;
        border-top: 1px solid var(--line);
        margin-top: 4px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .sw {
        position: relative;
        width: 26px;
        height: 14px;
        flex: none;
        border: 1px solid var(--line-strong);
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 8px;
        height: 8px;
        background: var(--ink-dim);
        transition: left 0.12s;
      }
      .sw.on {
        border-color: var(--accent);
      }
      .sw.on::after {
        left: 14px;
        background: var(--accent);
      }

      /* tabs used by the pickers */
      .tabs {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 38px;
        padding: 0 6px;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        height: 37px;
        padding: 0 8px;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        border-bottom: 2px solid transparent;
      }
      .tabs button:hover:not([disabled]) {
        color: var(--ink);
      }
      .tabs button[aria-selected="true"] {
        color: var(--ink);
        border-bottom-color: var(--accent);
      }
      .tabs button[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .tabs .rm {
        margin-left: auto;
      }

      /* icon picker */
      .ip {
        width: 412px;
        padding: 0;
      }
      .ip .bar {
        display: flex;
        gap: 6px;
        padding: 8px;
      }
      .ip .scroll {
        max-height: 300px;
        overflow: auto;
        padding-bottom: 6px;
      }
      .ip .sh {
        padding: 6px 10px 4px;
        color: var(--ink-dim);
      }
      .ip .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 2px;
        padding: 0 8px 4px;
      }
      .ip .grid button {
        display: grid;
        place-items: center;
        aspect-ratio: 1;
        color: var(--ink-muted);
      }
      .ip .grid button:hover {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .ip .grid button[aria-current="true"] {
        outline: 1px solid var(--accent);
        outline-offset: -1px;
        color: var(--accent);
      }
      .ip .grid .px {
        width: 18px;
        height: 18px;
      }

      /* cover picker */
      .cp {
        width: 452px;
        padding: 0;
      }
      .cp .sh {
        padding: 10px 12px 6px;
        color: var(--ink-dim);
      }
      .cp .cg {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 0 12px 8px;
      }
      .cp .cg button {
        position: relative;
        height: 58px;
        border: 1px solid var(--line-strong);
        padding: 0;
        overflow: hidden;
      }
      .cp .cg button canvas {
        display: block;
        width: 200%;
        height: 200%;
        transform: scale(0.5);
        transform-origin: 0 0;
        image-rendering: pixelated;
      }
      .cp .cg button:hover {
        border-color: var(--ink-muted);
      }
      .cp .cg button[aria-current="true"] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .cp .cg button span {
        position: absolute;
        left: 0;
        bottom: 0;
        padding: 1px 4px;
        background: var(--bg);
        font: 400 9.5px/14px var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }

      /* trash */
      .tp {
        width: 420px;
        padding: 0;
      }
      .tp .bar {
        padding: 8px;
      }
      .tp .tl {
        max-height: 320px;
        min-height: 140px;
        overflow: auto;
        padding: 0 4px 4px;
      }
      .trow {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 4px 6px 4px 10px;
        color: var(--ink-muted);
        cursor: pointer;
      }
      .trow:hover {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .trow .tt {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .trow .tt b {
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .trow .tt small {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .trow .icon-btn:hover[data-kill] {
        color: var(--danger);
      }
      .t-empty,
      .cm-empty,
      .s-empty {
        display: grid;
        place-items: center;
        min-height: 130px;
        background-image: var(--hatch);
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .t-empty span,
      .cm-empty span,
      .s-empty span {
        background: var(--bg);
        padding: 2px 8px;
      }
      .tp .tfoot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        color: var(--ink-dim);
        font-size: 12px;
        line-height: 16px;
      }

      /* share */
      .shp {
        width: 380px;
        padding: 0;
      }
      .shp .inv {
        display: flex;
        gap: 6px;
        padding: 10px;
      }
      .shp .who {
        padding: 0 10px 6px;
      }
      .shp .who div {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
      }
      .shp .who div span.n {
        flex: 1;
        min-width: 0;
      }
      .shp .who small {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .shp .sfoot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        border-top: 1px solid var(--line);
      }

      /* overlays */
      .ov {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 10vh 8px 0;
        background: color-mix(in srgb, var(--bg-sunk) 72%, transparent);
      }
      .ov.open {
        display: flex;
      }
      .modal {
        display: flex;
        flex-direction: column;
        width: min(760px, 100%);
        max-height: 80vh;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
        position: relative;
      }
      .modal::before {
        content: "";
        position: absolute;
        top: -4px;
        left: -4px;
        width: 7px;
        height: 7px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .s-in {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-dim);
        flex: none;
      }
      .s-in input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: none;
        outline: none;
        font: 400 16px/1 var(--font-sans);
        color: var(--ink);
      }
      .s-f {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        flex: none;
        flex-wrap: wrap;
      }
      .s-f .seg button {
        height: 24px;
      }
      .tgl {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      .tgl[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--ink);
      }
      .tgl[aria-pressed="true"] .px {
        color: var(--accent);
      }
      .s-b {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 290px;
        flex: 1;
        min-height: 320px;
        overflow: hidden;
      }
      .s-l {
        overflow: auto;
        padding: 6px;
      }
      .s-l .h {
        padding: 6px 10px 4px;
        color: var(--ink-dim);
      }
      .s-r {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        padding: 7px 10px;
        text-align: left;
        color: var(--ink-muted);
      }
      .s-r .px {
        margin-top: 1px;
      }
      .s-r .st {
        flex: 1;
        min-width: 0;
      }
      .s-r .st b {
        display: block;
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .s-r .st small {
        display: block;
        font-size: 12px;
        line-height: 17px;
        color: var(--ink-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .s-r .k {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
        white-space: nowrap;
      }
      .s-r[aria-selected="true"] {
        background: var(--bg-raised);
        color: var(--ink);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      mark {
        background: none;
        color: var(--accent);
        font-weight: 600;
      }
      .s-pv {
        border-left: 1px solid var(--line);
        background: var(--bg-raised);
        padding: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .s-pv .pv-ic {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--line-strong);
        background: var(--bg);
        margin-bottom: 6px;
      }
      .s-pv .pv-ic .px {
        width: 26px;
        height: 26px;
      }
      .s-pv h3 {
        font: 700 19px/24px var(--font-sans);
        margin-bottom: 6px;
      }
      .s-ft {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 34px;
        padding: 0 12px;
        border-top: 1px solid var(--line);
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
        flex: none;
      }
      .s-ft span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .mb-h {
        font-weight: 600;
        font-size: 14px;
        margin-top: 6px;
      }
      .mb-h3 {
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin-top: 4px;
      }
      .mb-p,
      .mb-l {
        font-size: 12.5px;
        line-height: 18px;
        color: var(--ink-muted);
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .mb-b {
        width: 4px;
        height: 4px;
        background: var(--ink-muted);
        margin-top: 7px;
        flex: none;
      }
      .mb-c {
        width: 10px;
        height: 10px;
        border: 1px solid var(--ink-muted);
        margin-top: 4px;
        flex: none;
      }
      .mb-c.on {
        background: var(--accent);
        border-color: var(--accent);
      }
      .mb-t {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
        border: 1px dashed var(--line-strong);
        padding: 4px 6px;
      }
      .mb-hr {
        border: 0;
        border-top: 1px solid var(--line-strong);
        margin: 4px 0;
      }

      /* templates */
      .tm {
        width: min(980px, 100%);
        max-height: 82vh;
      }
      .tm-h {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .tm-h .fi {
        width: 220px;
        margin-left: auto;
      }
      .tm-b {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        flex: 1;
        min-height: 0;
      }
      .tm-g {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
        padding: 16px;
        overflow: auto;
        align-content: start;
      }
      .tc {
        display: flex;
        flex-direction: column;
        text-align: left;
        border: 1px solid var(--line-strong);
        background: var(--bg-raised);
      }
      .tc[aria-current="true"] {
        border-color: var(--accent);
      }
      .tc .tc-pv {
        position: relative;
        height: 118px;
        padding: 14px;
        border-bottom: 1px solid var(--line);
        background-image: var(--hatch);
        background-color: var(--bg-sunk);
        overflow: hidden;
      }
      .tc .tc-pv .tc-doc {
        background: var(--bg);
        border: 1px solid var(--line-strong);
        padding: 10px;
        height: 120px;
      }
      .tc .tc-pv .tc-doc .px {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }
      .sk {
        height: 5px;
        background: var(--line-strong);
        margin-top: 7px;
      }
      .sk.t {
        height: 8px;
        background: var(--ink-dim);
        width: 60%;
      }
      .tc .tc-t {
        padding: 10px 12px 12px;
      }
      .tc b {
        display: block;
        font-weight: 600;
        font-size: 14px;
      }
      .tc small {
        display: block;
        margin-top: 4px;
        color: var(--ink-dim);
        font-size: 12.5px;
        line-height: 17px;
      }
      .tm-pv {
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .tm-pv .pv-body {
        flex: 1;
        overflow: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .tm-pv .pv-ic {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--line-strong);
        background: var(--bg-raised);
        margin-bottom: 6px;
      }
      .tm-pv .pv-ic .px {
        width: 26px;
        height: 26px;
      }
      .tm-pv h3 {
        font: 700 20px/26px var(--font-sans);
      }
      .tm-pv .pv-act {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
      }

      /* confirm */
      .cf {
        width: min(400px, 100%);
        padding: 20px;
        margin-top: 12vh;
      }
      .cf h3 {
        font: 600 16px/22px var(--font-sans);
      }
      .cf p {
        margin-top: 8px;
        color: var(--ink-muted);
        font-size: 13.5px;
        line-height: 20px;
      }
      .cf .row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      /* comments */
      .cmts {
        width: 340px;
        flex: none;
        border-left: 1px solid var(--line);
        display: none;
        flex-direction: column;
        min-height: 0;
        background: var(--bg);
      }
      .cmts.open {
        display: flex;
      }
      .cm-h {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 14px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .cm-h .seg {
        margin-left: auto;
      }
      .cm-h .seg button {
        height: 24px;
      }
      .cm-l {
        flex: 1;
        overflow: auto;
        padding: 12px;
      }
      .cm {
        padding: 12px;
        border: 1px solid var(--line);
        margin-bottom: 8px;
      }
      .cm:hover {
        border-color: var(--line-strong);
      }
      .cm-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cm-meta b {
        font-weight: 600;
      }
      .cm-meta time {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .cm-meta .icon-btn {
        margin-left: auto;
      }
      .q {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        border-left: 2px solid var(--accent);
        padding-left: 8px;
        margin-top: 8px;
        color: var(--ink-muted);
        font-size: 12.5px;
        line-height: 18px;
      }
      .q span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cm p {
        margin-top: 8px;
        font-size: 13.5px;
        line-height: 20px;
      }
      .cm-c {
        border-top: 1px solid var(--line);
        padding: 12px;
        flex: none;
      }
      .cm-c .q {
        margin: 0 0 8px;
      }
      .cm-c textarea {
        display: block;
        width: 100%;
        min-height: 64px;
        resize: vertical;
        padding: 8px;
        background: var(--bg-sunk);
        border: 1px solid var(--line-strong);
        outline: none;
        font: 400 13.5px/20px var(--font-sans);
      }
      .cm-c textarea:focus {
        border-color: var(--accent);
      }
      .cm-cb {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }

      /* toast */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 44px;
        z-index: 90;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 12px;
        height: 36px;
        padding: 0 6px 0 14px;
        background: var(--ink);
        color: var(--bg);
        font-size: 13px;
        white-space: nowrap;
      }
      .toast.open {
        display: flex;
      }
      .toast button {
        height: 26px;
        padding: 0 8px;
        border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent);
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--bg);
      }
      .toast button:hover {
        border-color: var(--bg);
      }

      @media (max-width: 860px) {
        :root {
          --margin: 20px;
        }
        .blk .gut {
          display: none;
        }
        .p-title {
          font-size: 30px;
          line-height: 38px;
        }
        .cover {
          height: 130px;
        }
        .ed {
          display: none;
        }
        .cmts {
          position: absolute;
          inset: 44px 0 0 0;
          width: auto;
          z-index: 5;
        }
        .crumb {
          overflow: hidden;
        }
        .crumb a,
        .crumb .sep,
        [data-share],
        .lockc {
          display: none !important;
        }
        .s-b,
        .tm-b {
          grid-template-columns: 1fr;
        }
        .s-pv {
          display: none;
        }
        .tm-pv {
          border-left: 0;
          border-top: 1px solid var(--line);
          max-height: 40vh;
        }
        .tm-h .fi {
          width: auto;
          flex: 1;
          min-width: 0;
        }
        .tm-h .eyebrow {
          display: none;
        }
        .ip,
        .cp,
        .tp,
        .shp {
          width: calc(100vw - 16px);
        }
        .ip .grid {
          grid-template-columns: repeat(9, 1fr);
        }
      }
    </style>

        const rows = ICONS[name];
        if (!rows) return "";
        const n = rows.length;
        let a = "",
          b = "";
        rows.forEach((r, y) => {
          let x = 0;
          while (x < r.length) {
            const c = r[x];
            if (c !== "#" && c !== "o") {
              x++;
              continue;
            }
            const s = x;
            while (x < r.length && r[x] === c) x++;
            const d = `M${s} ${y}h${x - s}v1h-${x - s}z`;
            if (c === "#") a += d;
            else b += d;
          }
        });
        return `<svg class="px" viewBox="0 0 ${n} ${n}" aria-hidden="true"><path fill="currentColor" d="${a}"/>${b ? `<path class="o" fill="currentColor" d="${b}"/>` : ""}</svg>`;
      }

        const m = [
          [0, 8, 2, 10],
          [12, 4, 14, 6],

        ];
        return (m[y & 3][x & 3] + 0.5) / 16;

      function ditherCover(canvas, seed = 1) {
        const cs = getComputedStyle(document.documentElement),
          acc = cs.getPropertyValue("--accent").trim(),
          bg = cs.getPropertyValue("--bg-sunk").trim();
        const w = (canvas.width = Math.ceil(canvas.clientWidth / 4)),
          h = (canvas.height = Math.ceil(canvas.clientHeight / 4));
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = acc;
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const v =
              0.5 +
              0.5 * Math.sin((x / w) * Math.PI * (1.2 + seed * 0.3) + seed) * (1 - y / h) -
              0.35 +
              (y / h) * 0.15 * Math.cos(x / 9 + seed);
            if (v > bayer(x, y)) ctx.fillRect(x, y, 1, 1);
          }

      // ------------------------------------------------------------ covers
      const PATTERNS = [
        ["stripes", "Stripes"],
        ["checker", "Checker"],

        ["steps", "Steps"],
        ["fade", "Fade"],
        ["horizon", "Horizon"],
        ["noise", "Noise"],
      ];
      function patternCover(canvas, kind) {
        const cs = getComputedStyle(document.documentElement),
          acc = cs.getPropertyValue("--accent").trim(),
          bg = cs.getPropertyValue("--bg-sunk").trim(),
          dim = cs.getPropertyValue("--line-strong").trim();
        const w = (canvas.width = Math.max(8, Math.ceil(canvas.clientWidth / 4))),
          h = (canvas.height = Math.max(4, Math.ceil(canvas.clientHeight / 4)));
        const c = canvas.getContext("2d");
        c.fillStyle = bg;
        c.fillRect(0, 0, w, h);
        c.fillStyle = kind === "grid" ? dim : acc;
        let r = 7;
        const rnd = () => {
          r = (r * 16807) % 2147483647;
          return r / 2147483647;
        };
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            let on = false;
            switch (kind) {
              case "stripes":
                on = (x + y) % 10 < 3;
                break;
              case "checker":
                on = ((x >> 3) + (y >> 3)) % 2 === 0 && bayer(x, y) < 0.75;
                break;
              case "dots":
                on = x % 6 < 2 && y % 6 < 2;
                break;
              case "grid":
                on = x % 12 === 0 || y % 12 === 0;
                break;
              case "steps": {
                const col = Math.floor(x / Math.max(1, w / 10));
                on = h - y < ((((col * 7) % 10) + 1) * h) / 11 && bayer(x, y) < 0.8;
                break;
              }
              case "fade":
                on = bayer(x, y) < 1 - y / h;
                break;
              case "horizon":
                on = bayer(x, y) < Math.max(0, (y / h - 0.45) * 2) || y === Math.floor(h * 0.45);
                break;
              case "noise":
                on = rnd() < 0.18 + 0.3 * (x / w);
                break;
            }
            if (on) c.fillRect(x, y, 1, 1);
          }
        if (kind === "grid") {
          c.fillStyle = acc;
          for (let y = 0; y < h; y += 12)
            for (let x = 0; x < w; x += 12)
              if ((x * 7 + y * 3) % 5 === 0) c.fillRect(x - 1, y - 1, 3, 3);
        }
      }
      function drawCover(c, v) {

      const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

        t = esc(t);

        return t.replace(new RegExp("(" + reEsc(esc(q)) + ")", "ig"), "<mark>$1</mark>");

            e.preventDefault();

            (b.onclick = () => {
              S.scope = b.dataset.sc;

      function runSearch() {
        const q = S.q.trim().toLowerCase();
        const ok = (k) =>
          PAGES[k] && !PAGES[k].trashed && (S.scope === "all" || PAGES[k].space === S.scope);
        if (!q) {
          S.res = recentPages
            .filter(ok)
            .slice(0, 8)
            .map((k) => ({ k }));
          S.head = "Recent";
        } else {
          S.res = Object.keys(PAGES)
            .filter(ok)
            .map((k) => {
              const t = PAGES[k].title || "Untitled",
                ti = t.toLowerCase().indexOf(q);
              const body = S.titleOnly ? "" : bodyText(k),
                bi = body.toLowerCase().indexOf(q);
              if (ti < 0 && bi < 0) return null;
              let st = Math.max(0, bi - 32);
              if (st > 0) {
                const sp = body.indexOf(" ", st);
                if (sp >= 0 && sp < bi) st = sp + 1;
              }
              const snip =
                bi >= 0
                  ? (st > 0 ? "…" : "") +
                    body.slice(st, bi + q.length + 60) +
                    (bi + q.length + 60 < body.length ? "…" : "")
                  : "";
              return { k, score: ti >= 0 ? (ti === 0 ? 0 : 1) : 2, snip };
            })
            .filter(Boolean)
            .sort((a, b) => a.score - b.score);
          S.head = S.res.length ? "Best matches" : "";

        drawResults();

        const menu = `<button class="icon-btn menu" id="menuBtn" aria-label="Navigation">${I("sidebar-left")}</button>`;
        if (!k)
          return `<header class="head">${menu}<div class="crumb"><b>${px("home-01")}Home</b></div><div class="acts"><button class="btn ghost" data-tplopen>${px("file-01")}Templates</button></div></header>`;
        const p = PAGES[k],
          fav = FAVS.includes(k);
        return `<header class="head">${menu}<div class="crumb">${crumbs(k)}</div><div class="acts">${p.locked ? `<button class="chip lockc" data-unlock title="Unlock the page">${px("lock")}Locked</button>` : ""}<span class="ed">Edited ${esc(p.edited)}</span><button class="btn ghost" data-share>Share</button><button class="icon-btn${cmOpen ? " on" : ""}" data-cm aria-label="Comments" title="Comments">${I("message-01")}</button><button class="icon-btn${fav ? " on" : ""}" data-fav aria-label="Favourite" title="${fav ? "Remove from favourites" : "Add to favourites"}">${I(fav ? "star-fill" : "star")}</button><button class="icon-btn" data-more aria-label="More" title="Style, export and more">${I("more-horizontal")}</button></div></header>`;
      }
      function pageView(k) {
        const p = PAGES[k];
        current = k;
        const ro = p.locked || p.trashed;
        const cover =
          p.cover != null
            ? `<div class="cover" style="--pos:${p.coverPos ?? 0.5}"><canvas data-cv="${p.cover}"></canvas><span class="rp-hint">Drag to reposition</span><div class="cv-acts">${ro ? "" : `<button data-chcover>Change cover</button><button data-repos>Reposition</button>`}</div></div>`
            : "";
        return (
          head(k) +
          `<div class="pwrap"><div class="body" id="body">
    ${p.trashed ? `<div class="tbanner">${px("delete-02")}<span>This page is in Trash.</span><button class="btn" data-restorepage>Restore page</button><button class="btn danger" data-delpage>Delete forever</button></div>` : ""}
    ${cover}
    <div class="page${p.full ? " full" : ""}${p.small ? " small" : ""}${ro ? " locked" : ""}">
      ${p.icon ? `<button class="p-icon ${p.cover == null ? "nocover" : ""}" data-icon aria-label="Change icon" title="Change icon">${px(p.icon)}</button>` : `<div class="${p.cover == null ? "p-gap" : ""}"></div>`}
      <div class="p-tools">${ro ? "" : `${p.icon ? "" : `<button class="btn ghost" data-addicon>${px("smile")}Add icon</button>`}${p.cover == null ? `<button class="btn ghost" data-addcover>${px("image-01")}Add cover</button>` : ""}`}<button class="btn ghost" data-addcm>${px("message-01")}Add comment</button></div>
      <h1 class="p-title" contenteditable="${!ro}" spellcheck="false" id="ptitle">${esc(p.title)}</h1>
      ${
        p.props
          ? `<dl class="p-props">
        <div class="p-prop"><dt>${px("chart-increase")}Status</dt><dd><span class="chip"><span class="sq" style="background:var(--warning)"></span>In progress</span></dd></div>
        <div class="p-prop"><dt>${px("user")}Owner</dt><dd><span class="av me">CR</span>Camille Roy</dd></div>
        <div class="p-prop"><dt>${px("building-01")}Company</dt><dd><span class="mention" data-href="crm.html#/companies/lyon-logistique"><span class="logo">LL</span>Lyon Logistique<span class="via">CRM</span></span></dd></div>
        <div class="p-prop"><dt>${px("calendar-03")}Opening</dt><dd class="mono" style="font-size:12.5px">January 12, 2027</dd></div></dl>`
          : ""
      }
      <div class="blocks" id="blocks"></div>
    </div></div><aside class="cmts${cmOpen ? " open" : ""}" id="cmts" aria-label="Comments"></aside></div>`
        );
      }
      function homeView() {
        current = null;
        const recent = recentPages.filter((k) => PAGES[k] && !PAGES[k].trashed).slice(0, 6);
        return (
          head(null) +
          `<div class="body"><div class="home">
    <h1>Good afternoon, Camille<span style="color:var(--accent)">.</span></h1>
    <div class="sec"><span class="eyebrow">${px("clock-01")}Recently visited</span><div class="recent">${recent.map((k, j) => `<a class="rc" href="#/page/${k}"><canvas data-cv="${PAGES[k].cover ?? j}"></canvas><span class="rc-ic">${px(ico(PAGES[k]))}</span><b>${esc(PAGES[k].title || "Untitled")}</b><small><span class="av${j % 2 ? "" : " me"}" style="width:14px;height:14px;font-size:7px">${j % 2 ? "HB" : "CR"}</span>${esc(PAGES[k].edited)}</small></a>`).join("")}</div></div>
    <div class="sec"><span class="eyebrow">${px("calendar-03")}Upcoming meetings</span><ul class="cal">
      <li><time>Today 16:00</time><b>Weekly operations</b><button class="btn ghost" data-notes="Weekly operations">${px("note-01")}Take notes</button></li>
      <li><time>Thu 10:30</time><span><b>Signature, Lyon Logistique</b> <span class="mention" data-href="crm.html#/companies/lyon-logistique"><span class="logo">LL</span>CRM<span class="via">deal</span></span></span><button class="btn ghost" data-notes="Signature, Lyon Logistique">${px("note-01")}Take notes</button></li>
      <li><time>Fri 9:00</time><b>Stock count, A aisles</b><button class="btn ghost" data-notes="Stock count, A aisles">${px("note-01")}Take notes</button></li></ul></div>
  </div></div>`
        );
      }
      function bindPage() {
        const p = PAGES[current],
          k = current,
          on = (sel, fn) => {
            const el = $(sel);
            if (el)
              el.onclick = (e) => {
                e.stopPropagation();
                fn(el, e);
              };
          };
        const t = $("#ptitle");
        t.oninput = () => {
          p.title = t.textContent;
          touch();
          drawTree();
          const ct = $(".crumb .ct");
          if (ct) ct.textContent = p.title || "Untitled";
        };
        t.onkeydown = (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            focusBlock(0, false);
          }
        };
        on("[data-icon]", (el) => openIconPicker(el));
        on("[data-addicon]", () => {
          const pick = [
            "note-01",
            "bulb",
            "rocket-01",
            "book-open-01",
            "flag-01",
            "target-01",
            "compass",
            "anvil",
            "truck",
            "briefcase-01",
          ];
          setIcon(pick[Math.floor(Math.random() * pick.length)]);
        });
        on("[data-addcover]", () => {
          p.cover = Math.floor(Math.random() * 8);
          p.coverPos = 0.5;
          touch();
          rerender();
        });
        on("[data-addcm]", () => toggleComments(true));
        on("[data-cm]", () => toggleComments());
        on("[data-chcover]", (el) => openCoverPicker(el));
        on("[data-repos]", () => startRepos());
        on("[data-fav]", () => toggleFav(k));
        on("[data-more]", (el) =>
          openMenu(el, pageItems(k), {
            search: "Search actions…",
            how: "below-end",
            foot: `Last edited by Camille Roy<br>${esc(p.edited)}<br>${words(p)} words`,
          }),
        );
        on("[data-share]", (el) => openShare(el));
        on("[data-unlock]", () => {
          p.locked = false;
          rerender();
          toast("Page unlocked");
        });
        on("[data-restorepage]", () => {
          const root = (() => {
            let c = k;
            while (c && !PAGES[c].trashRoot) c = PAGES[c].parent;
            return c || k;
          })();
          restorePage(root);
          toast("Page restored");
        });
        on("[data-delpage]", () => {
          let c = k;
          while (c && !PAGES[c].trashRoot) c = PAGES[c].parent;
          askDelete(c || k);
        });
        $$("#body .p-props .mention").forEach(
          (m) =>
            (m.onclick = (e) => {
              e.preventDefault();
              location.href = m.dataset.href;
            }),
        );
      }
      function bindHome() {
        $$("[data-notes]").forEach(
          (b) => (b.onclick = () => useTemplate("meeting", b.dataset.notes, "team")),
        );
        $$(".home .mention").forEach(
          (m) =>
            (m.onclick = (e) => {
              e.preventDefault();
              location.href = m.dataset.href;
            }),
        );
        const tb = $("[data-tplopen]");
        if (tb)
          tb.onclick = (e) => {
            e.stopPropagation();
            openTemplates();
          };
      }
      function route(keep) {
        const path = location.hash.replace(/^#\/?/, "") || "home";
        const panel = $("#panel");
        closeSlash();
        repos = null;
        const k = path.startsWith("page/") ? path.slice(5) : null;
        if (k && PAGES[k]) {
          if (!keep) recentPages = [k, ...recentPages.filter((x) => x !== k)].slice(0, 12);
          panel.innerHTML = pageView(k);
        } else panel.innerHTML = homeView();
        fillIcons(panel);
        if (current) {
          drawBlocks();
          bindPage();
          drawComments();
        } else bindHome();
        drawCovers(panel);
        const mb = $("#menuBtn");
        if (mb)
          mb.onclick = (e) => {
            e.stopPropagation();
            $("#app").classList.toggle("drawer");
          };
        if (!keep) $("#app").classList.remove("drawer");
        markNav();
      }
      function rerender() {
        const b = $("#body"),
          st = b ? b.scrollTop : 0;
        route(true);
        const b2 = $("#body");
        if (b2) b2.scrollTop = st;
      }
      addEventListener("hashchange", () => {
        closePops();
        cmOpen = false;
        cmQuote = "";
        route();
      });

      // ------------------------------------------------------------ chrome
      $("[data-newpage]").onclick = () => goNew(createPage({ space: "private" }));
      $$("[data-fold]").forEach(
        (h) =>
          (h.onclick = (e) => {
            const add = e.target.closest("[data-addspace]");
            if (add) {
              e.stopPropagation();
              goNew(createPage({ space: add.dataset.addspace }));
              return;
            }
            const o = h.getAttribute("aria-expanded") !== "false";
            h.setAttribute("aria-expanded", !o);
            h.nextElementSibling.hidden = o;
          }),
      );
      const wsBtn = $("#wsBtn"),
        wsPop = $("#wsPop");
      wsBtn.onclick = (e) => {
        e.stopPropagation();
        if (wsPop.classList.contains("open")) {
          closePops();
          return;
        }
        closePops();
        place(wsPop, wsBtn.getBoundingClientRect());
      };
      $("#searchBtn").onclick = (e) => {
        e.stopPropagation();
        openSearch();
      };
      $("#tplBtn").onclick = (e) => {
        e.stopPropagation();
        openTemplates();
      };
      $("#trashBtn").onclick = (e) => {
        e.stopPropagation();
        openTrash($("#trashBtn"));
      };
      $("#inboxBtn").onclick = (e) => {
        e.stopPropagation();
        openMenu(
          e.currentTarget,
          [
            {
              icon: "message-01",
              label: "<b>Hugo</b> commented on Lyon depot launch",
              note: "2 h",
              act: () => {
                location.hash = "#/page/lyon";
                setTimeout(() => toggleComments(true), 30);
              },
            },
            {
              icon: "user",
              label: "<b>Léa</b> commented on Lyon depot launch",
              note: "1 h",
              act: () => {
                location.hash = "#/page/lyon";
                setTimeout(() => toggleComments(true), 30);
              },
            },
            {
              icon: "book-open-01",
              label: "<b>Tom</b> commented on Operations handbook",
              note: "Nov 14",
              act: () => {
                location.hash = "#/page/handbook";
                setTimeout(() => toggleComments(true), 30);
              },
            },
          ],
          { title: "Inbox", foot: "You're all caught up." },
        );
      };
      $("#setBtn").onclick = (e) => {
        e.stopPropagation();
        openMenu(
          e.currentTarget,
          [
            { icon: "moon-02", label: "Switch theme", act: switchTheme },
            { icon: "file-01", label: "Templates", act: openTemplates },
            { icon: "delete-02", label: "Trash", act: () => openTrash($("#trashBtn")) },
            { sep: 1 },
            {
              icon: "arrow-left-01",
              label: "Back to the console",
              act: () => {
                location.href = "console-home.html#/home";
              },
            },
          ],
          { title: "Notes" },
        );
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".pop:not(.slash),.ov")) closePops();
        if (!e.target.closest(".slash,.tx")) closeSlash();
        if (!e.target.closest(".side,#menuBtn")) $("#app").classList.remove("drawer");
      });
      $$(".ov").forEach((o) =>
        o.addEventListener("mousedown", (e) => {
          if (e.target === o) o.classList.remove("open");
        }),
      );
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          sOv.classList.contains("open") ? sOv.classList.remove("open") : openSearch();
          return;
        }
        if (e.key !== "Escape" || e.defaultPrevented) return;
        if ($("#confirm").classList.contains("open")) {
          $("#confirm").classList.remove("open");
          return;
        }
        if (subEl.classList.contains("open")) {
          closeSub();
          return;
        }
        if ($(".pop.open:not(.slash)")) {
          closePops();
          return;
        }
        const ov = $(".ov.open");
        if (ov) {
          ov.classList.remove("open");
          return;
        }
        if (repos) {
          repos.cancel();
          return;
        }
        if (cmOpen && !e.target.closest(".tx,#ptitle")) {
          toggleComments(false);
        }
      });
      function switchTheme() {
        const r = document.documentElement;
        r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
        drawCovers();
      }
      $("[data-theme-toggle]").onclick = (e) => {
        e.stopPropagation();
        switchTheme();
      };
      let rz;
      addEventListener("resize", () => {
        clearTimeout(rz);
        rz = setTimeout(() => {
          drawCovers();
        }, 100);
      });
      drawTree();
      route();
    </script>
  </body>
</html>
