              $$("a", out).forEach(
                (a) =>
                  (a.onclick = () => {
                    if (a.hasAttribute("data-all")) {
                      S.status = "all";
                    }
                    closeDlg();
                  }),
              );
            };
            const hl = () => $$("a", out).forEach((a, i) => a.classList.toggle("act", i === act));
            inp.oninput = draw;
            inp.onkeydown = (e) => {
              const as = $$("a", out);
              if (e.key === "ArrowDown") {
                e.preventDefault();
                act = Math.min(as.length - 1, act + 1);
                hl();
              }
              if (e.key === "ArrowUp") {
                e.preventDefault();
                act = Math.max(0, act - 1);
                hl();
              }
              if (e.key === "Enter" && as[act]) {
                as[act].click();
              }
            };
            draw();
            inp.focus();
          },
        );
      }
      function keysDlg() {
        const K = [
          ["Next conversation", "J"],
          ["Previous conversation", "K"],
          ["Reply", "R"],
          ["Internal note", "N"],
          ["Assign", "A"],
          ["Close", "E"],
          ["Select", "X"],
          ["Search", "/"],
          ["Send", "⌘ ↵"],
          ["Close menus", "Esc"],
        ];
        dlg(
          `<div class="dlg-h"><b>Keyboard shortcuts</b><button class="icon-btn" data-x aria-label="Close">${I("multiplication-sign")}</button></div><div class="dlg-b"><div class="keys">${K.map(
            ([l, k]) =>
              `<div>${l}<span>${k
                .split(" ")
                .map((x) => `<kbd>${x}</kbd>`)
                .join("")}</span></div>`,
          ).join("")}</div></div>`,
          (d) => ($("[data-x]", d).onclick = closeDlg),
        );
      }
      function newViewDlg() {
        const f = { team: "any", pr: "any", tag: "any" };
        const opts = {
          team: [
            "Team",
            { any: "Any team", ...Object.fromEntries(Object.keys(TEAMS).map((t) => [t, t])) },
          ],
          pr: [
            "Priority",
            {
              any: "Any priority",
              ...Object.fromEntries(Object.keys(PRI).map((k) => [k, PRI[k][0]])),
            },
          ],
          tag: ["Tag", { any: "Any tag", ...Object.fromEntries(TAGS.map((t) => [t, t])) }],
        };
        const body = () =>
          `<div class="dlg-h"><b>New view</b><button class="icon-btn" data-x aria-label="Close">${I("multiplication-sign")}</button></div><div class="dlg-b"><div class="fld"><label>Name</label><input class="inp" id="vN" placeholder="e.g. Cold room"></div><div class="fld"><label>Conversations where</label><div class="cond">${Object.keys(
            opts,
          )
            .map(
              (k) =>
                `<button class="sel" data-vf="${k}">${opts[k][1][f[k]]}${px("arrow-down-01")}</button>`,
            )
            .join(
              "",
            )}</div></div></div><div class="dlg-f"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="vOk">Create view</button></div>`;
        const bindD = (d) => {
          $$("[data-x]", d).forEach((b) => (b.onclick = closeDlg));
          $$("[data-vf]", d).forEach(
            (b) =>
              (b.onclick = (e) => {
                e.stopPropagation();
                const k = b.dataset.vf;
                openMenu(
                  b,
                  {
                    items: Object.entries(opts[k][1]).map(([v, l]) => ({ v, l, sel: f[k] === v })),
                  },
                  (v) => {
                    f[k] = v;
                    const n = $("#vN").value;
                    d.innerHTML = body();
                    $("#vN").value = n;
                    bindD(d);
                  },
                );
              }),
          );
          $("#vOk", d).onclick = () => {
            const n = $("#vN").value.trim() || "Untitled view";
            const id = "u" + Date.now().toString(36);
            const ff = { ...f };
            SAVED.push({
              id,
              l: n,
              color: "var(--ink-muted)",
              f: (c) =>
                (ff.team === "any" || c.team === ff.team) &&
                (ff.pr === "any" || c.pr === ff.pr) &&
                (ff.tag === "any" || c.tags.includes(ff.tag)),
            });
            closeDlg();
            toast(`View “${esc(n)}” created`);
            location.hash = "#/inbox/v-" + id;
          };
        };
        dlg(body(), (d) => {
          bindD(d);
          $("#vN").focus();
        });
      }
      function newConvDlg() {
        dlg(
          `<div class="dlg-h"><b>New conversation</b><button class="icon-btn" data-x aria-label="Close">${I("multiplication-sign")}</button></div><div class="dlg-b">
    <div class="fld"><label>To</label><button class="sel" id="ncTo" style="width:100%">Sophie Garnier · Lyon Logistique${px("arrow-down-01")}</button></div>
    <div class="fld"><label>Subject</label><input class="inp" id="ncS" placeholder="Subject"></div>
    <div class="fld"><label>Message</label><textarea class="inp" id="ncB" rows="5" placeholder="Write the first message…"></textarea></div></div>
    <div class="dlg-f"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="ncOk">Send</button></div>`,
          (d) => {
            let ct = "sg";
            $$("[data-x]", d).forEach((b) => (b.onclick = closeDlg));
            $("#ncTo").onclick = (e) => {
              e.stopPropagation();
              openMenu(
                e.currentTarget,
                {
                  search: "Search contacts…",
                  items: Object.keys(CT).map((k) => ({
                    v: k,
                    l: CT[k][0],
                    sub: CO[CT[k][3]].n,
                    sel: k === ct,
                  })),
                },
                (v) => {
                  ct = v;
                  $("#ncTo").innerHTML = `${CT[v][0]} · ${CO[CT[v][3]].n}${px("arrow-down-01")}`;
                },
              );
            };
            $("#ncS").focus();
            $("#ncOk").onclick = () => {
              const s = $("#ncS").value.trim(),
                b = $("#ncB").value.trim();
              if (!s || !b) {
                toast("Add a subject and a message");
                return;
              }
              const id = Math.max(...C.map((c) => c.id)) + 1;
              C.push({
                id,
                s,
                ct,
                ch: "email",
                st: "open",
                pr: "normal",
                as: ME,
                team: "Support",
                tags: [],
                unread: false,
                at: el(),
                sla: null,
                res: 1440,
                links: [],
                met: [],
                msgs: [d_("Today"), { k: "out", w: ME, t: clock(), b, fresh: true }],
              });
              closeDlg();
              toast(`#${id} sent to ${CT[ct][0]}`);
              S.view = "mine";
              S.status = "open";
              go(id);
            };
          },
        );
      }

      // ------------------------------------------------------------ router
      function route() {
        const parts = (location.hash.replace(/^#\/?/, "") || "inbox/mine").split("/");
        closeMenu(true);
        if (parts[0] === "inbox") {
          const v = parts[1] || "mine";
          if (v !== S.view) {
            S.picked.clear();
          }
          S.view = VIEWS[v] || SAVED.some((x) => "v-" + x.id === v) ? v : "mine";
          S.conv = parts[2] ? +parts[2] : ((S.explicit = false), null);
          S.explicit = !!parts[2];
          inbox();
        } else if (parts[0] === "tickets") tickets();
        else if (parts[0] === "settings") (parts[1] === "macros" ? macrosPage : slaPage)();
        else if (parts[0] === "kb")
          parts[1] ? (parts[2] === "preview" ? kbPreview(parts[1]) : kbEdit(parts[1])) : kbList();
        else if (parts[0] === "reports") reports();
        else {
          location.hash = "#/inbox/mine";
          return;
        }
        if (parts[0] !== "inbox") nav();
        $("#app").classList.remove("drawer");
      }
      addEventListener("hashchange", route);
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#wsPop")) $("#wsPop").classList.remove("open");
        const m = $("#mn");
        if (m.classList.contains("open") && m._ready && !e.target.closest("#mn")) closeMenu();
        if (e.target.closest("#menuBtn")) $("#app").classList.toggle("drawer");
        else if (!e.target.closest(".side")) $("#app").classList.remove("drawer");
      });
      $("#scrim").addEventListener("mousedown", (e) => {
        if (e.target.id === "scrim") closeDlg();
      });
      document.addEventListener("keydown", (e) => {
        const m = $("#mn");
        if (e.key === "Escape") {
          if (closeMenu() || closeDlg()) {
            e.preventDefault();
            return;
          }
          $("#wsPop").classList.remove("open");
          $("#app").classList.remove("drawer");
          if (S.picked.size && location.hash.startsWith("#/inbox")) {
            S.picked.clear();
            inbox();
          }
          return;
        }
        if (m.classList.contains("open") && m._key) {
          m._key(e);
          return;
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          searchDlg();
          return;
        }
        const tgt = e.target;
        if (tgt.closest && tgt.closest("input,textarea,[contenteditable]")) return;
        if (e.metaKey || e.ctrlKey || e.altKey || $("#scrim").classList.contains("open")) return;
        if (e.key === "/") {
          e.preventDefault();
          searchDlg();
          return;
        }
        if (e.key === "?") {
          keysDlg();
          return;
        }
        if (!location.hash.startsWith("#/inbox") && location.hash !== "" && location.hash !== "#/")
          return;
        const list = listFor(S.view),
          c = S.conv && byId(S.conv),
          i = list.findIndex((x) => x.id === S.conv);
        if (e.key === "j" || e.key === "k") {
          if (!list.length) return;
          const n =
            e.key === "j"
              ? list[Math.min(list.length - 1, i + 1)]
              : list[Math.max(0, i < 0 ? 0 : i - 1)];
          go(n.id);
          requestAnimationFrame(() => {
            const r = $(`.cv[data-cv="${n.id}"]`);
            r && r.scrollIntoView({ block: "nearest" });
          });
        }
        if (!c) return;
        if (e.key === "e" && c.st !== "closed") closeConv(c, true);
        if (e.key === "r" || e.key === "n") {
          e.preventDefault();
          const d = draft(c.id);
          d.mode = e.key === "r" ? "reply" : "note";
          refreshComposer(c);
          $("#ta").focus();
        }
        if (e.key === "a") {
          e.preventDefault();
          const row = $("#asRow") || $("#hAssign");
          if (row && row.offsetParent) editAttr(c, "as", row);
          else editAttr(c, "as", $("#hMore"));
        }
        if (e.key === "x") togglePick(c.id);
      });
      $("#wsBtn").onclick = (e) => {
        e.stopPropagation();
        const r = $("#wsBtn").getBoundingClientRect();
        const p = $("#wsPop");
        p.style.left = r.left + "px";
        p.style.top = r.bottom + 4 + "px";
        p.classList.toggle("open");
      };
      document.querySelector("[data-theme-toggle]").onclick = () => {
        const r = document.documentElement;
        r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
        $("#wsPop").classList.remove("open");
        if (location.hash.includes("/preview")) ditherCover($("#hcC"), 3);
      };
      $("#searchBtn").onclick = (e) => {
        e.stopPropagation();
        searchDlg();
      };
      $("#newConv").onclick = (e) => {
        e.stopPropagation();
        newConvDlg();
      };
      $("#meBtn").onclick = () => {
        S.away = !S.away;
        const b = $("#meBtn");
        b.classList.toggle("away", S.away);
        $(".st", b).textContent = S.away ? "Away" : "Active";
        toast(
          S.away ? "You're away: new conversations skip you" : "You're back: assignment resumed",
        );
      };
      setInterval(() => {
        if (
          location.hash.startsWith("#/inbox") &&
          !$("#mn").classList.contains("open") &&
          document.activeElement.id !== "ta"
        ) {
          const ta = $("#ta");
          inbox();
        } else nav();
      }, 60000);
      route();
    </script>
  </body>
</html>
