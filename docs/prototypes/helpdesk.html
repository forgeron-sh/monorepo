      :root {
        --bg: #0a0a0a;
        --bg-raised: #111111;
        --bg-sunk: #050505;
        --line: #1c1c1c;
        --line-strong: #2e2e2e;
        --ink: #ededed;
        --ink-muted: #8f8f8f;
        --ink-dim: #5e5e5e;
        --accent: #ff4f1f;
        --accent-ink: #0a0a0a;
        --focus: var(--accent);
        --success: #3ddc84;
        --warning: #ffb020;
        --danger: #ff6b81;
        --info: #7aa2ff;
        --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.6);
        --font-pixel: "Forge Sans", "Geist Mono", ui-monospace, monospace;
        --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
        --hatch: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 9px);
        --ctl: 28px;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #f7f7f5;
        --bg-raised: #ededea;
        --bg-sunk: #ffffff;
        --line: #e2e2de;
        --line-strong: #c4c4be;
        --ink: #111111;
        --ink-muted: #5c5c58;
        --ink-dim: #80807a;
        --accent: #c93a10;
        --accent-ink: #0a0a0a;
        --success: #157a3e;
        --warning: #8a5300;
        --danger: #b4233f;
        --info: #2f5bd1;
        --shadow-pop: 0 8px 24px rgba(17, 17, 17, 0.12);
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border-radius: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/16px var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--accent);
        color: var(--accent-ink);
      }
      [data-i] {
        display: inline-flex;
        flex: none;
      }
      .px {
        display: inline-block;
        flex: none;
        width: 16px;
        height: 16px;
        shape-rendering: crispEdges;
      }
      .px .o {
        opacity: 0.4;
      }
      .eyebrow {
        font: 500 11px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .dim {
        color: var(--ink-dim);
      }
      .muted {
        color: var(--ink-muted);
      }
      .led {
        display: inline-block;
        flex: none;
        width: 6px;
        height: 6px;
        background: var(--ink-dim);
      }
      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border: 1px solid var(--line-strong);
        font: 500 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: var(--ctl);
        height: var(--ctl);
        flex: none;
        border: 1px solid transparent;
        color: var(--ink-muted);
      }
      .icon-btn:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .icon-btn.boxed {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        flex: none;
      }
      .btn:hover {
        border-color: var(--ink);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--ink));
      }
      .btn.ghost {
        border-color: transparent;
        color: var(--ink-muted);
      }
      .btn.ghost:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
      }
      .seg button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: calc(var(--ctl) - 2px);
        padding: 0 10px;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        white-space: nowrap;
      }
      .seg button + button {
        border-left: 1px solid var(--line-strong);
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }
      .seg button:hover:not([aria-pressed="true"]) {
        color: var(--ink);
      }
      .seg.icons button {
        width: calc(var(--ctl) - 2px);
        padding: 0;
        justify-content: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 7px;
        border: 1px solid var(--line-strong);
        font: 400 11.5px/1 var(--font-sans);
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .chip .sq {
        width: 6px;
        height: 6px;
        flex: none;
      }
      .chip .px {
        width: 12px;
        height: 12px;
      }
      .av {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        flex: none;
        background: var(--bg-sunk);
        border: 1px solid var(--line-strong);
        font: 500 8.5px/1 var(--font-mono);
        color: var(--ink);
      }
      .av.me {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        font: 700 9px/1 var(--font-pixel);
        text-transform: uppercase;
        color: var(--ink);
      }
      .logo.lg {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }
      .pop {
        position: fixed;
        z-index: 60;
        min-width: 220px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
        padding: 4px;
        display: none;
      }
      .pop.open {
        display: block;
      }
      .pop .h {
        padding: 8px 10px 6px;
      }
      .pop a,
      .pop button.r {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 30px;
        padding: 0 10px;
        color: var(--ink-muted);
        text-align: left;
      }
      .pop a:hover,
      .pop button.r:hover,
      .pop button.r[aria-selected="true"] {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .pop a kbd,
      .pop button.r kbd,
      .pop button.r .k {
        margin-left: auto;
      }
      .pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      /* app frame shared by the apps: a side, an inset panel with handles, a foot */
      .app {
        display: grid;
        grid-template-columns: var(--side) minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
      }
      .side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 8px 12px 0;
      }
      .side-head {
        display: flex;
        align-items: center;
        gap: 4px;
        height: var(--ctl);
        margin-bottom: 10px;
      }
      .ws {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px 0 4px;
        border: 1px solid transparent;
        min-width: 0;
        flex: 1;
      }
      .ws:hover {
        border-color: var(--line-strong);
      }
      .ws .tile {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .ws .tile .px {
        width: 12px;
        height: 12px;
      }
      .ws b {
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ws .chev {
        color: var(--ink-dim);
      }
      .searchbox {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        background: var(--bg-sunk);
        color: var(--ink-dim);
        width: 100%;
        text-align: left;
      }
      .searchbox:hover {
        border-color: var(--line-strong);
        color: var(--ink-muted);
      }
      .searchbox span:nth-child(2) {
        flex: 1;
      }
      .nav {
        flex: 1;
        overflow: auto;
        margin: 0 -4px;
        padding: 0 4px 12px;
        scrollbar-width: none;
      }
      .nav-sec {
        margin-top: 14px;
      }
      .nav-h {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        color: var(--ink-dim);
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        width: 100%;
        text-align: left;
      }
      .nav-h:hover {
        color: var(--ink-muted);
      }
      .nav-h .car {
        margin-left: auto;
        transition: transform 0.12s;
      }
      .nav-h[aria-expanded="false"] .car {
        transform: rotate(-90deg);
      }
      .it {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--nav-row, 28px);
        padding: 0 8px;
        color: var(--ink-muted);
        border: 1px solid transparent;
        white-space: nowrap;
        width: 100%;
        text-align: left;
      }
      .it:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .it[aria-current="page"] {
        color: var(--ink);
        background: var(--bg-raised);
        border-color: var(--line);
      }
      .it[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: -5px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--accent);
      }
      .it .lbl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .it .k {
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .side-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 44px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        margin: 0 -12px;
        padding-left: 12px;
        padding-right: 12px;
      }
      .mainwrap {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 8px 8px 0 0;
      }
      .panel {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line-strong);
        background: var(--bg);
      }
      .panel::before,
      .panel::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        pointer-events: none;
        z-index: 3;
      }
      .panel::before {
        top: -4px;
        left: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .panel::after {
        bottom: -4px;
        right: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        height: var(--ctl);
        margin: 4px 2px 4px 4px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .foot .led {
        background: var(--success);
      }
      .foot a:hover {
        color: var(--ink);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font: 500 13px/16px var(--font-sans);
      }
      .crumb a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 5px 0 4px;
        margin-left: -4px;
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .crumb a:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .crumb .sep {
        color: var(--ink-dim);
      }
      .crumb b {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .head .acts {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .menu {
        display: none !important;
      }
      .tk-hover:hover {
        --t: var(--accent);
        background-image:
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t));
        background-size:
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px;
        background-position:
          top left,
          top left,
          top right,
          top right,
          bottom left,
          bottom left,
          bottom right,
          bottom right;
        background-repeat: no-repeat;
      }
      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: fixed;
          inset: 0 auto 0 0;
          width: 280px;
          z-index: 30;
          background: var(--bg);
          border-right: 1px solid var(--line);
          transform: translateX(-100%);
          transition: transform 0.2s;
        }
        .app.drawer .side {
          transform: none;
          box-shadow: var(--shadow-pop);
        }
        .mainwrap {
          padding: 0;
        }
        .panel {
          border: 0;
        }
        .panel::before,
        .panel::after {
          display: none;
        }
        .menu {
          display: inline-grid !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* A support inbox (Intercom / Front / Zendesk structure), drawn in the Forgeron language. */
      :root {
        --side: 236px;
        --list: 336px;
        --det: 304px;
      }
      .nav .badge {
        margin-left: auto;
        display: grid;
        place-items: center;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        background: var(--accent);
        color: var(--accent-ink);
        font: 500 10.5px/1 var(--font-mono);
      }
      .nav .badge.soft {
        background: none;
        color: var(--ink-dim);
        border: 1px solid var(--line-strong);
      }
      .nav .badge.hot {
        background: var(--danger);
        color: var(--accent-ink);
      }
      .nav-h .add {
        margin-left: auto;
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        color: var(--ink-dim);
      }
      .nav-h .add:hover {
        color: var(--ink);
      }
      .nav-h .add + .car {
        margin-left: 2px;
      }
      .sw {
        display: inline-block;
        width: 8px;
        height: 8px;
        flex: none;
      }
      .side-foot .me-b {
        display: flex;
        gap: 8px;
        align-items: center;
        height: 28px;
        padding: 0 6px 0 2px;
        border: 1px solid transparent;
      }
      .side-foot .me-b:hover {
        border-color: var(--line-strong);
      }
      .side-foot .me-b .st {
        font: 400 10.5px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--success);
      }
      .side-foot .me-b.away .st {
        color: var(--ink-dim);
      }
      .mono {
        font-family: var(--font-mono);
      }
      .hide {
        display: none !important;
      }
      .cb {
        display: inline-grid;
        place-items: center;
        width: 14px;
        height: 14px;
        border: 1px solid var(--line-strong);
        flex: none;
        cursor: pointer;
        background: var(--bg);
      }
      .cb[aria-checked="true"] {
        background: var(--accent);
        border-color: var(--accent);
      }
      .cb[aria-checked="true"]::after {
        content: "";
        width: 6px;
        height: 6px;
        background: var(--accent-ink);
      }
      .cb[aria-checked="mixed"]::after {
        content: "";
        width: 6px;
        height: 2px;
        background: var(--ink);
      }
      .chip.sm {
        height: 18px;
        padding: 0 5px;
        font-size: 11px;
      }
      .chip.t-danger {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 50%, var(--line-strong));
      }
      .chip.t-warn {
        color: var(--warning);
        border-color: color-mix(in srgb, var(--warning) 50%, var(--line-strong));
      }
      .chip.t-ok {
        color: var(--success);
      }
      .chip.mono {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.02em;
      }
      .av.cust {
        background: var(--bg-raised);
        color: var(--ink-muted);
      }
      .av.lg {
        width: 28px;
        height: 28px;
        font-size: 10px;
      }
      .av.none {
        border-style: dashed;
        color: var(--ink-dim);
      }
      .ch-ic {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        flex: none;
        color: var(--ink-dim);
      }
      .ch-ic .px {
        width: 12px;
        height: 12px;
      }
      .pri {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .pri .px {
        width: 12px;
        height: 12px;
      }
      .tog {
        position: relative;
        display: inline-block;
        width: 28px;
        height: 16px;
        border: 1px solid var(--line-strong);
        flex: none;
        cursor: pointer;
        background: var(--bg-sunk);
      }
      .tog::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        background: var(--ink-dim);
        transition: left 0.12s;
      }
      .tog[aria-checked="true"] {
        border-color: var(--accent);
      }
      .tog[aria-checked="true"]::after {
        left: 14px;
        background: var(--accent);
      }
      .empty {
        display: grid;
        place-items: center;
        flex: 1;
        min-height: 160px;
        background-image: var(--hatch);
      }
      .empty > div {
        background: var(--bg);
        padding: 14px 18px;
        border: 1px solid var(--line);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
      }
      .empty b {
        font-weight: 500;
      }

      /* ------------------------------------------------ inbox: list | conversation | details */
      .ib {
        position: relative;
        display: grid;
        grid-template-columns: var(--list) minmax(0, 1fr) var(--det);
        flex: 1;
        min-height: 0;
      }
      .ib.nodet {
        grid-template-columns: var(--list) minmax(0, 1fr);
      }
      .ib.nodet .det {
        display: none;
      }
      .lst {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        border-right: 1px solid var(--line);
      }
      .lst-h {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 40px;
        padding: 0 8px 0 12px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .lst-h .dd {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 6px;
        border: 1px solid transparent;
        font-weight: 500;
        white-space: nowrap;
      }
      .lst-h .dd:hover {
        border-color: var(--line-strong);
      }
      .lst-h .dd .px {
        width: 12px;
        height: 12px;
        color: var(--ink-dim);
      }
      .lst-h .dd .n {
        font: 400 12px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .lst-h .sp {
        margin-left: auto;
      }
      .lst-h .icon-btn {
        width: 26px;
        height: 26px;
      }
      .bulk {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 40px;
        padding: 0 6px 0 12px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--accent) 8%, var(--bg));
        flex: none;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .bulk .n {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 0 6px 0 4px;
        white-space: nowrap;
      }
      .bulk .btn {
        height: 24px;
        padding: 0 7px;
        font-size: 10.5px;
        background: var(--bg);
      }
      .bulk .bk {
        display: flex;
        gap: 2px;
        margin-left: auto;
      }
      .bulk .icon-btn {
        width: 26px;
        height: 26px;
        background: var(--bg);
      }
      .bulk .icon-btn .px {
        width: 14px;
        height: 14px;
      }
      .lst-b {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }
      .cv {
        position: relative;
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 4px 10px;
        padding: 11px 12px 11px 12px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .cv:hover {
        background: var(--bg-raised);
      }
      .cv[aria-current="true"] {
        background: var(--bg-raised);
      }
      .cv[aria-current="true"]::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--accent);
      }
      .cv.picked {
        background: color-mix(in srgb, var(--accent) 7%, var(--bg));
      }
      .cv .lead {
        position: relative;
        width: 18px;
        height: 18px;
        margin-top: -1px;
      }
      .cv .lead .cb {
        position: absolute;
        inset: 2px;
        display: none;
      }
      .cv:hover .lead .cb,
      .lst.picking .cv .lead .cb {
        display: inline-grid;
      }
      .cv:hover .lead .ch-ic,
      .lst.picking .cv .lead .ch-ic {
        visibility: hidden;
      }
      .cv .l1 {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .cv .l1 .who {
        font-weight: 500;
        color: var(--ink-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .cv .l1 .co {
        color: var(--ink-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
      }
      .cv .l1 time {
        margin-left: auto;
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
        flex: none;
      }
      .cv .l2 {
        grid-column: 2;
        color: var(--ink-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cv .l3 {
        grid-column: 2;
        color: var(--ink-dim);
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cv .l4 {
        grid-column: 2;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
        min-width: 0;
      }
      .cv .l4 .av {
        margin-left: auto;
      }
      .cv.unread .l1 .who {
        color: var(--ink);
        font-weight: 600;
      }
      .cv.unread .l2 {
        color: var(--ink);
        font-weight: 500;
      }
      .cv .dot {
        width: 6px;
        height: 6px;
        background: var(--accent);
        flex: none;
      }
      .cv.closed .l2,
      .cv.closed .l1 .who {
        color: var(--ink-dim);
      }

      .cp {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .thread {
        flex: 1;
        overflow: auto;
        min-height: 0;
        padding: 18px 20px 8px;
      }
      .th-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding-bottom: 14px;
        margin-bottom: 14px;
        border-bottom: 1px dashed var(--line-strong);
      }
      .th-top h1 {
        font: 600 18px/24px var(--font-sans);
        letter-spacing: -0.01em;
      }
      .th-top .sub {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin-top: 6px;
        color: var(--ink-dim);
        font-size: 12.5px;
      }
      .th-top .sub .mono {
        font-size: 11.5px;
      }
      .day {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0;
        color: var(--ink-dim);
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .day::before,
      .day::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--line);
      }
      .msg {
        display: flex;
        gap: 10px;
        margin: 0 0 14px;
        max-width: 86%;
      }
      .msg .bub {
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--line-strong);
        background: var(--bg);
      }
      .msg .mh {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 12.5px;
      }
      .msg .mh b {
        font-weight: 500;
      }
      .msg .mh .via {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--ink-dim);
        font: 400 10.5px/16px var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .msg .mh .via .px {
        width: 12px;
        height: 12px;
      }
      .msg .mh time {
        margin-left: auto;
        padding-left: 12px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .msg .txt {
        line-height: 20px;
        color: var(--ink);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg .txt .at {
        color: var(--accent);
        font-weight: 500;
      }
      .msg.out {
        margin-left: auto;
        flex-direction: row-reverse;
      }
      .msg.out .bub {
        background: var(--bg-raised);
        border-color: var(--line-strong);
        border-right: 2px solid var(--ink-muted);
      }
      .msg.out .seen {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        color: var(--ink-dim);
        font: 400 10.5px/16px var(--font-mono);
      }
      .msg.out .seen .px {
        width: 12px;
        height: 12px;
      }
      .msg.note {
        max-width: 100%;
      }
      .msg.note .bub {
        flex: 1;
        background: color-mix(in srgb, var(--warning) 8%, var(--bg));
        border: 1px dashed color-mix(in srgb, var(--warning) 55%, var(--line-strong));
      }
      .msg.note .mh .via {
        color: var(--warning);
      }
      .att {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .att a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        font: 400 11.5px/1 var(--font-mono);
        color: var(--ink-muted);
        background: var(--bg);
      }
      .att a:hover {
        color: var(--ink);
        border-color: var(--ink-muted);
      }
      .att .px {
        width: 12px;
        height: 12px;
      }
      .sys {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 0 0 14px;
        color: var(--ink-dim);
        font-size: 12px;
      }
      .sys .px {
        width: 12px;
        height: 12px;
      }
      .sys b {
        font-weight: 500;
        color: var(--ink-muted);
      }
      .sys time {
        font: 400 11px/16px var(--font-mono);
      }
      .sys.warn {
        color: var(--danger);
      }

      .comp {
        margin: 4px 16px 14px;
        border: 1px solid var(--line-strong);
        background: var(--bg);
        flex: none;
      }
      .comp:focus-within {
        border-color: var(--ink-muted);
      }
      .comp.note {
        background: color-mix(in srgb, var(--warning) 7%, var(--bg));
        border-style: dashed;
        border-color: color-mix(in srgb, var(--warning) 60%, var(--line-strong));
      }
      .comp-t {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 34px;
        padding: 0 6px;
        border-bottom: 1px solid var(--line);
      }
      .comp-t .tb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        border: 1px solid transparent;
      }
      .comp-t .tb .px {
        width: 12px;
        height: 12px;
      }
      .comp-t .tb[aria-pressed="true"] {
        color: var(--ink);
        border-color: var(--line-strong);
        background: var(--bg-raised);
      }
      .comp.note .comp-t .tb[aria-pressed="true"] {
        color: var(--warning);
      }
      .comp-t .to {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-dim);
        font-size: 12px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
      }
      .comp-t .to .chip {
        height: 20px;
        font-family: var(--font-mono);
        font-size: 11px;
      }
      .comp textarea {
        display: block;
        width: 100%;
        min-height: 76px;
        max-height: 260px;
        padding: 10px 12px;
        border: 0;
        background: transparent;
        resize: none;
        outline: none;
        line-height: 20px;
      }
      .comp textarea::placeholder {
        color: var(--ink-dim);
      }
      .comp-x {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 12px 8px;
      }
      .comp-x:empty {
        display: none;
      }
      .comp-x .chip button {
        display: grid;
        place-items: center;
        color: var(--ink-dim);
      }
      .comp-x .chip button:hover {
        color: var(--ink);
      }
      .comp-x .chip .px {
        width: 10px;
        height: 10px;
      }
      .comp-x .mac {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--line-strong));
        color: var(--ink);
      }
      .comp-f {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 40px;
        padding: 0 6px;
        border-top: 1px solid var(--line);
      }
      .comp-f .icon-btn {
        width: 28px;
        height: 28px;
      }
      .comp-f .hint {
        margin-left: auto;
        margin-right: 8px;
        color: var(--ink-dim);
        font: 400 10.5px/1 var(--font-mono);
        white-space: nowrap;
      }
      .split {
        display: inline-flex;
      }
      .split .btn + .btn {
        border-left: 1px solid color-mix(in srgb, var(--accent-ink) 30%, var(--accent));
        padding: 0 6px;
      }
      .split .btn .px {
        width: 12px;
        height: 12px;
      }

      .det {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: auto;
        border-left: 1px solid var(--line);
        background: var(--bg);
      }
      .det-sec {
        border-bottom: 1px solid var(--line);
      }
      .det-h {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 38px;
        padding: 0 12px 0 14px;
        font-weight: 500;
        text-align: left;
      }
      .det-h .px {
        width: 12px;
        height: 12px;
        color: var(--ink-dim);
      }
      .det-h .car {
        margin-left: auto;
        color: var(--ink-dim);
        transition: transform 0.12s;
      }
      .det-h[aria-expanded="false"] .car {
        transform: rotate(-90deg);
      }
      .det-h:hover {
        background: var(--bg-raised);
      }
      .det-b {
        padding: 0 0 10px;
      }
      .det-h[aria-expanded="false"] + .det-b {
        display: none;
      }
      .kv {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        align-items: center;
        min-height: 32px;
        padding: 0 14px;
        font-size: 12.5px;
      }
      .kv dt {
        color: var(--ink-dim);
      }
      .kv dd {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .kv.ed {
        cursor: pointer;
      }
      .kv.ed:hover {
        background: var(--bg-raised);
      }
      .kv.ed:hover dd::after {
        content: "";
        margin-left: auto;
        width: 0;
      }
      .kv .val {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kv .lnk {
        font: 400 12px/16px var(--font-mono);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--line-strong);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kv .lnk:hover {
        color: var(--accent);
      }
      .kv .add-t {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 18px;
        padding: 0 5px;
        border: 1px dashed var(--line-strong);
        color: var(--ink-dim);
        font-size: 11px;
      }
      .cust {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 4px 14px 10px;
      }
      .cust .logo.lg:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .cust b {
        display: block;
        font-weight: 500;
      }
      .cust a.cn:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .cust .dim {
        font-size: 12px;
      }
      .lk {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        margin: 0 10px 6px;
        padding: 6px 8px;
        border: 1px solid var(--line-strong);
        font-size: 12.5px;
      }
      .lk:hover {
        border-color: var(--ink-muted);
      }
      .lk .id {
        font: 400 11.5px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .lk .t {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lk .px {
        width: 12px;
        height: 12px;
        color: var(--ink-dim);
      }
      .rt {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 14px;
        font-size: 12.5px;
        color: var(--ink-muted);
        cursor: pointer;
      }
      .rt:hover {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .rt .t {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rt time {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .mil {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 14px;
        font-size: 12.5px;
      }
      .mil .t {
        flex: 1;
        color: var(--ink-muted);
      }
      .mil .mono {
        font-size: 11.5px;
      }
      .det-add {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 14px;
        color: var(--ink-dim);
        font: 400 10.5px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .det-add:hover {
        color: var(--ink);
      }
      .det-add .px {
        width: 12px;
        height: 12px;
      }
      .back {
        display: none !important;
      }

      /* ------------------------------------------------ menus, modal, toast */
      #mn {
        z-index: 75;
        max-height: min(420px, 70vh);
        overflow: auto;
        min-width: 230px;
      }
      #mn .msearch {
        display: block;
        width: 100%;
        height: 30px;
        margin-bottom: 4px;
        padding: 0 8px;
        border: 1px solid var(--line);
        background: var(--bg-sunk);
        outline: none;
      }
      #mn .msearch:focus {
        border-color: var(--line-strong);
      }
      #mn button.r .ml {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #mn button.r .sub {
        display: block;
        font-size: 11.5px;
        color: var(--ink-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #mn button.r.two {
        height: 44px;
      }
      #mn button.r.act {
        background: var(--bg-raised);
        color: var(--ink);
      }
      #mn button.r .k .px {
        color: var(--accent);
      }
      #mn .none {
        padding: 8px 10px;
        color: var(--ink-dim);
      }
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: color-mix(in srgb, var(--bg) 70%, transparent);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 12vh 16px 16px;
      }
      .scrim.open {
        display: flex;
      }
      .dlg {
        width: min(560px, 100%);
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
      }
      .dlg-h {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 14px;
        border-bottom: 1px solid var(--line);
      }
      .dlg-h b {
        font-weight: 500;
      }
      .dlg-h .icon-btn {
        margin-left: auto;
      }
      .dlg-b {
        padding: 14px;
      }
      .dlg-f {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        padding: 10px 14px;
        border-top: 1px solid var(--line);
      }
      .fld {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      .fld label {
        color: var(--ink-dim);
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .inp {
        height: 30px;
        padding: 0 9px;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        outline: none;
        width: 100%;
      }
      .inp:focus {
        border-color: var(--ink-muted);
      }
      textarea.inp {
        height: auto;
        padding: 8px 9px;
        line-height: 20px;
        resize: vertical;
      }
      .sel {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        min-width: 140px;
        text-align: left;
      }
      .sel:hover {
        border-color: var(--ink-muted);
      }
      .sel .px {
        width: 12px;
        height: 12px;
        color: var(--ink-dim);
      }
      .qs {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 48px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
      }
      .qs input {
        flex: 1;
        border: 0;
        background: none;
        outline: none;
        font-size: 15px;
      }
      .qs-r {
        max-height: 50vh;
        overflow: auto;
        padding: 4px;
      }
      .qs-r .g {
        padding: 8px 10px 4px;
      }
      .qs-r a {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 34px;
        padding: 0 10px;
        color: var(--ink-muted);
      }
      .qs-r a .t {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qs-r a .mono {
        font-size: 11px;
        color: var(--ink-dim);
      }
      .qs-r a:hover,
      .qs-r a.act {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .keys {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 24px;
      }
      .keys div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 30px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-muted);
      }
      .keys kbd + kbd {
        margin-left: 4px;
      }
      #toast {
        position: fixed;
        left: calc(var(--side) + 16px);
        bottom: 48px;
        z-index: 80;
        display: none;
        align-items: center;
        gap: 12px;
        height: 36px;
        padding: 0 6px 0 12px;
        background: var(--ink);
        color: var(--bg);
        font-size: 12.5px;
        box-shadow: var(--shadow-pop);
      }
      #toast.open {
        display: flex;
      }
      #toast .px {
        width: 12px;
        height: 12px;
      }
      #toast button {
        height: 24px;
        padding: 0 8px;
        font: 500 10.5px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 1px solid color-mix(in srgb, var(--bg) 40%, var(--ink));
      }

      /* ------------------------------------------------ tables (tickets, sla) */
      .fbar {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 42px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        background-image: var(--hatch);
        flex: none;
        flex-wrap: wrap;
      }
      .fbar > * {
        background: var(--bg);
      }
      .fchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        font-size: 12px;
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .fchip b {
        font-weight: 500;
        color: var(--ink);
      }
      .fchip:hover {
        border-color: var(--ink-muted);
      }
      .fchip .px {
        width: 12px;
        height: 12px;
      }
      .fchip.on {
        border-color: color-mix(in srgb, var(--accent) 60%, var(--line-strong));
      }
      .fbar .find {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        color: var(--ink-dim);
      }
      .fbar .find input {
        border: 0;
        background: none;
        outline: none;
        width: 160px;
        color: var(--ink);
      }
      .fbar .right {
        margin-left: auto;
        display: flex;
        gap: 6px;
        background: none;
      }
      .fbar .right > * {
        background: var(--bg);
      }
      .tbl {
        border-collapse: separate;
        border-spacing: 0;
        min-width: 100%;
        font-size: 13px;
      }
      .tbl th,
      .tbl td {
        height: 38px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        text-align: left;
        background: var(--bg);
      }
      .tbl th {
        height: 34px;
        position: sticky;
        top: 0;
        z-index: 2;
        font: 500 12px/16px var(--font-sans);
        color: var(--ink-muted);
        border-bottom-color: var(--line-strong);
        cursor: pointer;
        user-select: none;
      }
      .tbl th:hover {
        color: var(--ink);
      }
      .tbl th .h {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tbl th .px {
        width: 12px;
        height: 12px;
        color: var(--ink-dim);
      }
      .tbl th.ck,
      .tbl td.ck {
        width: 36px;
        padding: 0 0 0 12px;
        cursor: default;
      }
      .tbl tr.r {
        cursor: pointer;
      }
      .tbl tr.r:hover td {
        background: var(--bg-raised);
      }
      .tbl tr.r.sel td {
        background: color-mix(in srgb, var(--accent) 7%, var(--bg));
      }
      .tbl .id {
        font: 400 12px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .tbl .subj {
        max-width: 340px;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
      }
      .tbl tr.unread .subj::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        background: var(--accent);
        vertical-align: middle;
      }
      .tbl .who {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tbl .num {
        font: 400 12px/16px var(--font-mono);
      }
      .tbl tfoot td {
        position: sticky;
        bottom: 0;
        height: 32px;
        color: var(--ink-dim);
        font: 400 11.5px/16px var(--font-mono);
        border-top: 1px solid var(--line-strong);
        border-bottom: 0;
      }
      .stx {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .stx .sq {
        width: 6px;
        height: 6px;
      }

      /* ------------------------------------------------ settings, kb, reports shared */
      .tabs {
        display: flex;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        scrollbar-width: none;
        flex: none;
      }
      .tabs a {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 40px;
        padding: 0 12px;
        color: var(--ink-dim);
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .tabs a:hover {
        color: var(--ink);
      }
      .tabs a[aria-current="page"] {
        color: var(--ink);
      }
      .tabs a[aria-current="page"]::after {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: -1px;
        height: 2px;
        background: var(--accent);
      }
      .page {
        padding: 20px 24px 40px;
        max-width: 1080px;
      }
      .pg-h {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 18px;
      }
      .pg-h h1 {
        font: 500 22px/26px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .pg-h p {
        color: var(--ink-muted);
        margin-top: 6px;
      }
      .pg-h .acts {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .card {
        border: 1px solid var(--line-strong);
        background: var(--bg);
        margin-bottom: 14px;
      }
      .card-h {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 8px 12px 8px 14px;
        border-bottom: 1px solid var(--line);
      }
      .card-h b {
        font-weight: 500;
      }
      .card-h .r {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-b {
        padding: 12px 14px;
      }
      .cond {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        color: var(--ink-muted);
        font-size: 12.5px;
      }
      .tgt {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .tgt th,
      .tgt td {
        height: 36px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .tgt th {
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
        font-weight: 500;
      }
      .tgt td.v {
        font: 400 12.5px/16px var(--font-mono);
        cursor: text;
      }
      .tgt td.v:hover {
        box-shadow: inset 0 0 0 1px var(--ink-muted);
      }
      .tgt td.v input {
        width: 90px;
        height: 26px;
        padding: 0 6px;
        border: 1px solid var(--accent);
        background: var(--bg-sunk);
        outline: none;
        font: inherit;
      }
      .tgt tr:last-child td {
        border-bottom: 0;
      }
      .hours {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .hours span {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 64px;
        padding: 6px 0;
        border: 1px solid var(--line-strong);
        font: 400 11px/14px var(--font-mono);
        color: var(--ink-muted);
      }
      .hours span.off {
        background-image: var(--hatch);
        color: var(--ink-dim);
      }
      .two {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      .two > .l {
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .two > .l .lb {
        flex: 1;
        overflow: auto;
      }
      .two > .rr {
        overflow: auto;
        min-height: 0;
      }
      .mrow {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 100%;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        position: relative;
      }
      .mrow:hover {
        background: var(--bg-raised);
      }
      .mrow[aria-current="true"] {
        background: var(--bg-raised);
      }
      .mrow[aria-current="true"]::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--accent);
      }
      .mrow b {
        font-weight: 500;
      }
      .mrow .s {
        display: flex;
        gap: 8px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .arow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .arow .lbl {
        width: 90px;
        color: var(--ink-dim);
        font-size: 12.5px;
      }
      .ph {
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 12px;
      }

      /* knowledge base */
      .kb-cols {
        display: flex;
        flex-direction: column;
        padding: 8px;
      }
      .kb-cols button {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 8px;
        color: var(--ink-muted);
        border: 1px solid transparent;
        text-align: left;
      }
      .kb-cols button:hover {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .kb-cols button[aria-current="true"] {
        background: var(--bg-raised);
        color: var(--ink);
        border-color: var(--line);
      }
      .kb-cols button .n {
        margin-left: auto;
        font: 400 11px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .ed-wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        flex: 1;
        min-height: 0;
      }
      .ed-main {
        overflow: auto;
        min-height: 0;
      }
      .ed-in {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 32px 60px;
      }
      .ed-in .ttl {
        width: 100%;
        border: 0;
        background: none;
        outline: none;
        font: 600 26px/32px var(--font-sans);
        letter-spacing: -0.015em;
        margin-bottom: 8px;
      }
      .ed-tb {
        display: flex;
        gap: 2px;
        padding: 6px 0;
        margin-bottom: 14px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 2;
      }
      .ed-tb .icon-btn {
        width: 26px;
        height: 26px;
      }
      .prose {
        outline: none;
        line-height: 24px;
        font-size: 14px;
        color: var(--ink);
      }
      .prose h2 {
        font: 600 16px/24px var(--font-sans);
        margin: 22px 0 6px;
      }
      .prose p {
        margin: 0 0 12px;
        color: var(--ink-muted);
      }
      .prose ol,
      .prose ul {
        margin: 0 0 12px;
        padding-left: 22px;
        color: var(--ink-muted);
      }
      .prose ol {
        list-style: decimal;
      }
      .prose ul {
        list-style: square;
      }
      .prose li {
        margin-bottom: 4px;
      }
      .prose .tip {
        margin: 0 0 12px;
        padding: 10px 12px;
        border: 1px solid var(--line-strong);
        border-left: 2px solid var(--accent);
        background: var(--bg-raised);
        color: var(--ink);
      }
      .prose code {
        font: 400 12.5px/1 var(--font-mono);
        padding: 1px 4px;
        border: 1px solid var(--line-strong);
      }
      .ed-side {
        border-left: 1px solid var(--line);
        overflow: auto;
      }
      .pub {
        flex: 1;
        overflow: auto;
        min-height: 0;
        background: var(--bg-sunk);
      }
      .pub-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
        font: 400 11.5px/1 var(--font-mono);
        color: var(--ink-dim);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .pub-bar .led {
        background: var(--success);
      }
      .pub-bar .r {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .hc-top {
        position: relative;
        height: 200px;
        border-bottom: 1px solid var(--line);
      }
      .hc-top canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        opacity: 0.55;
      }
      .hc-top .in {
        position: relative;
        max-width: 760px;
        margin: 0 auto;
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .hc-top .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      .hc-top .brand .tile {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .hc-top .brand .tile .px {
        width: 14px;
        height: 14px;
      }
      .hc-top h2 {
        font: 500 26px/30px var(--font-pixel);
        text-transform: uppercase;
      }
      .hc-top .q {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 12px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        color: var(--ink-dim);
        max-width: 520px;
      }
      .hc-top .q input {
        flex: 1;
        border: 0;
        background: none;
        outline: none;
      }
      .hc-body {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 24px 60px;
      }
      .hc-body .bc {
        display: flex;
        gap: 6px;
        color: var(--ink-dim);
        font-size: 12.5px;
        margin-bottom: 14px;
      }
      .hc-body h1 {
        font: 600 28px/34px var(--font-sans);
        letter-spacing: -0.015em;
        margin-bottom: 8px;
      }
      .hc-body .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-dim);
        font-size: 12.5px;
        margin-bottom: 22px;
      }
      .helpful {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 28px;
        padding: 14px;
        border: 1px solid var(--line-strong);
        background: var(--bg);
      }
      .helpful span {
        flex: 1;
      }
      .rel {
        margin-top: 22px;
      }
      .rel a {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        border-bottom: 1px solid var(--line);
        color: var(--ink-muted);
      }
      .rel a:hover {
        color: var(--ink);
      }

      /* reports */
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border: 1px solid var(--line-strong);
        margin-bottom: 14px;
      }
      .kpi {
        padding: 14px 16px;
        border-right: 1px solid var(--line);
      }
      .kpi:last-child {
        border-right: 0;
      }
      .kpi .v {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 8px 0 10px;
        font: 500 26px/30px var(--font-mono);
        letter-spacing: -0.02em;
      }
      .kpi .d {
        font: 400 11.5px/16px var(--font-mono);
      }
      .kpi .d.good {
        color: var(--success);
      }
      .kpi .d.bad {
        color: var(--danger);
      }
      .kpi svg {
        display: block;
        width: 100%;
        height: 28px;
        color: var(--ink-dim);
      }
      .charts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .charts .card {
        margin: 0;
      }
      .charts .wide {
        grid-column: 1/-1;
      }
      .chart {
        padding: 14px 14px 10px;
      }
      .chart svg {
        display: block;
        width: 100%;
        height: 150px;
        shape-rendering: crispEdges;
        color: var(--ink-muted);
      }
      .chart .ax {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        color: var(--ink-dim);
        font: 400 10.5px/14px var(--font-mono);
      }
      .legend {
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 12px;
        color: var(--ink-muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend svg {
        width: 12px;
        height: 12px;
        shape-rendering: crispEdges;
      }
      .hm {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 0 8px;
        align-items: center;
      }
      .hm .dl {
        font: 400 10.5px/14px var(--font-mono);
        color: var(--ink-dim);
        height: 22px;
        display: flex;
        align-items: center;
      }
      .hm svg {
        display: block;
        width: 100%;
        height: 22px;
        shape-rendering: crispEdges;
        color: var(--accent);
      }

      @media (max-width: 1240px) {
        .ib {
          grid-template-columns: var(--list) minmax(0, 1fr);
        }
        .ib .det {
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          width: var(--det);
          z-index: 6;
          box-shadow: var(--shadow-pop);
        }
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .kpi:nth-child(2) {
          border-right: 0;
        }
        .kpi:nth-child(-n + 2) {
          border-bottom: 1px solid var(--line);
        }
      }
      @media (max-width: 1000px) {
        :root {
          --list: 280px;
        }
        .charts {
          grid-template-columns: 1fr;
        }
        .ed-wrap {
          grid-template-columns: 1fr;
        }
        .ed-side {
          display: none;
        }
      }
      @media (max-width: 860px) {
        #toast {
          left: 16px;
          right: 16px;
        }
        .panel:has(.ib:not(.has-conv)) .head .acts,
        .panel:has(.ib:not(.has-conv)) .back,
        .panel:has(.ib:not(.has-conv)) .crumb .cc {
          display: none !important;
        }
        .foot .chan,
        .foot .chan + span {
          display: none;
        }
        .ib,
        .ib.nodet {
          grid-template-columns: 1fr;
        }
        .ib.has-conv .lst {
          display: none;
        }
        .ib:not(.has-conv) .cp,
        .ib:not(.has-conv) .det {
          display: none;
        }
        .back {
          display: inline-grid !important;
        }
        .head .hide-sm {
          display: none;
        }
        .two {
          grid-template-columns: 1fr;
        }
        .two > .l {
          max-height: 40vh;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .page {
          padding: 16px;
        }
        .msg {
          max-width: 100%;
        }
        .keys {
          grid-template-columns: 1fr;
        }
        .kpis {
          grid-template-columns: 1fr 1fr;
        }
        .comp-f .hint {
          display: none;
        }
      }
    </style>
  </head>

      function px(name) {
        const rows = ICONS[name];
        if (!rows) return "";
        const n = rows.length;
        let a = "",
          b = "";
        rows.forEach((r, y) => {
          let x = 0;
          while (x < r.length) {
            const c = r[x];
            if (c !== "#" && c !== "o") {
              x++;
              continue;
            }
            const s = x;
            while (x < r.length && r[x] === c) x++;
            const d = `M${s} ${y}h${x - s}v1h-${x - s}z`;
            if (c === "#") a += d;
            else b += d;
          }
        });
        return `<svg class="px" viewBox="0 0 ${n} ${n}" aria-hidden="true"><path fill="currentColor" d="${a}"/>${b ? `<path class="o" fill="currentColor" d="${b}"/>` : ""}</svg>`;
      }
      const I = (n) => `<span data-i="${n}">${px(n)}</span>`;
      function fillIcons(...els) {

          if (el) el.innerHTML = el.innerHTML.replace(/%%I:([a-z0-9-]+)%%/g, (_, n) => I(n));
      }
      function bayer(x, y) {
        const m = [
          [0, 8, 2, 10],
          [12, 4, 14, 6],

        ];
        return (m[y & 3][x & 3] + 0.5) / 16;

        const cs = getComputedStyle(document.documentElement),
          acc = cs.getPropertyValue("--accent").trim(),
          bg = cs.getPropertyValue("--bg-sunk").trim();
        const w = (canvas.width = Math.ceil(canvas.clientWidth / 4)),
          h = (canvas.height = Math.ceil(canvas.clientHeight / 4));
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = acc;
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const v =
              0.5 +
              0.5 * Math.sin((x / w) * Math.PI * (1.2 + seed * 0.3) + seed) * (1 - y / h) -
              0.35 +
              (y / h) * 0.15 * Math.cos(x / 9 + seed);
            if (v > bayer(x, y)) ctx.fillRect(x, y, 1, 1);
          }

      // ------------------------------------------------------------ inbox
      function listFor(view) {
        const v = viewOf(view);
        let l = C.filter(v.f);
        if (S.status !== "all") l = l.filter((c) => c.st === S.status);
        const pr = { urgent: 0, high: 1, normal: 2, low: 3 };
        const so = {
          newest: (a, b) => b.at - a.at,
          oldest: (a, b) => a.at - b.at,
          sla: (a, b) => (a.sla ? slaLeft(a) : 1e9) - (b.sla ? slaLeft(b) : 1e9),
          priority: (a, b) => pr[a.pr] - pr[b.pr] || b.at - a.at,
        }[S.sort];
        return l.sort(so);
      }
      const SORTS = {

      function rowHtml(c, cur) {

  </div>`;

      function threadHtml(c) {

            const att =
              m.att && m.att.length
                ? `<div class="att">${m.att.map((f) => `<a href="#" data-file="${esc(f)}">${px("attachment-01")}${esc(f)}</a>`).join("")}</div>`
                : "";
            if (m.k === "in")
              return `<div class="msg in"><span class="av cust">${initials(k.n)}</span><div class="bub"><div class="mh"><b>${esc(k.n)}</b><span class="via">${px(CH[c.ch][0])}${CH[c.ch][1]}</span><time>${m.t}</time></div><div class="txt">${fmtBody(m.b)}</div>${att}</div></div>`;
            if (m.k === "out")
              return `<div class="msg out">${av(m.w)}<div class="bub"><div class="mh"><b>${AG[m.w]}</b><span class="via">${px(CH[c.ch][0])}Reply</span><time>${m.t}</time></div><div class="txt">${fmtBody(m.b)}</div>${att}<div class="seen">${px(m.fresh ? "tick-01" : "tick-double-01")}${m.fresh ? "Sent" : "Seen"}</div></div></div>`;
            return `<div class="msg note">${av(m.w)}<div class="bub"><div class="mh"><b>${AG[m.w]}</b><span class="via">${px("lock")}Internal note</span><time>${m.t}</time></div><div class="txt">${fmtBody(m.b)}</div></div></div>`;

      function macroSummary(m) {

          .map(([a, v]) =>

      function composerHtml(c) {

      <span class="hint">⌘↵ send</span>

          ) +
          sec(

      <div class="kv"><dt>Contact</dt><dd><span class="val">${esc(k.n)}</span></dd></div>

      <div class="kv"><dt>Phone</dt><dd><a class="lnk" href="#" data-copy="${esc(k.ph)}" title="Copy">${esc(k.ph)}</a></dd></div>
      <div class="kv"><dt>Storage</dt><dd><span class="val">${co.places}</span></dd></div>
      <div class="kv"><dt>Client since</dt><dd class="mono" style="font-size:12px">${co.since}</dd></div></dl>
      <a class="det-add" href="crm.html#/companies/${k.co}">${px("arrow-up-right-01")}Open in CRM</a>`,
          ) +
          sec(
            "sla",
            "hourglass",
            "SLA",
            `<div class="mil"><span class="t">Policy</span><a href="#/settings/sla" style="text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)">${pol.n}</a></div>
      ${c.met

      ${c.sla && c.st !== "closed" ? `<div class="mil"><span class="led" style="background:${slaLeft(c) < 0 ? "var(--danger)" : slaLeft(c) < 30 ? "var(--warning)" : "var(--ink-dim)"}"></span><span class="t">${c.sla.k}</span>${slaChip(c)}</div>` : ""}
      ${c.st === "closed" ? `<div class="mil"><span class="led" style="background:var(--success)"></span><span class="t">Resolution</span><span class="mono dim">met</span></div>` : ""}`,
          ) +
          sec(

            "link-01",
            "Links",

      ${k.co === "lyon-logistique" ? `<a class="lk" href="notes.html#/page/lyon">${px("note-01")}<span class="t">Lyon depot · site notes</span>${px("arrow-up-right-01")}</a>` : ""}
      <button class="det-add" id="linkTask">${px("plus-sign")}Link a task</button>`,
          ) +
          sec(
            "recent",
            "clock-01",
            `Recent conversations`,

              ? recent
                  .map(

                      `<div class="rt" data-open="${x.id}"><span class="sq" style="width:6px;height:6px;background:${STA[x.st][1]}"></span><span class="t">${esc(x.s)}</span><time>${rel(x)}</time></div>`,
                  )

              : `<p class="dim" style="padding:0 14px 6px">No other conversation.</p>`,

      function inbox() {
        const list = listFor(S.view),
          v = viewOf(S.view);
        if (!S.conv || (!S.explicit && !list.some((c) => c.id === S.conv)))
          S.conv = list[0] ? list[0].id : null;
        const c = S.conv && byId(S.conv);
        if (c && c.unread && (S.explicit || innerWidth > 860)) {
          c.unread = false;
        }
        const picked = [...S.picked];
        const counts = C.filter(v.f).filter((x) => S.status === "all" || x.st === S.status).length;
        const lh = picked.length
          ? `<div class="bulk"><span class="cb" data-pickall aria-checked="${picked.length === list.length ? "true" : "mixed"}"></span><span class="n">${picked.length} selected</span>
      <span class="bk">${[
        ["as", "user", "Assign"],

        ["tag", "hashtag", "Tag"],
        ["read", "mail-open-01", "Mark as read"],
      ]
        .map(
          ([k, ic, l]) =>
            `<button class="icon-btn boxed" data-bulk="${k}" title="${l}" aria-label="${l}">${I(ic)}</button>`,

        .join(
          "",
        )}</span><button class="icon-btn" data-bulk="clear" aria-label="Clear selection" title="Clear (Esc)">${I("multiplication-sign")}</button></div>`
          : `<div class="lst-h"><span class="cb" data-pickall aria-checked="false" title="Select all"></span><button class="dd" id="stDd"><span class="n">${counts}</span>${S.status === "all" ? "All" : STA[S.status][0]}${px("arrow-down-01")}</button><span class="sp"></span><button class="dd" id="sortDd" style="font-weight:400;color:var(--ink-muted)">${px("sorting-01")}${SORTS[S.sort]}</button></div>`;
        const listHtml = list.length
          ? list.map((x) => rowHtml(x, S.conv)).join("")
          : `<div class="empty" style="height:100%"><div>${px("inbox")}<b>Nothing here</b><span class="dim">No ${S.status === "all" ? "" : STA[S.status][0].toLowerCase() + " "}conversations in this view.</span></div></div>`;

        } else
          cp = `<section class="cp"><div class="empty"><div>${px("inbox")}<b>No conversation selected</b><span class="dim">Pick one in the list, or press <kbd>j</kbd>.</span></div></div></section>`;
        const crumb = `<button class="icon-btn back" id="backBtn" aria-label="Back to the list">${I("arrow-left-01")}</button><a href="#/inbox/${S.view}">${v.team ? `<span class="sw" style="background:${TEAMS[v.l]}"></span>` : px(v.ic || "inbox")}${esc(v.l)}</a>${c ? `<span class="sep cc">/</span><b class="cc"><span class="mono dim" style="font-size:12px">#${c.id}</span><span style="overflow:hidden;text-overflow:ellipsis">${esc(c.s)}</span></b>` : ""}`;
        const acts = c
          ? `<button class="btn ghost hide-sm" id="hAssign" title="Assign (a)">${av(c.as)}${c.as ? AG[c.as].split(" ")[0] : "Assign"}</button><button class="icon-btn" id="hSnooze" title="Snooze" aria-label="Snooze">${I("clock-01")}</button>${c.st === "closed" ? `<button class="btn" id="hReopen">${px("refresh")}Reopen</button>` : `<button class="btn" id="hClose" title="Close (e)">${px("checkmark-circle-01")}Close<kbd>E</kbd></button>`}<button class="icon-btn" id="hMore" aria-label="More">${I("more-horizontal")}</button><button class="icon-btn hide-sm" id="hDet" aria-label="Toggle details" title="Details" style="${S.det ? "color:var(--ink);border-color:var(--line-strong)" : ""}">${I("sidebar-right")}</button>`

          head(crumb, acts) +
          `<div class="ib${S.det ? "" : " nodet"}${S.explicit && c ? " has-conv" : ""}"><section class="lst${picked.length ? " picking" : ""}">${lh}<div class="lst-b">${listHtml}</div></section>${cp}${c ? `<aside class="det">${detHtml(c)}</aside>` : ""}</div>`;
        $(".lst-b").scrollTop = keep;

      function go(id) {
        location.hash = `#/inbox/${S.view}/${id}`;

      function bindInbox(c, list) {
        $$(".cv").forEach(
          (r) =>
            (r.onclick = (e) => {
              if (e.target.closest("[data-pick]")) return;

                togglePick(+r.dataset.cv);
                return;

              go(r.dataset.cv);

        );

          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              togglePick(+b.dataset.pick);
            }),
        );
        const pa = $("[data-pickall]");
        if (pa)
          pa.onclick = () => {
            S.picked = S.picked.size ? new Set() : new Set(list.map((x) => x.id));
            inbox();
          };
        const st = $("#stDd");
        if (st)
          st.onclick = (e) =>
            openMenu(
              st,
              {
                items: [
                  ...Object.keys(STA).map((k) => ({
                    v: k,
                    l: STA[k][0],
                    ic: `<span class="sq" style="width:6px;height:6px;background:${STA[k][1]}"></span>`,
                    sel: S.status === k,
                  })),
                  { v: "all", l: "All", sel: S.status === "all" },

              },
              (v) => {
                S.status = v;
                S.picked.clear();
                inbox();
              },
            );

        if (so)
          so.onclick = (e) =>
            openMenu(
              so,

                inbox();

        $$("[data-bulk]").forEach((b) => (b.onclick = (e) => bulk(b.dataset.bulk, b)));
        const bb = $("#backBtn");
        if (bb)
          bb.onclick = () => {
            location.hash = "#/inbox/" + S.view;
          };
        if (!c) return;
        const dt = $("#hDet");
        if (dt)
          dt.onclick = () => {
            S.det = !S.det;
            pref.det = S.det;
            savePref();
            inbox();
          };
        const ha = $("#hAssign");
        if (ha) ha.onclick = () => editAttr(c, "as", ha);
        const hs = $("#hSnooze");

            setStatus(c, "open");

        const hm = $("#hMore");

            hm,

      function ticketRows() {
        const f = S.tf,

        let l = C.filter(
          (c) =>
            (f.st === "any" || (f.st === "unsolved" ? c.st !== "closed" : c.st === f.st)) &&
            (f.pr === "any" || c.pr === f.pr) &&
            (f.as === "any" ||
              (f.as === "me" ? c.as === ME : f.as === "none" ? !c.as : c.as === f.as)) &&
            (f.team === "any" || c.team === f.team) &&
            (f.ch === "any" || c.ch === f.ch) &&
            (!q ||
              (c.s + " " + contact(c).n + " " + CO[contact(c).co].n + " " + c.id)
                .toLowerCase()
                .includes(q)),
        );
        const [k, dir] = S.tsort,
          pr = { urgent: 0, high: 1, normal: 2, low: 3 };
        const key = {
          id: (c) => c.id,
          subj: (c) => c.s,
          req: (c) => contact(c).n,
          co: (c) => CO[contact(c).co].n,
          st: (c) => c.st,
          pr: (c) => pr[c.pr],
          ch: (c) => c.ch,
          as: (c) => c.as || "~",
          team: (c) => c.team,
          sla: (c) => (c.sla && c.st !== "closed" ? slaLeft(c) : 1e9),
          upd: (c) => -c.at,
        }[k];
        return l.sort((a, b) => {
          const x = key(a),
            y = key(b);
          return (x < y ? -1 : x > y ? 1 : 0) * dir;
        });
