    <div class="ph"><div class="ph-row"><div style="min-width:0;flex:1"><h1>${ed ? `<input id="dashName" value="${esc(d.name)}" aria-label="Dashboard name">` : esc(d.name)}</h1><div class="sub">${esc(d.desc)} <span class="dim">·</span> ${av(d.by)} <span class="dim">Edited ${ago(d.edited)} by ${PEOPLE[d.by]}</span></div></div></div></div>
    <div class="fbar"><button class="fl${ctx.period !== defPeriod(id) ? " set" : ""}" data-filter="period">${I("calendar-03")}Period <b>${PERIODS[ctx.period][0]}</b>${I("arrow-down-01")}</button>
      <button class="fl${ctx.team !== "all" ? " set" : ""}" data-filter="team">${I("user-group")}Team <b>${ctx.team === "all" ? "All teams" : ctx.team}</b>${I("arrow-down-01")}</button>
      ${ctx.period !== defPeriod(id) || ctx.team !== "all" ? `<button class="btn ghost" data-reset>Reset</button>` : ""}
      <span class="r"><span class="dim hide-sm">Data as of 17 Nov, 14:02</span><button class="icon-btn" data-refresh aria-label="Refresh" style="background:var(--bg)">${I("refresh")}</button></span></div>
    <div class="dgrid-wrap">${ed ? `<div class="guides">${"<i></i>".repeat(12)}</div>` : ""}<div class="dgrid" id="dgrid">${d.tiles.map((t, i) => tileHtml(t, ctx, id, ed, i)).join("") || `<div class="empty" style="grid-column:1/-1;min-height:200px"><span>This dashboard is empty</span><button class="btn" data-edit>${I("pencil")}Edit</button></div>`}</div></div>
    ${drawer && drawer.dash === id ? subsDrawer(d) : ""}
  </div>`
        );
      }

      // subscriptions drawer
      let subForm = null;
      function newSubForm(id) {
        return {
          dash: id,
          kind: "slack",
          to: ["#sales"],
          freq: "Weekly",
          day: "Mon",
          time: "08:00",
          period: "d7",
          team: "all",
          csv: false,
        };
      }
      function subLine(s) {
        return `${s.freq === "Daily" ? "Every day" : s.freq === "Weekly" ? "Every " + { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday", Sun: "Sunday" }[s.day] : s.freq === "Monthly" ? "First " + { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday", Sun: "Sunday" }[s.day] + " of the month" : "Every hour"}${s.freq === "Hourly" ? "" : " at " + s.time}`;
      }
      function subsDrawer(d) {
        const list = SUBS.filter((s) => s.dash === d.id);
        if (subForm) {
          const f = subForm;
          return `<aside class="drawer-r" aria-label="New subscription"><div class="dh"><button class="icon-btn" data-sub-back aria-label="Back">${I("arrow-left-01")}</button><b>${f.id ? "Edit" : "New"} subscription</b><button class="icon-btn" data-close-drawer aria-label="Close">${I("cancel-01")}</button></div><div class="db">
      <div class="fld"><span class="lb">Send to</span><div class="seg full">${[
        ["slack", "Slack"],
        ["email", "Email"],
      ]
        .map(
          ([k, l]) =>
            `<button data-sf="kind" data-v="${k}" aria-pressed="${f.kind === k}">${l}</button>`,
        )
        .join("")}</div></div>
      <div class="fld"><span class="lb">${f.kind === "slack" ? "Channels" : "Recipients"}</span><div class="rcpt">${f.to.map((r, i) => `<span class="chip">${f.kind === "slack" ? `<span class="logo" style="width:14px;height:14px;font-size:6px">SL</span>` : ""}${esc(r)}<button data-rm-to="${i}" aria-label="Remove">×</button></span>`).join("")}<input id="toInput" placeholder="${f.kind === "slack" ? "#channel" : "name@ateliermoreau.fr"}"></div></div>
      <div class="fld"><span class="lb">Frequency</span><div class="seg full">${["Hourly", "Daily", "Weekly", "Monthly"].map((k) => `<button data-sf="freq" data-v="${k}" aria-pressed="${f.freq === k}">${k}</button>`).join("")}</div></div>
      ${f.freq === "Weekly" || f.freq === "Monthly" ? `<div class="fld"><span class="lb">${f.freq === "Monthly" ? "First" : "On"}</span><div class="seg full">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((k) => `<button data-sf="day" data-v="${k}" aria-pressed="${f.day === k}">${k.slice(0, 2)}</button>`).join("")}</div></div>` : ""}
      ${f.freq !== "Hourly" ? `<div class="fld"><label for="sfTime">At</label><select class="sel" id="sfTime">${["07:00", "08:00", "09:00", "12:00", "17:00"].map((t) => `<option${t === f.time ? " selected" : ""}>${t}</option>`).join("")}</select></div>` : ""}
      <div class="fld"><span class="lb">Filter values for this subscription</span>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><select class="sel" id="sfPeriod">${Object.entries(
          PERIODS,
        )
          .map(
            ([k, p]) => `<option value="${k}"${k === f.period ? " selected" : ""}>${p[0]}</option>`,
          )
          .join(
            "",
          )}</select><select class="sel" id="sfTeam"><option value="all">All teams</option>${TEAMS.map((t) => `<option${t === f.team ? " selected" : ""}>${t}</option>`).join("")}</select></div></div>
      <button class="ck" data-sf-csv aria-checked="${f.csv}" role="checkbox"><i></i>Attach results as CSV</button>
      <p class="dim" style="margin-top:16px;font:400 11px/16px var(--font-mono)">${esc(subLine(f))} · Europe/Paris</p>
    </div><div class="df"><button class="btn ghost" data-sub-test>${I("sent")}Send now</button><button class="btn primary" data-sub-save>Done</button></div></aside>`;
        }
        return `<aside class="drawer-r" aria-label="Subscriptions"><div class="dh">${I("notification-01")}<b>Subscriptions</b><button class="icon-btn" data-close-drawer aria-label="Close">${I("cancel-01")}</button></div><div class="db">
    ${list.length ? list.map((s) => `<div class="subc"><span class="logo">${s.kind === "slack" ? "SL" : I("mail-01")}</span><div style="min-width:0"><b>${esc(subLine(s))}</b><span class="dim">${esc(s.to.join(", "))} · ${PERIODS[s.period][0]}${s.team !== "all" ? " · " + s.team : ""}${s.on ? "" : " · paused"}</span></div><button class="icon-btn" data-sub-edit="${s.id}" aria-label="Edit">${I("pencil")}</button></div>`).join("") : `<div class="empty" style="margin-bottom:12px"><span>Send this dashboard to Slack or email on a schedule</span></div>`}
    </div><div class="df"><button class="btn primary" data-sub-new>${I("plus-sign")}New subscription</button></div></aside>`;
      }

      // question builder
      let B = null; // {q, name, from:{dash,tile}|{qid}|null, ctx, sql}
      function startBuilder(q, name, from, coll) {
        B = {
          q: JSON.parse(JSON.stringify(q)),
          name,
          from,
          coll: coll || "sales",
          ctx: { period: "d7", team: "all" },
          sql: false,
        };
      }
      function vizAllowed(q) {
        return {
          number: !q.by,
          bar: !!q.by,
          step: q.by === "time",
          table: true,
          funnel: q.src === "crm.deals" && q.by === "stage",
          heatmap: !q.by && !q.noPeriod && "team" in SRC[q.src].cats,
        };
      }
      function sqlOf(q, ctx) {
        const s = SRC[q.src],
          { a } = range(ctx.period),
          parts = [];
        const met =
          q.agg === "sum"
            ? `sum(${q.field})`
            : q.agg === "avg"
              ? `avg(${q.field})`
              : q.agg === "distinct"
                ? `count(DISTINCT ${q.field})`
                : q.agg === "winrate"
                  ? `avg(CASE WHEN stage = 'won' THEN 1.0 ELSE 0 END)`
                  : "count(*)";
        const by = q.by === "time" ? `date_trunc('${PERIODS[ctx.period][2]}', ${q.on})` : q.by;
        const sel =
          q.viz === "table" && !q.by
            ? "*"
            : (by ? by + " AS " + (q.by === "time" ? "bucket" : q.by) + ", " : "") + met;
        const w = [];
        if (!q.noPeriod) w.push(`${q.on} >= '${iso(a)}'`);
        if (ctx.team !== "all") w.push(`team = '${ctx.team}'`);
        if (q.agg === "winrate") w.push("stage IN ('won', 'lost')");
        (q.filters || []).forEach(([f, v]) =>
          w.push(
            Array.isArray(v) ? `${f} IN (${v.map((x) => `'${x}'`).join(", ")})` : `${f} = '${v}'`,
          ),
        );
        let t = `<span class="kw">SELECT</span> ${esc(sel)}\n<span class="kw">FROM</span> ${q.src}`;
        if (w.length) t += `\n<span class="kw">WHERE</span> ${esc(w.join("\n  AND "))}`;
        if (by && q.viz !== "table") t += `\n<span class="kw">GROUP BY</span> 1`;
        if (q.by === "time") t += `\n<span class="kw">ORDER BY</span> 1`;
        return t;
      }
      function builder() {
        const q = B.q,
          s = SRC[q.src],
          ok = vizAllowed(q),
          ctx = B.ctx;
        const back =
          B.from && B.from.dash
            ? `<a href="#/dashboard/${B.from.dash}">${I("dashboard-square-01")}${esc(dashById(B.from.dash).name)}</a><span class="sep">/</span>`
            : crumbColl(collById(B.coll));
        VIZ = {};
        const t = { id: "preview", title: B.name || "New question", q, w: 12, h: 3 };
        const fl = (q.filters || [])
          .map(
            ([f, v], i) =>
              `<span class="tok flt">${esc(s.cats[f] || f)} ${Array.isArray(v) ? "is any of " + v.map((x) => catLabel(f, x)).join(", ") : "is " + esc(catLabel(f, v))}<button class="x" data-rmf="${i}" aria-label="Remove filter">×</button></span>`,
          )
          .join("");
        return (
          head(
            `${back}<b>${I("bar-chart")}${esc(B.name || "New question")}</b>`,
            `<button class="btn ghost hide-sm" data-alert>${I("alarm-clock")}Alert</button><button class="btn primary" data-save-q>Save</button>`,
          ) +
          `<div class="qb">
    <div class="nb">
      <div class="fld"><label for="qName">Name</label><input class="inp" id="qName" value="${esc(B.name)}" placeholder="New question"></div>
      <div class="step"><div class="sh"><span class="n">1</span>Data</div><div class="sb"><button class="tok src" data-pick-src>${I(s.icon)}${s.app} · ${s.label}${I("arrow-down-01")}</button><span class="dim mono" style="font-size:11px">${q.src}</span></div></div>
      <div class="step"><div class="sh"><span class="n">2</span>Filter</div><div class="sb">${fl}<button class="tok add" data-add-filter>${I("plus-sign")}Add filter</button></div></div>
      <div class="step"><div class="sh"><span class="n">3</span>Period</div><div class="sb"><span class="w">on</span>${Object.entries(
        s.dates,
      )
        .map(
          ([k, l]) =>
            `<button class="tok${q.on === k && !q.noPeriod ? " met" : ""}" data-on="${k}">${l}</button>`,
        )
        .join("")}<button class="tok${q.noPeriod ? " met" : ""}" data-on="">All time</button>
        <span class="w" style="margin-left:auto">preview</span><select class="sel" id="qPeriod" style="width:auto">${Object.entries(
          PERIODS,
        )
          .map(
            ([k, p]) =>
              `<option value="${k}"${k === ctx.period ? " selected" : ""}>${p[0]}</option>`,
          )
          .join("")}</select></div></div>
      <div class="step"><div class="sh"><span class="n">4</span>Summarize</div><div class="sb"><button class="tok met" data-pick-metric>${esc(metricName(q))}${I("arrow-down-01")}</button><span class="w">by</span><button class="tok${q.by ? " met" : " add"}" data-pick-by>${q.by === "time" ? esc(s.dates[q.on] || "Created") + ": " + PERIODS[ctx.period][2] : q.by ? esc(s.cats[q.by]) : "Pick a column"}${I("arrow-down-01")}</button>${q.by ? `<button class="x tok" data-clear-by aria-label="Remove grouping">×</button>` : ""}</div></div>
      <div class="step"><div class="sh"><span class="n">5</span>Visualize</div><div class="vz">${[
        ["number", "Number", "hashtag"],
        ["bar", "Bar", "bar-chart"],
        ["step", "Line", "activity-01"],
        ["table", "Table", "table"],
        ["funnel", "Funnel", "filter"],
        ["heatmap", "Heatmap", "grid-view"],
      ]
        .map(
          ([k, l, ic]) =>
            `<button data-viz-k="${k}" aria-pressed="${q.viz === k}" ${ok[k] ? "" : "disabled"}>${I(ic)}${l}</button>`,
        )
        .join("")}</div></div>
      <button class="btn ghost" data-sql>${I("code")}${B.sql ? "Hide" : "View"} the SQL</button>
      ${B.sql ? `<pre class="sql" style="margin-top:8px">${sqlOf(q, ctx)}</pre>` : ""}
    </div>
    <div class="pv"><div class="pvh"><span class="eyebrow">Preview</span><div class="r"><span class="dim mono" style="font-size:11px" id="pvMeta"></span></div></div>
      <div class="pvb">${s.waiting ? `<div class="notice">${I("hourglass")}invoices.invoices has no rows: the Invoices app syncs once ${s.waiting} is connected.<a href="console-home.html#/integrations/stripe">Connect ${s.waiting} ↗</a></div>` : ""}${tileHtml(t, ctx, "pv", false)}</div></div>
  </div>`
        );
      }

      function subscriptions() {
        const rows = [
          ...SUBS.map((s) => ({
            k: "Subscription",
            s,
            name: dashById(s.dash).name,
            href: "#/dashboard/" + s.dash,
            when: subLine(s),
            to: s.to.join(", "),
            by: s.by,
          })),
          ...ALERTS.map((a) => ({
            k: "Alert",
            s: a,
            name: qById(a.q).name + " goes " + a.cond + " " + a.val,
            href: "#/question/" + a.q,
            when: a.freq === "Daily" ? "Checked every day at " + a.time : "Checked every hour",
            to: a.to.join(", "),
            by: a.by,
          })),
        ];
        return (
          head(`<b>${I("notification-01")}Subscriptions and alerts</b>`) +
          `<div class="body"><div class="ph"><div class="ph-row"><div><h1>Subscriptions and alerts</h1><div class="sub">Dashboards sent on a schedule, and questions that warn you when a number moves.</div></div></div></div>
  <div class="sec"><table class="list"><thead><tr><th>Type</th><th>What</th><th class="hide-sm">When</th><th class="hide-sm">Sent to</th><th class="hide-sm">Owner</th><th>Status</th><th></th></tr></thead><tbody>${rows
    .map(
      (
        r,
      ) => `<tr class="r"><td class="d">${r.k}</td><td><span class="nm"><span class="tdot ${r.k === "Alert" ? "q" : "dash"}">${I(r.k === "Alert" ? "alarm-clock" : "dashboard-square-01")}</span><a href="${r.href}">${esc(r.name)}</a></span></td><td class="d hide-sm">${esc(r.when)}</td><td class="hide-sm">${esc(r.to)}</td><td class="hide-sm">${av(r.by)}</td>
    <td><button class="chip" data-toggle-sub="${r.s.id}"><span class="sq" style="background:${r.s.on ? "var(--success)" : "var(--ink-dim)"}"></span>${r.s.on ? "Active" : "Paused"}</button></td><td class="end"><button class="icon-btn" data-del-sub="${r.s.id}" aria-label="Delete">${I("delete-02")}</button></td></tr>`,
    )
    .join("")}</tbody></table></div></div>`
        );
      }
      const stub = (t) =>
        head(`<b>${esc(t)}</b>`) +
        `<div class="body"><div class="sec"><div class="empty"><span>${esc(t)}</span><a class="btn" href="#/home">Home</a></div></div></div>`;

      // ------------------------------------------------------------ router
      function route() {
        const parts = (location.hash.replace(/^#\/?/, "") || "home").split("/"),
          panel = $("#panel");
        closePop();
        let html;
        if (editing && !(parts[0] === "dashboard" && parts[1] === editing.id)) cancelEdit(true);
        if (parts[0] !== "dashboard") drawer = null;
        if (parts[0] === "collection") html = collection(parts[1]);
        else if (parts[0] === "dashboard") html = dashboard(parts[1]);
        else if (parts[0] === "question") {
          if (parts[1] === "new") {
            if (!B || B.fresh !== location.hash) {
              startBuilder(
                { src: "crm.deals", on: "created", agg: "count", filters: [], viz: "number" },
                "",
                null,
                parts[2],
              );
              B.fresh = location.hash;
            }
          } else if (parts[1] === "tile") {
            const d = dashById(parts[2]),
              t = d && d.tiles.find((x) => x.id === parts[3]);
            if (!t) {
              html = stub("Tile not found");
            } else if (!B || B.key !== location.hash) {
              startBuilder(t.q, t.title, { dash: d.id, tile: t.id }, d.coll);
              B.key = location.hash;
              B.ctx = { ...ctxFor(d.id) };
            }
          } else {
            const q = qById(parts[1]);
            if (!q) html = stub("Question not found");
            else {
              if (!B || B.key !== location.hash) {
                startBuilder(q.q, q.name, { qid: q.id }, q.coll);
                B.key = location.hash;
              }
              touch("q", q.id);
            }
          }
          if (!html) html = builder();
        } else if (parts[0] === "subscriptions") html = subscriptions();
        else html = home();
        panel.innerHTML = html;
        fillIcons(panel);
        nav();
        bind();
        requestAnimationFrame(() => {
          drawAll(panel);
          const m = $("#pvMeta");
          if (m && VIZ["pv-preview"]) {
            const r = VIZ["pv-preview"].res;
            m.textContent = r.waiting ? "0 rows" : `${r.n} rows · ${3 + (r.n % 9)} ms`;
          }
        });
        $("#app").classList.remove("drawer");
      }
      function rerender() {
        const b = $("#dashBody") || $(".body") || $(".nb");
        const st = b ? b.scrollTop : 0,
          nb = $(".nb"),
          ns = nb ? nb.scrollTop : 0;
        route();
        const b2 = $("#dashBody") || $(".body");
        if (b2) b2.scrollTop = st;
        const nb2 = $(".nb");
        if (nb2) nb2.scrollTop = ns;
      }

      // ------------------------------------------------------------ popovers, modal, toast
      const pop = $("#pop");
      let popOwner = null;
      function openPop(anchor, html, onPick) {
        pop.innerHTML = html;
        fillIcons(pop);
        pop.classList.add("open");
        const r = anchor.getBoundingClientRect();
        const w = pop.offsetWidth,
          h = pop.offsetHeight;
        pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
        pop.style.top =
          (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
        popOwner = anchor;
        anchor.setAttribute("aria-expanded", "true");
        $$("[data-pv]", pop).forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              const v = b.dataset.pv;
              closePop();
              onPick(v, b);
            }),
        );
      }
      function closePop() {
        pop.classList.remove("open");
        if (popOwner) popOwner.setAttribute("aria-expanded", "false");
        popOwner = null;
      }
      const opt = (v, label, on, extra = "") =>
        `<button class="r${on ? " on" : ""}" data-pv="${esc(v)}">${extra}${label}</button>`;
      const scrim = $("#scrim"),
        modal = $("#modal");
      function openModal(html, bindFn) {
        modal.innerHTML = html;
        fillIcons(modal);
        scrim.classList.add("open");
        bindFn && bindFn(modal);
        const f = modal.querySelector("input,select");
        f && f.focus();
      }
      function closeModal() {
        scrim.classList.remove("open");
      }
      scrim.onclick = (e) => {
        if (e.target === scrim) closeModal();
      };
      let toastT;
      function toast(t) {
        $("#toastT").textContent = t;
        $("#toast").classList.add("open");
        clearTimeout(toastT);
        toastT = setTimeout(() => $("#toast").classList.remove("open"), 2400);
      }

      // ------------------------------------------------------------ dashboard editing
      function curDash() {
        const p = location.hash.split("/");
        return p[1] === "dashboard" ? dashById(p[2]) : null;
      }
      function startEdit() {
        const d = curDash();
        editing = { id: d.id, snap: JSON.stringify({ name: d.name, tiles: d.tiles }) };
        drawer = null;
        rerender();

      function tileOp(t, op) {
        const d = curDash(),
          i = d.tiles.indexOf(t);
        if (op === "left" && i > 0) {
          d.tiles.splice(i, 1);
          d.tiles.splice(i - 1, 0, t);
        }
        if (op === "right" && i < d.tiles.length - 1) {
          d.tiles.splice(i, 1);
          d.tiles.splice(i + 1, 0, t);
        }
        if (op === "wide") t.w = Math.min(12, t.w + 1);
        if (op === "narrow") t.w = Math.max(2, t.w - 1);
        if (op === "tall") t.h = Math.min(5, t.h + 1);
        if (op === "short") t.h = Math.max(1, t.h - 1);
        if (op === "del") d.tiles.splice(i, 1);

                : opt(
                    "time",
                    `${esc(s.dates[q.on])}: by ${PERIODS[B.ctx.period][2]}`,
                    q.by === "time",
                    I("calendar-03"),
                  )) +
              Object.entries(s.cats)
                .map(([k, l]) => opt(k, l, q.by === k, I("hashtag")))
                .join(""),
            (v) => {
              q.by = v;
              q.viz =
                v === "time" ? "step" : v === "stage" && q.src === "crm.deals" ? "funnel" : "bar";
              if (q.viz === "funnel" && q.agg !== "count") q.viz = "bar";
              rerender();
            },
          );
        };
        const cb = $("[data-clear-by]", panel);
        if (cb)
          cb.onclick = () => {
            q.by = null;
            fix();
            rerender();
          };
        $$("[data-viz-k]", panel).forEach(
          (b) =>
            (b.onclick = () => {
              q.viz = b.dataset.vizK;
              if (q.viz === "table" && !q.by) {
                q.sort = q.sort || [q.on, -1];
                q.limit = q.limit || 25;
              }
              rerender();
            }),
        );
        $("[data-sql]", panel).onclick = () => {
          B.sql = !B.sql;
          rerender();
        };
        $("[data-save-q]", panel).onclick = saveQuestionModal;
        $("[data-alert]", panel).onclick = alertModal;
        $$("[data-tmenu]", panel).forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              openPop(
                b,
                opt("csv", I("download-01") + "Download results (CSV)") +
                  opt("sql", I("code") + "View the SQL"),
                (v) => {
                  if (v === "csv") toast("Downloaded results.csv");
                  else {
                    B.sql = true;
                    rerender();
                  }
                },
              );
            }),
        );
        $$("[data-sort]", panel).forEach(
          (th) =>
            (th.onclick = () => {
              const f = th.dataset.sort.split("|")[1];
              const s0 = q.sort || ["created", -1];
              q.sort = [f, s0[0] === f ? -s0[1] : -1];
              rerender();
            }),
        );
      }

      // ------------------------------------------------------------ modals
      function saveQuestionModal() {
        const fromTile = B.from && B.from.dt,
          fromQ = B.from && B.from.qid;
        openModal(
          `<div class="mh">${I("bar-chart")}<b>Save question</b><button class="icon-btn" data-x aria-label="Close">${I("cancel-01")}</button></div><div class="mb">
    ${fromTile || fromQ ? `<div class="fld"><span class="lb">Save as</span><div class="seg full"><button data-mode="replace" aria-pressed="true">${fromTile ? "Update the tile" : "Replace original"}</button><button data-mode="new" aria-pressed="false">Save as new</button></div></div>` : ""}
    <div class="fld"><label for="sqName">Name</label><input class="inp" id="sqName" value="${esc(B.name || metricName(B.q) + (B.q.by ? " by " + (B.q.by === "time" ? "period" : SRC[B.q.src].cats[B.q.by].toLowerCase()) : ""))}"></div>
    <div class="fld"><label for="sqColl">Collection</label><select class="sel" id="sqColl">${COLLS.map((c) => `<option value="${c.id}"${c.id === B.coll ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div>
    <div class="fld"><label for="sqDash">Add to a dashboard</label><select class="sel" id="sqDash"><option value="">Don't add</option>${DASHES.map((d) => `<option value="${d.id}"${!fromTile && d.id === "sales-weekly" && B.coll === "sales" ? " selected" : ""}>${esc(d.name)}</option>`).join("")}</select></div>
    </div><div class="mf"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`,
          (m) => {
            let mode = fromTile || fromQ ? "replace" : "new";
            $$("[data-mode]", m).forEach(
              (b) =>
                (b.onclick = () => {
                  mode = b.dataset.mode;
                  $$("[data-mode]", m).forEach((x) => x.setAttribute("aria-pressed", x === b));
                }),
            );
            $$("[data-x]", m).forEach((b) => (b.onclick = closeModal));
            $("[data-ok]", m).onclick = () => {
              const name = $("#sqName", m).value.trim() || "Untitled question",
                coll = $("#sqColl", m).value,
                dash = $("#sqDash", m).value,
                qq = JSON.parse(JSON.stringify(B.q));
              let qid;
              if (mode === "replace" && fromTile) {
                const d = dashById(B.from.dash),
                  t = d.tiles.find((x) => x.id === B.from.dt);
                if (t) {
                  t.q = qq;
                  t.title = name;
                }
                closeModal();
                B = null;
                location.hash = "#/dashboard/" + d.id;
                toast("Tile updated");
                return;
              }
              if (mode === "replace" && fromQ) {
                const o = qById(fromQ);
                Object.assign(o, { name, coll, q: qq, edited: NOW, by: "CR" });
                qid = o.id;
              } else {
                const o = { id: nid("q"), name, coll, q: qq, by: "CR", edited: NOW };
                QUESTIONS.push(o);
                qid = o.id;
              }
              closeModal();
              if (dash) {
                const d = dashById(dash);
                const sz = { number: [3, 1], table: [12, 3], funnel: [4, 2] }[qq.viz] || [6, 2];
                d.tiles.push({
                  id: nid("t"),
                  qid,
                  title: name,
                  q: JSON.parse(JSON.stringify(qq)),
                  w: sz[0],
                  h: sz[1],
                });
                B = null;
                location.hash = "#/dashboard/" + dash;
                toast("Saved and added to “" + d.name + "”");
                setTimeout(() => {
                  const g = $("#dashBody");
                  if (g) g.scrollTop = g.scrollHeight;
                }, 60);
              } else {
                B = null;
                location.hash = "#/question/" + qid;
                toast("Saved to " + collById(coll).name);
              }
            };
          },
        );
      }
      function alertModal() {
        const q = B.q;
        const num = q.viz === "number";
        openModal(
          `<div class="mh">${I("alarm-clock")}<b>New alert</b><button class="icon-btn" data-x aria-label="Close">${I("cancel-01")}</button></div><div class="mb">
    ${num ? "" : `<div class="notice" style="margin-bottom:14px">${I("information-circle")}Alerts watch a single number. This one checks the latest ${q.by === "time" ? "bucket" : "total"}.</div>`}
    <div class="fld"><span class="lb">Alert me when ${esc(B.name || metricName(q))}</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><select class="sel" id="alCond"><option>goes below</option><option>goes above</option><option>has any result</option></select><input class="inp" id="alVal" value="${qfmt(q) === "pct" ? "25%" : qfmt(q) === "eur" ? "€20,000" : "10"}"></div></div>
    <div class="fld"><span class="lb">Check</span><select class="sel" id="alFreq"><option>Daily</option><option>Hourly</option></select></div>
    <div class="fld"><label for="alTo">Send to</label><input class="inp" id="alTo" value="#sales"></div>
  </div><div class="mf"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>Create alert</button></div>`,
          (m) => {
            $$("[data-x]", m).forEach((b) => (b.onclick = closeModal));
            $("[data-ok]", m).onclick = () => {
              let qid = B.from && B.from.qid;
              if (!qid) {
                const o = {
                  id: nid("q"),
                  name: B.name || metricName(q),
                  coll: B.coll,
                  q: JSON.parse(JSON.stringify(q)),
                  by: "CR",
                  edited: NOW,
                };
                QUESTIONS.push(o);
                qid = o.id;
              }
              ALERTS.push({
                id: nid("a"),
                q: qid,
                cond: $("#alCond", m).value.replace("goes ", ""),
                val: $("#alVal", m).value,
                freq: $("#alFreq", m).value,
                time: "09:00",
                to: $("#alTo", m).value.split(/,\s*/),
                on: true,
                by: "CR",
              });
              closeModal();
              toast("Alert created · see Subscriptions and alerts");
            };
          },
        );
      }
      function newDashModal(coll) {
        openModal(
          `<div class="mh">${I("dashboard-square-01")}<b>New dashboard</b><button class="icon-btn" data-x aria-label="Close">${I("cancel-01")}</button></div><div class="mb">
    <div class="fld"><label for="ndName">Name</label><input class="inp" id="ndName" placeholder="Support weekly"></div>
    <div class="fld"><label for="ndDesc">Description</label><input class="inp" id="ndDesc" placeholder="What it is for"></div>
    <div class="fld"><label for="ndColl">Collection</label><select class="sel" id="ndColl">${COLLS.map((c) => `<option value="${c.id}"${c.id === coll ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div>
  </div><div class="mf"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>Create</button></div>`,
          (m) => {
            $$("[data-x]", m).forEach((b) => (b.onclick = closeModal));
            const go = () => {
              const name = $("#ndName", m).value.trim() || "Untitled dashboard";
              const d = {
                id: name.toLowerCase().replace(/\W+/g, "-") + "-" + ++uid,
                name,
                coll: $("#ndColl", m).value,
                desc: $("#ndDesc", m).value.trim() || "No description yet.",
                by: "CR",
                edited: NOW,
                tiles: [],
              };
              DASHES.push(d);
              closeModal();
              editing = { id: d.id, snap: JSON.stringify({ name: d.name, tiles: [] }) };
              location.hash = "#/dashboard/" + d.id;
            };
            $("[data-ok]", m).onclick = go;
            $("#ndName", m).onkeydown = (e) => {
              if (e.key === "Enter") go();
            };
          },
        );
      }
      function textModal(d, t) {
        openModal(
          `<div class="mh">${I("text-align-left")}<b>Edit text</b><button class="icon-btn" data-x aria-label="Close">${I("cancel-01")}</button></div><div class="mb"><textarea class="inp" id="txt" style="height:120px;padding:8px;resize:vertical">${esc(t.text)}</textarea></div><div class="mf"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`,
          (m) => {
            $$("[data-x]", m).forEach((b) => (b.onclick = closeModal));
            $("[data-ok]", m).onclick = () => {
              t.text = $("#txt", m).value;
              closeModal();
              rerender();
            };
          },
        );
      }
      function shareModal(d) {
        openModal(
          `<div class="mh">${I("share-08")}<b>Share</b><button class="icon-btn" data-x aria-label="Close">${I("cancel-01")}</button></div><div class="mb">
    <div class="fld"><span class="lb">Link for Atelier Moreau members</span><div style="display:flex;gap:6px"><input class="inp mono" readonly value="dash.moreau.app/dashboard/${d.id}"><button class="btn" data-copy>${I("copy-01")}Copy</button></div></div>
    <div class="fld"><span class="lb">Who can see the ${esc(collById(d.coll).name)} collection</span>
      ${[
        ["Sales", "View"],
        ["Direction", "Edit"],
        ["Finance", "View"],
      ]
        .map(
          ([t, r]) =>
            `<div style="display:flex;align-items:center;gap:8px;height:34px;border-bottom:1px solid var(--line)">${I("user-group")}<span style="flex:1">${t}</span><span class="dim mono" style="font-size:11px">${r}</span></div>`,
        )
        .join("")}</div>
    <p class="dim" style="font-size:12px">Access follows the teams set in the <a style="text-decoration:underline" href="console-home.html#/home">console</a>.</p>
  </div><div class="mf"><button class="btn primary" data-x>Done</button></div>`,
          (m) => {
            $$("[data-x]", m).forEach((b) => (b.onclick = closeModal));
            $("[data-copy]", m).onclick = () => toast("Link copied");
          },
        );
      }
      function searchModal() {
        const items = [
          ...DASHES.map((d) => ["d", d]),
          ...QUESTIONS.map((q) => ["q", q]),
          ...COLLS.map((c) => ["c", c]),
        ];
        let sel = 0;
        const render = (s) => {
          const l = items
            .filter(([, o]) => o.name.toLowerCase().includes(s.toLowerCase()))
            .slice(0, 12);
          return [
            l,
            l
              .map(
                ([k, o], i) =>
                  `<button data-go="${k === "d" ? "#/dashboard/" : k === "q" ? "#/question/" : "#/collection/"}${o.id}" aria-selected="${i === sel}"><span class="tdot ${k === "d" ? "dash" : k === "q" ? "q" : "col"}">${I(k === "d" ? "dashboard-square-01" : k === "q" ? "bar-chart" : "folder-01")}</span><span><b>${esc(o.name)}</b><span class="dim">${k === "c" ? "Collection" : (k === "d" ? "Dashboard" : "Question") + " · " + esc(collById(o.coll).name)}</span></span></button>`,
              )
              .join("") || `<div class="empty"><span>No results</span></div>`,
          ];
        };
        openModal(
          `<div class="mh">${I("search-01")}<b>Search</b><button class="icon-btn" data-x aria-label="Close">${I("cancel-01")}</button></div><div class="mb"><input class="inp" id="sq" placeholder="Dashboards, questions, collections" style="margin-bottom:10px"><div class="pick" id="sl"></div></div>`,
          (m) => {
            const inp = $("#sq", m);
            let cur = [];
            const up = () => {
              const [l, h] = render(inp.value);
              cur = l;
              $("#sl", m).innerHTML = h;
              fillIcons($("#sl", m));
              $$("[data-go]", m).forEach(
                (b) =>
                  (b.onclick = () => {
                    closeModal();
                    location.hash = b.dataset.go;
                  }),
              );
            };
            inp.oninput = () => {
              sel = 0;
              up();
            };
            inp.onkeydown = (e) => {
              if (e.key === "ArrowDown") {
                sel = Math.min(sel + 1, cur.length - 1);
                up();
                e.preventDefault();
              }
              if (e.key === "ArrowUp") {
                sel = Math.max(0, sel - 1);
                up();
                e.preventDefault();
              }
              if (e.key === "Enter") {
                const b = $$("[data-go]", m)[sel];
                b && b.click();
              }
            };
            $("[data-x]", m).onclick = closeModal;
            up();
          },
        );
      }

      // ------------------------------------------------------------ global events
      addEventListener("hashchange", route);
      const wsBtn = $("#wsBtn"),
        wsPop = $("#wsPop");
      wsBtn.onclick = (e) => {
        e.stopPropagation();
        const r = wsBtn.getBoundingClientRect();
        wsPop.style.left = r.left + "px";
        wsPop.style.top = r.bottom + 4 + "px";
        wsPop.classList.toggle("open");
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#wsPop")) wsPop.classList.remove("open");
        if (!e.target.closest("#pop")) closePop();
        if (!e.target.closest(".side,#menuBtn")) $("#app").classList.remove("drawer");
      });
      $("[data-theme-toggle]").onclick = () => {
        const r = document.documentElement;
        r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
        wsPop.classList.remove("open");
      };
      $("#newBtn").onclick = (e) => {
        e.stopPropagation();
        openPop(
          e.currentTarget,
          opt("q", I("bar-chart") + "Question") +
            opt("d", I("dashboard-square-01") + "Dashboard") +
            opt("c", I("folder-01") + "Collection"),
          (v) => {
            const coll = (location.hash.match(/collection\/([\w-]+)/) || [])[1] || "sales";
            if (v === "q") {
              B = null;
              location.hash = "#/question/new/" + coll;
            }
            if (v === "d") newDashModal(coll);
            if (v === "c") toast("Collections are managed by Direction");
          },
        );
      };
      $("#searchBtn").onclick = searchModal;
      $("#collapseBtn").onclick = () => {
        const a = $("#app");
        a.style.gridTemplateColumns = a.style.gridTemplateColumns ? "" : "0 minmax(0,1fr)";
        $(".side").style.display = a.style.gridTemplateColumns ? "none" : "";
        setTimeout(() => drawAll($("#panel")), 30);
      };
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          searchModal();
          return;
        }
        if (e.key === "Escape") {
          if (scrim.classList.contains("open")) return closeModal();
          if (pop.classList.contains("open")) return closePop();
          if (wsPop.classList.contains("open")) return wsPop.classList.remove("open");
          if (drawer) {
            drawer = null;
            subForm = null;
            return rerender();
          }
          if (editing) return cancelEdit();
          $("#app").classList.remove("drawer");
        }
      });
      // tooltips
      const tip = $("#tip");
      document.addEventListener("mousemove", (e) => {
        const t = e.target.closest && e.target.closest("[data-tip]");
        if (!t) {
          tip.style.display = "none";
          return;
        }
        const [a, b] = t.dataset.tip.split("|");
        tip.innerHTML = `<b>${esc(a)}</b>${b ? esc(b) : ""}`;
        tip.style.display = "block";
        const w = tip.offsetWidth;
        tip.style.left = Math.min(e.clientX + 12, innerWidth - w - 8) + "px";
        tip.style.top = e.clientY + 14 + "px";
      });
      // redraw pixel charts when the grid changes size
      let rz;
      new ResizeObserver(() => {
        clearTimeout(rz);
        rz = setTimeout(() => drawAll($("#panel")), 60);
      }).observe($("#panel"));
      route();
    </script>
  </body>
</html>
