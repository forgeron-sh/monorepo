      :root {
        --bg: #0a0a0a;
        --bg-raised: #111111;
        --bg-sunk: #050505;
        --line: #1c1c1c;
        --line-strong: #2e2e2e;
        --ink: #ededed;
        --ink-muted: #8f8f8f;
        --ink-dim: #5e5e5e;
        --accent: #ff4f1f;
        --accent-ink: #0a0a0a;
        --focus: var(--accent);
        --success: #3ddc84;
        --warning: #ffb020;
        --danger: #ff6b81;
        --info: #7aa2ff;
        --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.6);
        --font-pixel: "Forge Sans", "Geist Mono", ui-monospace, monospace;
        --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
        --hatch: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 9px);
        --ctl: 28px;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #f7f7f5;
        --bg-raised: #ededea;
        --bg-sunk: #ffffff;
        --line: #e2e2de;
        --line-strong: #c4c4be;
        --ink: #111111;
        --ink-muted: #5c5c58;
        --ink-dim: #80807a;
        --accent: #c93a10;
        --accent-ink: #0a0a0a;
        --success: #157a3e;
        --warning: #8a5300;
        --danger: #b4233f;
        --info: #2f5bd1;
        --shadow-pop: 0 8px 24px rgba(17, 17, 17, 0.12);
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border-radius: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/16px var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--accent);
        color: var(--accent-ink);
      }
      [data-i] {
        display: inline-flex;
        flex: none;
      }
      .px {
        display: inline-block;
        flex: none;
        width: 16px;
        height: 16px;
        shape-rendering: crispEdges;
      }
      .px .o {
        opacity: 0.4;
      }
      .eyebrow {
        font: 500 11px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .dim {
        color: var(--ink-dim);
      }
      .muted {
        color: var(--ink-muted);
      }
      .led {
        display: inline-block;
        flex: none;
        width: 6px;
        height: 6px;
        background: var(--ink-dim);
      }
      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border: 1px solid var(--line-strong);
        font: 500 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: var(--ctl);
        height: var(--ctl);
        flex: none;
        border: 1px solid transparent;
        color: var(--ink-muted);
      }
      .icon-btn:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .icon-btn.boxed {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        flex: none;
      }
      .btn:hover {
        border-color: var(--ink);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--ink));
      }
      .btn.ghost {
        border-color: transparent;
        color: var(--ink-muted);
      }
      .btn.ghost:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
      }
      .seg button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: calc(var(--ctl) - 2px);
        padding: 0 10px;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        white-space: nowrap;
      }
      .seg button + button {
        border-left: 1px solid var(--line-strong);
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }
      .seg button:hover:not([aria-pressed="true"]) {
        color: var(--ink);
      }
      .seg.icons button {
        width: calc(var(--ctl) - 2px);
        padding: 0;
        justify-content: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 7px;
        border: 1px solid var(--line-strong);
        font: 400 11.5px/1 var(--font-sans);
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .chip .sq {
        width: 6px;
        height: 6px;
        flex: none;
      }
      .chip .px {
        width: 12px;
        height: 12px;
      }
      .av {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        flex: none;
        background: var(--bg-sunk);
        border: 1px solid var(--line-strong);
        font: 500 8.5px/1 var(--font-mono);
        color: var(--ink);
      }
      .av.me {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        font: 700 9px/1 var(--font-pixel);
        text-transform: uppercase;
        color: var(--ink);
      }
      .logo.lg {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }
      .pop {
        position: fixed;
        z-index: 60;
        min-width: 220px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
        padding: 4px;
        display: none;
      }
      .pop.open {
        display: block;
      }
      .pop .h {
        padding: 8px 10px 6px;
      }
      .pop a,
      .pop button.r {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 30px;
        padding: 0 10px;
        color: var(--ink-muted);
        text-align: left;
      }
      .pop a:hover,
      .pop button.r:hover,
      .pop button.r[aria-selected="true"] {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .pop a kbd,
      .pop button.r kbd,
      .pop button.r .k {
        margin-left: auto;
      }
      .pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      /* app frame shared by the apps: a side, an inset panel with handles, a foot */
      .app {
        display: grid;
        grid-template-columns: var(--side) minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
      }
      .side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 8px 12px 0;
      }
      .side-head {
        display: flex;
        align-items: center;
        gap: 4px;
        height: var(--ctl);
        margin-bottom: 10px;
      }
      .ws {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px 0 4px;
        border: 1px solid transparent;
        min-width: 0;
        flex: 1;
      }
      .ws:hover {
        border-color: var(--line-strong);
      }
      .ws .tile {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .ws .tile .px {
        width: 12px;
        height: 12px;
      }
      .ws b {
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ws .chev {
        color: var(--ink-dim);
      }
      .searchbox {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        background: var(--bg-sunk);
        color: var(--ink-dim);
        width: 100%;
        text-align: left;
      }
      .searchbox:hover {
        border-color: var(--line-strong);
        color: var(--ink-muted);
      }
      .searchbox span:nth-child(2) {
        flex: 1;
      }
      .nav {
        flex: 1;
        overflow: auto;
        margin: 0 -4px;
        padding: 0 4px 12px;
        scrollbar-width: none;
      }
      .nav-sec {
        margin-top: 14px;
      }
      .nav-h {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        color: var(--ink-dim);
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        width: 100%;
        text-align: left;
      }
      .nav-h:hover {
        color: var(--ink-muted);
      }
      .nav-h .car {
        margin-left: auto;
        transition: transform 0.12s;
      }
      .nav-h[aria-expanded="false"] .car {
        transform: rotate(-90deg);
      }
      .it {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--nav-row, 28px);
        padding: 0 8px;
        color: var(--ink-muted);
        border: 1px solid transparent;
        white-space: nowrap;
        width: 100%;
        text-align: left;
      }
      .it:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .it[aria-current="page"] {
        color: var(--ink);
        background: var(--bg-raised);
        border-color: var(--line);
      }
      .it[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: -5px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--accent);
      }
      .it .lbl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .it .k {
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .side-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 44px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        margin: 0 -12px;
        padding-left: 12px;
        padding-right: 12px;
      }
      .mainwrap {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 8px 8px 0 0;
      }
      .panel {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line-strong);
        background: var(--bg);
      }
      .panel::before,
      .panel::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        pointer-events: none;
        z-index: 3;
      }
      .panel::before {
        top: -4px;
        left: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .panel::after {
        bottom: -4px;
        right: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        height: var(--ctl);
        margin: 4px 2px 4px 4px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .foot .led {
        background: var(--success);
      }
      .foot a:hover {
        color: var(--ink);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font: 500 13px/16px var(--font-sans);
      }
      .crumb a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 5px 0 4px;
        margin-left: -4px;
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .crumb a:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .crumb .sep {
        color: var(--ink-dim);
      }
      .crumb b {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .head .acts {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .menu {
        display: none !important;
      }
      .tk-hover:hover {
        --t: var(--accent);
        background-image:
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t));
        background-size:
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px;
        background-position:
          top left,
          top left,
          top right,
          top right,
          bottom left,
          bottom left,
          bottom right,
          bottom right;
        background-repeat: no-repeat;
      }
      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: fixed;
          inset: 0 auto 0 0;
          width: 280px;
          z-index: 30;
          background: var(--bg);
          border-right: 1px solid var(--line);
          transform: translateX(-100%);
          transition: transform 0.2s;
        }
        .app.drawer .side {
          transform: none;
          box-shadow: var(--shadow-pop);
        }
        .mainwrap {
          padding: 0;
        }
        .panel {
          border: 0;
        }
        .panel::before,
        .panel::after {
          display: none;
        }
        .menu {
          display: inline-grid !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* Metabase's structure (collections, dashboards, notebook editor, subscriptions), drawn in the Forgeron language. */
      :root {
        --side: 248px;
        --gap: 8px;
        --rowh: 108px;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .it .star {
        margin-left: auto;
        color: var(--warning);
      }
      .it .px {
        width: 16px;
        height: 16px;
      }
      .tdot {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        flex: none;
        border: 1px solid var(--line-strong);
        color: var(--ink-muted);
      }
      .tdot .px {
        width: 12px;
        height: 12px;
      }
      .tdot.dash {
        color: var(--accent);
      }
      .tdot.q {
        color: var(--info);
      }
      .tdot.col {
        color: var(--warning);
      }
      .new-btn {
        width: 100%;
        margin: 0 0 4px;
      }

      /* page heads */
      .ph {
        padding: 22px 24px 16px;
        border-bottom: 1px solid var(--line);
      }
      .ph-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .ph h1 {
        font: 700 22px/26px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .ph .sub {
        margin-top: 6px;
        color: var(--ink-muted);
        font-size: 12.5px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .ph .acts {
        margin-left: auto;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .ph h1 input {
        font: inherit;
        text-transform: inherit;
        letter-spacing: inherit;
        background: var(--bg-sunk);
        border: 1px solid var(--line-strong);
        padding: 2px 6px;
        width: min(520px, 100%);
      }
      .sec {
        padding: 20px 24px;
      }
      .sec-h {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .sec-h .r {
        margin-left: auto;
      }

      /* home cards */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 8px;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--line-strong);
        background: var(--bg);
        min-height: 96px;
      }
      .card b {
        font-weight: 500;
      }
      .card .meta {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .card .tdot {
        width: 24px;
        height: 24px;
      }
      .card .fav {
        position: absolute;
        top: 8px;
        right: 8px;
      }
      .empty {
        display: grid;
        place-items: center;
        gap: 6px;
        min-height: 96px;
        border: 1px dashed var(--line-strong);
        background-image: var(--hatch);
        color: var(--ink-dim);
        font-size: 12.5px;
        text-align: center;
        padding: 16px;
      }
      .empty span {
        background: var(--bg);
        padding: 2px 6px;
      }

      /* lists */
      .ltab {
        display: flex;
        gap: 4px;
        margin-bottom: 10px;
      }
      .list {
        width: 100%;
        border-collapse: collapse;
      }
      .list th {
        text-align: left;
        height: 32px;
        padding: 0 10px;
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
        border-bottom: 1px solid var(--line-strong);
      }
      .list td {
        height: 42px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .list tr.r:hover td {
        background: var(--bg-raised);
      }
      .list .nm {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
      }
      .list .nm a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .list td.d {
        color: var(--ink-muted);
        font: 400 12px/16px var(--font-mono);
      }
      .list td.end {
        text-align: right;
        width: 80px;
      }
      .starb {
        color: var(--ink-dim);
      }
      .starb[aria-pressed="true"] {
        color: var(--warning);
      }

      /* dashboard */
      .fbar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-height: 44px;
        padding: 8px 24px;
        border-bottom: 1px solid var(--line);
        background-image: var(--hatch);
      }
      .fbar > * {
        background: var(--bg);
      }
      .fl {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px 0 10px;
        border: 1px solid var(--line-strong);
        font-size: 12.5px;
        color: var(--ink-muted);
      }
      .fl b {
        font-weight: 500;
        color: var(--ink);
      }
      .fl:hover {
        border-color: var(--ink-muted);
      }
      .fl.set {
        border-color: var(--accent);
      }
      .fbar .r {
        margin-left: auto;
        display: flex;
        gap: 6px;
        align-items: center;
        background: none;
      }
      .fbar .r .dim {
        background: var(--bg);
        padding: 0 4px;
        font: 400 11px/16px var(--font-mono);
      }
      .editbar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 16px 0 24px;
        border-bottom: 1px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 9%, var(--bg));
      }
      .editbar b {
        font-weight: 500;
      }
      .editbar .r {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .dgrid-wrap {
        position: relative;
        padding: 16px 24px 32px;
      }
      .dgrid {
        position: relative;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: var(--rowh);
        gap: var(--gap);
        grid-auto-flow: row;
      }
      .guides {
        position: absolute;
        inset: 16px 24px 32px;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: var(--gap);
        pointer-events: none;
      }
      .guides i {
        background-image: var(--hatch);
        border-left: 1px dashed var(--line-strong);
        border-right: 1px dashed var(--line-strong);
        opacity: 0.8;
      }
      .dt {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border: 1px solid var(--line-strong);
        background: var(--bg);
      }
      .dt:hover {
        border-color: var(--ink-dim);
      }
      .th {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 4px 0 12px;
        flex: none;
      }
      .th b {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .th .src {
        color: var(--ink-dim);
        font: 400 10.5px/16px var(--font-mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .th .icon-btn {
        margin-left: auto;
        width: 26px;
        height: 26px;
        opacity: 0;
      }
      .dt:hover .th .icon-btn,
      .th .icon-btn[aria-expanded="true"] {
        opacity: 1;
      }
      .th input {
        flex: 1;
        min-width: 0;
        height: 24px;
        padding: 0 6px;
        background: var(--bg-sunk);
        border: 1px solid var(--line-strong);
        font-weight: 500;
      }
      .tb {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 0 12px 10px;
        display: flex;
        flex-direction: column;
      }
      .dt.text .tb {
        justify-content: center;
        color: var(--ink-muted);
        font-size: 13px;
        line-height: 20px;
      }
      .dt.text h3 {
        font: 700 15px/20px var(--font-pixel);
        text-transform: uppercase;
        color: var(--ink);
      }
      .dash.editing .dt {
        cursor: grab;
        border-style: dashed;
        border-color: var(--ink-dim);
      }
      .dash.editing .dt.drag {
        opacity: 0.35;
      }
      .dash.editing .dt.over {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .etools {
        position: absolute;
        top: -13px;
        right: 8px;
        z-index: 4;
        display: none;
        align-items: center;
        background: var(--bg);
        border: 1px solid var(--line-strong);
      }
      .dash.editing .etools {
        display: flex;
      }
      .etools button {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        color: var(--ink-muted);
      }
      .etools button:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .etools button.del:hover {
        color: var(--danger);
      }
      .etools .sz {
        padding: 0 6px;
        font: 400 10.5px/24px var(--font-mono);
        color: var(--ink-dim);
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .etools .px {
        width: 12px;
        height: 12px;
      }
      .dash.editing .th .icon-btn {
        display: none;
      }
      .dash.editing .dgrid {
        row-gap: 18px;
      }

      /* kpi */
      .kpi {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        flex: 1;
        gap: 4px;
      }
      .kpi .v {
        font: 500 28px/32px var(--font-mono);
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .kpi .d {
        display: flex;
        align-items: center;
        gap: 6px;
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .kpi .d .up {
        color: var(--success);
      }
      .kpi .d .dn {
        color: var(--danger);
      }
      .dt[data-h="2"] .kpi .v,
      .pvb .kpi .v {
        font-size: 48px;
        line-height: 52px;
      }

      /* pixel charts */
      .chart {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .plot {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .plot svg {
        position: absolute;
        left: 0;
        top: 0;
        shape-rendering: crispEdges;
        display: block;
      }
      .plot .ymax {
        position: absolute;
        left: 0;
        top: -2px;
        font: 400 10.5px/12px var(--font-mono);
        color: var(--ink-dim);
        background: var(--bg);
        padding-right: 4px;
        z-index: 1;
      }
      .xax {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        height: 16px;
        margin-top: 4px;
        font: 400 10.5px/16px var(--font-mono);
        color: var(--ink-dim);
        white-space: nowrap;
        overflow: hidden;
      }
      .xax.cats span {
        flex: 1;
        min-width: 0;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .legend {
        display: flex;
        gap: 12px;
        font: 400 10.5px/16px var(--font-mono);
        color: var(--ink-dim);
        margin-bottom: 6px;
      }
      .legend i {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .hz {
        fill: transparent;
        cursor: crosshair;
      }
      .hz:hover {
        fill: color-mix(in srgb, var(--ink) 6%, transparent);
      }

      /* funnel */
      .fun {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        justify-content: center;
      }
      .fr {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) 92px;
        align-items: center;
        gap: 10px;
        font-size: 12.5px;
      }
      .fr .lb {
        color: var(--ink-muted);
      }
      .fr .bar {
        height: 18px;
        position: relative;
      }
      .fr .bar i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: repeating-linear-gradient(180deg, var(--c) 0 2px, transparent 2px 4px);
      }
      .fr .bar i::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 2px;
        background: var(--c);
      }
      .fr .n {
        text-align: right;
        font: 400 12px/16px var(--font-mono);
      }
      .fr .n em {
        font-style: normal;
        color: var(--ink-dim);
        margin-left: 6px;
      }
      .fr:hover .lb {
        color: var(--ink);
      }

      /* heatmap: square cells, the same gap both ways */
      .hm {
        display: grid;
        gap: 3px;
        align-content: center;
        flex: 1;
      }
      .hm .rl {
        font: 400 11px/1 var(--font-mono);
        color: var(--ink-muted);
        align-self: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hc {
        width: var(--cell);
        height: var(--cell);
        background: var(--bg-sunk);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .hc.l1 {
        background: conic-gradient(from 90deg at 2px 2px, var(--bg-sunk) 75%, var(--accent) 0) 0
          0/4px 4px;
      }
      .hc.l2 {
        background: repeating-conic-gradient(var(--accent) 0 25%, var(--bg-sunk) 0 50%) 0 0/4px 4px;
      }
      .hc.l3 {
        background: conic-gradient(from 90deg at 2px 2px, var(--accent) 75%, var(--bg-sunk) 0) 0
          0/4px 4px;
      }
      .hc.l4 {
        background: var(--accent);
        box-shadow: none;
      }
      .hc:hover {
        outline: 1px solid var(--ink);
        outline-offset: 1px;
      }
      .hm .dim {
        opacity: 0.25;
      }
      .hm .xl {
        font: 400 10px/12px var(--font-mono);
        color: var(--ink-dim);
        white-space: nowrap;
        overflow: visible;
      }
      .hm-key {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-top: 6px;
        font: 400 10.5px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .hm-key .hc {
        --cell: 10px;
      }

      /* table tile */
      .tt {
        flex: 1;
        min-height: 0;
        overflow: auto;
        margin: 0 -12px -10px;
      }
      .tt table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      .tt th {
        position: sticky;
        top: 0;
        background: var(--bg);
        text-align: left;
        height: 28px;
        padding: 0 12px;
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        border-bottom: 1px solid var(--line-strong);
        cursor: pointer;
        white-space: nowrap;
      }
      .tt th:hover {
        color: var(--ink);
      }
      .tt th.n,
      .tt td.n {
        text-align: right;
      }
      .tt td {
        height: 32px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tt td.n {
        font: 400 12px/16px var(--font-mono);
      }
      .tt tr:hover td {
        background: var(--bg-raised);
      }
      .tt a.lnk {
        text-decoration: underline;
        text-decoration-color: var(--line-strong);
        text-underline-offset: 3px;
      }
      .tt a.lnk:hover {
        text-decoration-color: var(--accent);
      }
      .stg {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .stg .sq {
        width: 6px;
        height: 6px;
      }

      /* waiting state */
      .wait {
        flex: 1;
        display: grid;
        place-items: center;
        border: 1px dashed var(--line-strong);
        background-image: var(--hatch);
        text-align: center;
        padding: 10px;
      }
      .wait div {
        background: var(--bg);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        font-size: 12.5px;
        color: var(--ink-muted);
      }
      .wait a {
        font: 400 11px/16px var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }

      /* tooltip */
      #tip {
        position: fixed;
        z-index: 80;
        pointer-events: none;
        display: none;
        padding: 6px 8px;
        background: var(--bg);
        border: 1px solid var(--ink-muted);
        box-shadow: var(--shadow-pop);
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-muted);
        white-space: nowrap;
      }
      #tip b {
        display: block;
        color: var(--ink);
        font-weight: 500;
      }

      /* drawer (subscriptions) */
      .drawer-r {
        position: absolute;
        top: 44px;
        right: 0;
        bottom: 0;
        width: 380px;
        max-width: 100%;
        z-index: 20;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border-left: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
      }
      .drawer-r .dh {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .drawer-r .dh b {
        font-weight: 500;
      }
      .drawer-r .dh .icon-btn {
        margin-left: auto;
      }
      .drawer-r .db {
        flex: 1;
        overflow: auto;
        padding: 16px;
      }
      .drawer-r .df {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
      }
      .subc {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px;
        border: 1px solid var(--line-strong);
        margin-bottom: 8px;
      }
      .subc b {
        font-weight: 500;
        display: block;
      }
      .subc .dim {
        font: 400 11px/16px var(--font-mono);
      }
      .subc .icon-btn {
        margin-left: auto;
      }
      .fld {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .fld > label,
      .fld > .lb {
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      .inp,
      .sel {
        height: var(--ctl);
        padding: 0 8px;
        background: var(--bg-sunk);
        border: 1px solid var(--line-strong);
        width: 100%;
      }
      .inp:focus,
      .sel:focus {
        outline: none;
        border-color: var(--accent);
      }
      .sel {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
          linear-gradient(-45deg, transparent 50%, var(--ink-dim) 50%);
        background-position:
          calc(100% - 13px) 12px,
          calc(100% - 9px) 12px;
        background-size: 4px 4px;
        background-repeat: no-repeat;
        padding-right: 24px;
      }
      .seg.full {
        display: flex;
      }
      .seg.full button {
        flex: 1;
        justify-content: center;
        padding: 0 4px;
      }
      .ck {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-muted);
        cursor: pointer;
      }
      .ck i {
        width: 14px;
        height: 14px;
        border: 1px solid var(--line-strong);
        display: inline-block;
      }
      .ck[aria-checked="true"] i {
        background: var(--accent);
        border-color: var(--accent);
      }
      .rcpt {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 3px;
        min-height: var(--ctl);
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
      }
      .rcpt .chip {
        height: 20px;
      }
      .rcpt .chip button {
        color: var(--ink-dim);
      }
      .rcpt input {
        flex: 1;
        min-width: 80px;
        border: 0;
        background: none;
        outline: none;
        padding: 0 4px;
      }

      /* modal */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: color-mix(in srgb, var(--bg-sunk) 70%, transparent);
        display: none;
        place-items: start center;
        padding: 10vh 16px 16px;
      }
      .scrim.open {
        display: grid;
      }
      .modal {
        width: min(560px, 100%);
        max-height: 78vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
      }
      .modal .mh {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .modal .mh b {
        font: 700 14px/16px var(--font-pixel);
        text-transform: uppercase;
      }
      .modal .mh .icon-btn {
        margin-left: auto;
      }
      .modal .mb {
        flex: 1;
        overflow: auto;
        padding: 16px;
      }
      .modal .mf {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
      }
      .pick {
        display: flex;
        flex-direction: column;
      }
      .pick button {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 6px 10px;
        text-align: left;
        border: 1px solid transparent;
      }
      .pick button:hover,
      .pick button[aria-selected="true"] {
        background: var(--bg-raised);
        border-color: var(--line);
      }
      .pick button b {
        font-weight: 500;
        display: block;
      }
      .pick button .dim {
        font: 400 11px/16px var(--font-mono);
      }
      .pick button .k {
        margin-left: auto;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .pick .grp {
        padding: 10px 10px 4px;
      }

      /* builder (notebook) */
      .qb {
        display: grid;
        grid-template-columns: minmax(360px, 440px) minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      .nb {
        border-right: 1px solid var(--line);
        overflow: auto;
        padding: 16px;
      }
      .step {
        margin-bottom: 16px;
      }
      .step .sh {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      .step .sh .n {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border: 1px solid var(--line-strong);
        color: var(--ink-muted);
      }
      .step .sb {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--line-strong);
        background: var(--bg-raised);
      }
      .step .sb .w {
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .tok {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        background: var(--bg);
        font-weight: 500;
      }
      .tok:hover {
        border-color: var(--ink-muted);
      }
      .tok.src {
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 50%, var(--line-strong));
      }
      .tok.flt {
        color: var(--info);
        border-color: color-mix(in srgb, var(--info) 45%, var(--line-strong));
      }
      .tok.met {
        color: var(--success);
        border-color: color-mix(in srgb, var(--success) 45%, var(--line-strong));
      }
      .tok .x {
        color: var(--ink-dim);
        margin-left: 2px;
      }
      .tok .x:hover {
        color: var(--ink);
      }
      .tok.add {
        color: var(--ink-dim);
        border-style: dashed;
        font-weight: 400;
      }
      .vz {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
        width: 100%;
      }
      .vz button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 4px;
        border: 1px solid var(--line-strong);
        background: var(--bg);
        font: 400 10.5px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .vz button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--ink);
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .vz button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .vz button:hover:not(:disabled) {
        color: var(--ink);
      }
      .pv {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .pvh {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .pvh .r {
        margin-left: auto;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .pvb {
        flex: 1;
        min-height: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: auto;
      }
      .pvb .dt {
        flex: 1;
        min-height: 300px;
      }
      .sql {
        margin: 0;
        padding: 12px 14px;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        font: 400 12px/19px var(--font-mono);
        color: var(--ink-muted);
        white-space: pre-wrap;
      }
      .sql .kw {
        color: var(--accent);
      }
      .notice {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid color-mix(in srgb, var(--warning) 45%, var(--line-strong));
        color: var(--ink-muted);
        font-size: 12.5px;
      }
      .notice .px {
        color: var(--warning);
      }
      .notice a {
        margin-left: auto;
        font: 400 11px/16px var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }

      /* toast */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 44px;
        transform: translateX(-50%);
        z-index: 90;
        display: none;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: var(--ink);
        color: var(--bg);
        font: 400 12px/16px var(--font-mono);
      }
      #toast.open {
        display: flex;
      }
      #toast .led {
        background: var(--success);
      }

      .pop.wide {
        min-width: 260px;
        max-height: 360px;
        overflow: auto;
      }
      .pop .r .sq {
        width: 6px;
        height: 6px;
        flex: none;
      }
      .pop .r.on {
        color: var(--ink);
      }
      .pop .r.on::after {
        content: "";
        margin-left: auto;
        width: 6px;
        height: 6px;
        background: var(--accent);
      }

      @media (max-width: 1100px) {
        .qb {
          grid-template-columns: 1fr;
        }
        .nb {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          overflow: visible;
        }
        .qb {
          overflow: auto;
          display: block;
        }
        .pvb .dt {
          min-height: 320px;
        }
      }
      @media (max-width: 860px) {
        .dgrid {
          grid-template-columns: 1fr;
        }
        .dgrid .dt {
          grid-column: 1/-1 !important;
        }
        .guides {
          display: none;
        }
        .ph,
        .sec {
          padding-left: 16px;
          padding-right: 16px;
        }
        .fbar {
          padding: 8px 16px;
        }
        .dgrid-wrap {
          padding: 12px 12px 24px;
        }
        .ph-row {
          flex-wrap: wrap;
        }
        .ph .acts {
          margin-left: 0;
        }
        .list .hide-sm {
          display: none;
        }
        .hide-sm {
          display: none !important;
        }
        .drawer-r {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>

      <div class="mainwrap">

      function px(name) {
        const rows = ICONS[name];
        if (!rows) return "";
        const n = rows.length;
        let a = "",
          b = "";
        rows.forEach((r, y) => {
          let x = 0;
          while (x < r.length) {
            const c = r[x];
            if (c !== "#" && c !== "o") {
              x++;
              continue;
            }
            const s = x;
            while (x < r.length && r[x] === c) x++;
            const d = `M${s} ${y}h${x - s}v1h-${x - s}z`;
            if (c === "#") a += d;
            else b += d;
          }
        });
        return `<svg class="px" viewBox="0 0 ${n} ${n}" aria-hidden="true"><path fill="currentColor" d="${a}"/>${b ? `<path class="o" fill="currentColor" d="${b}"/>` : ""}</svg>`;
      }
      const I = (n) => `<span data-i="${n}">${px(n)}</span>`;
      function fillIcons(...els) {
        for (const el of els)
          if (el) el.innerHTML = el.innerHTML.replace(/%%I:([a-z0-9-]+)%%/g, (_, n) => I(n));
      }
      function bayer(x, y) {
        const m = [
          [0, 8, 2, 10],
          [12, 4, 14, 6],
          [3, 11, 1, 9],
          [15, 7, 13, 5],
        ];
        return (m[y & 3][x & 3] + 0.5) / 16;
      }
      // A dithered cover: pixels on or off, accent over the background.
      function ditherCover(canvas, seed = 1) {
        const cs = getComputedStyle(document.documentElement),
          acc = cs.getPropertyValue("--accent").trim(),
          bg = cs.getPropertyValue("--bg-sunk").trim();
        const w = (canvas.width = Math.ceil(canvas.clientWidth / 4)),
          h = (canvas.height = Math.ceil(canvas.clientHeight / 4));
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = acc;
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const v =
              0.5 +
              0.5 * Math.sin((x / w) * Math.PI * (1.2 + seed * 0.3) + seed) * (1 - y / h) -
              0.35 +
              (y / h) * 0.15 * Math.cos(x / 9 + seed);
            if (v > bayer(x, y)) ctx.fillRect(x, y, 1, 1);
          }
      }

          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

          for (const [f, v] of q.filters || [])

            return rows.length

          case "winrate": {
            const w = rows.filter((r) => r.stage === "won").length,

            return w + l ? w / (w + l) : null;
          }
          default:
            return rows.reduce((s, r) => s + (r.n || 1), 0);
        }

        if (q.agg === "distinct") return "Distinct " + s.cats[q.field].toLowerCase() + "s";
        if (q.agg === "winrate") return "Win rate";

          return { v, pv, f, n: rows.length };

        if (viz === "funnel") {
          const rows = rowsFor(q, ctx);
          return {
            f: "int",
            n: rows.length,
            steps: STAGES.slice(0, 4).map(([k, l, c], i) => ({
              l,
              c,
              v: rows.filter((r) => r.reached >= i).length,
            })),

        if (viz === "heatmap") {
          const bs = buckets(ctx.period),
            rows = rowsFor(q, ctx, false, true);

            bs.map((b) =>
              agg(
                q,
                rows.filter((r) => r.team === t && r[q.on] >= b.s && r[q.on] < b.e),
              ),
            ),
          );
          return { bs, m, f, n: rows.length };
        }
        if (q.by === "time") {
          const bs = buckets(ctx.period),
            rows = rowsFor(q, ctx),
            { a, pa } = range(ctx.period),
            sh = a - pa,
            prow = q.noPeriod ? [] : rowsFor(q, ctx, true);
          return {

            f,
            n: rows.length,

                rows.filter((r) => r[q.on] >= b.s && r[q.on] < b.e),

              agg(
                q,
                prow.filter((r) => r[q.on] + sh >= b.s && r[q.on] + sh < b.e),

            ),

          return { groups: g.slice(0, q.limit || 12), f, n: rows.length, byLabel: s.cats[q.by] };

        return { rows, f, n: rows.length };

      let FAVS = new Set(["sales-weekly", qByName("Open deals").id]);
      let RECENTS = [
        ["d", "sales-weekly", TODAY - 3600e3],
        ["q", qByName("Pipeline funnel").id, TODAY - 2 * DAY],
        ["d", "ops-board", TODAY - 3 * DAY],
        ["d", "pipeline-review", TODAY - 6 * DAY],
      ];
      const dashById = (id) => DASHES.find((d) => d.id === id),
        qById = (id) => QUESTIONS.find((q) => q.id === id),
        collById = (id) => COLLS.find((c) => c.id === id);
      function touch(kind, id) {
        RECENTS = RECENTS.filter((r) => !(r[0] === kind && r[1] === id));
        RECENTS.unshift([kind, id, NOW]);
        RECENTS = RECENTS.slice(0, 8);
      }
      const ago = (t) => {
        const d = Math.floor((NOW - t) / DAY);
        return t >= TODAY ? "today" : d <= 1 ? "yesterday" : d + " days ago";
      };

      // view preferences (filters) remembered per viewer
      const prefs = (() => {
        try {
          return JSON.parse(localStorage.getItem("fg-dash-prefs") || "{}");
        } catch (e) {
          return {};
        }
      })();
      const savePrefs = () => {
        try {
          localStorage.setItem("fg-dash-prefs", JSON.stringify(prefs));
        } catch (e) {}
      };
      const defPeriod = (id) => (dashById(id) || {}).period || "d7";
      const ctxFor = (id) => prefs[id] || { period: defPeriod(id), team: "all" };

      // ------------------------------------------------------------ chrome
      function head(crumbs, acts = "") {
        return `<header class="head"><button class="icon-btn menu" id="menuBtn" aria-label="Navigation">${I("sidebar-left")}</button><div class="crumb">${crumbs}</div><div class="acts">${acts}</div></header>`;
      }
      const crumbColl = (c) =>
        `<a href="#/collection/${c.id}">${I(c.icon)}${esc(c.name)}</a><span class="sep">/</span>`;
      function nav() {
        const path = location.hash.replace(/^#\/?/, "") || "home";
        const cur = (p) => (path === p || path.startsWith(p + "/") ? "page" : "false");
        const favs = [...FAVS]
          .map((id) => {
            const d = dashById(id);
            if (d)
              return `<a class="it" href="#/dashboard/${d.id}" aria-current="${cur("dashboard/" + d.id)}">${I("dashboard-square-01")}<span class="lbl">${esc(d.name)}</span></a>`;
            const q = qById(id);
            return q
              ? `<a class="it" href="#/question/${q.id}" aria-current="${cur("question/" + q.id)}">${I("bar-chart")}<span class="lbl">${esc(q.name)}</span></a>`
              : "";
          })
          .join("");
        $("#nav").innerHTML = `
    <a class="it" href="#/home" aria-current="${cur("home")}">${I("home-01")}<span class="lbl">Home</span></a>
    <a class="it" href="#/subscriptions" aria-current="${cur("subscriptions")}">${I("notification-01")}<span class="lbl">Subscriptions and alerts</span></a>
    <a class="it" href="datahub.html">${I("database")}<span class="lbl">Browse data</span><span class="k">↗</span></a>
    <div class="nav-sec"><button class="nav-h" aria-expanded="true" data-fold>Collections <span class="car">${I("arrow-down-01")}</span></button>
      <div>${COLLS.map((c) => `<a class="it" href="#/collection/${c.id}" aria-current="${cur("collection/" + c.id)}">${I(c.id === "personal" ? "user" : "folder-01")}<span class="lbl">${esc(c.id === "personal" ? "Your personal collection" : c.name)}</span></a>`).join("")}</div></div>
    <div class="nav-sec"><button class="nav-h" aria-expanded="true" data-fold>Favorites <span class="car">${I("arrow-down-01")}</span></button>
      <div>${favs || `<div class="it dim" style="cursor:default">Star a dashboard</div>`}</div></div>`;
        $$("[data-fold]", $("#nav")).forEach(
          (h) =>
            (h.onclick = () => {
              const o = h.getAttribute("aria-expanded") !== "false";
              h.setAttribute("aria-expanded", !o);
              h.nextElementSibling.hidden = o;
            }),
        );
      }

      // ------------------------------------------------------------ tile rendering
      let VIZ = {}; // id → {res, q, tid}
      function tileBody(t, ctx, vid) {
        if (t.kind === "text")
          return `<div class="tb">${t.heading ? `<h3>${esc(t.text)}</h3>` : `<p>${linkify(esc(t.text))}</p>`}</div>`;
        const q = t.q,
          res = run(q, ctx);
        VIZ[vid] = { res, q, t, ctx };
        if (res.waiting)
          return `<div class="tb"><div class="wait"><div>${I("hourglass")}<span>No rows yet. Invoices syncs once ${res.waiting} is connected.</span><a href="console-home.html#/integrations/stripe">Connect ${res.waiting} ↗</a></div></div></div>`;
        let h = "";
        if (q.viz === "number") {
          const up =
            res.pv != null && res.v != null
              ? res.pv
                ? (res.v - res.pv) / Math.abs(res.pv)
                : null
              : null;
          const dl = q.noPeriod
            ? `<span>open now · ignores period</span>`
            : up == null
              ? `<span>no data for the ${prevLabel(ctx.period)}</span>`
              : `<span class="${up >= 0 ? "up" : "dn"}">${up >= 0 ? "▲" : "▼"} ${Math.abs(up * 100).toFixed(1)}%</span><span>vs ${prevLabel(ctx.period)} (${fmt(res.pv, res.f, true)})</span>`;
          h = `<div class="kpi"><div class="v" data-tip="${esc(t.title)}|${fmt(res.v, res.f)} · ${res.n} rows">${fmt(res.v, res.f)}</div><div class="d">${dl}</div></div>`;
        } else if (q.viz === "bar" || q.viz === "step") {
          const cats = !res.bs;
          h = `<div class="chart">${q.viz === "step" && !cats ? `<div class="legend"><span><i style="background:var(--accent)"></i>${PERIODS[ctx.period][0]}</span><span><i style="background:repeating-linear-gradient(90deg,var(--ink-dim) 0 2px,transparent 2px 4px)"></i>${prevLabel(ctx.period)}</span></div>` : ""}<div class="plot" data-viz="${vid}"></div><div class="xax${cats ? " cats" : ""}">${cats ? res.groups.map((g) => `<span title="${esc(g.l)}">${esc(g.l)}</span>`).join("") : axisLabels(res.bs)}</div></div>`;
        } else if (q.viz === "funnel") {
          const top = res.steps[0].v || 1;
          h = `<div class="fun">${res.steps
            .map((s, i) => {
              const pr = i ? res.steps[i - 1].v : 0;
              const conv = i && pr ? Math.round((s.v / pr) * 100) + "%" : "";
              return `<div class="fr" data-tip="${s.l}|${s.v} deals${i ? ` · ${conv} of ${res.steps[i - 1].l.toLowerCase()}` : ""}"><span class="lb">${s.l}</span><span class="bar" style="--c:${i === 3 ? "var(--accent)" : "var(--ink-muted)"}"><i style="width:${Math.max(1, (s.v / top) * 100)}%"></i></span><span class="n">${s.v}<em>${conv}</em></span></div>`;
            })
            .join("")}</div>`;
        } else if (q.viz === "heatmap") {
          h = `<div class="chart" data-hm="${vid}"></div>`;
        } else if (q.viz === "table") {
          h = tableHtml(res, q, vid);
        }
        return `<div class="tb">${h}</div>`;
      }
      const linkify = (s) =>
        s.replace(
          /OPS-(\d+)/g,
          '<a class="lnk" style="color:var(--accent)" href="tasks.html#/issue/OPS-$1">OPS-$1</a>',
        );
      function axisLabels(bs) {
        const n = bs.length;
        const idx =
          n <= 7 ? bs.map((_, i) => i) : [0, Math.floor(n / 3), Math.floor((2 * n) / 3), n - 1];
        return idx.map((i) => `<span>${bs[i].l}</span>`).join("");
      }
      function cell(q, f, r, kind) {
        const v = r[f];
        if (kind === "date") return `<td class="d">${v ? fmtD(v) : "—"}</td>`;
        if (kind === "eur") return `<td class="n">${eur(v)}</td>`;
        if (kind === "int") return `<td class="n">${v}</td>`;
        if (f === "company")
          return `<td><a class="lnk" href="crm.html#/companies/${v}">${esc(COS[v])}</a></td>`;
        if (f === "stage") {
          const s = STAGES.find((x) => x[0] === v);
          return `<td><span class="stg"><span class="sq" style="background:${s[2]}"></span>${s[1]}</span></td>`;
        }
        if (f === "owner" || f === "assignee")
          return `<td>${PEOPLE[v] ? `<span class="stg">${av(v)}${PEOPLE[v]}</span>` : '<span class="dim">Unassigned</span>'}</td>`;
        if (f === "id" && r.tasks)
          return `<td class="d"><a class="lnk" href="tasks.html#/issue/${v}">${v}</a></td>`;
        if (f === "id") return `<td class="d">${v}</td>`;
        if (f === "name" && r.crm)
          return `<td><a class="lnk" href="crm.html#/companies/${r.company}">${esc(v)}</a></td>`;
        return `<td>${esc(v)}</td>`;
      }
      function tableHtml(res, q, vid) {
        const s = SRC[q.src];
        if (res.groups)
          return `<div class="tt"><table><thead><tr><th>${esc(res.byLabel)}</th><th class="n">${esc(metricName(q))}</th></tr></thead><tbody>${res.groups.map((g) => `<tr><td>${esc(g.l)}</td><td class="n">${fmt(g.v, res.f)}</td></tr>`).join("")}</tbody></table></div>`;
        const [sf, sd] = q.sort || ["created", -1];
        const rows = res.rows
          .slice()
          .sort((a, b) => {
            const x = a[sf],
              y = b[sf];
            return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sd;
          })
          .slice(0, q.limit || 50);
        if (!rows.length)
          return `<div class="wait"><div>${I("search-01")}<span>No rows for these filters.</span></div></div>`;
        return `<div class="tt"><table><thead><tr>${s.cols.map(([f, l, k]) => `<th class="${k === "eur" || k === "int" ? "n" : ""}" data-sort="${vid}|${f}">${l}${sf === f ? (sd < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${s.cols.map(([f, , k]) => cell(q, f, r, k)).join("")}</tr>`).join("")}</tbody></table></div>`;
      }
      function tileHtml(t, ctx, dashId, edit, i) {
        const vid = (dashId || "pv") + "-" + t.id;
        const src = t.kind === "text" ? "" : `<span class="src">${t.q.src}</span>`;
        return `<section class="dt${t.kind === "text" ? " text" : ""}" data-t="${t.id}" data-h="${t.h}" style="grid-column:span ${t.w};grid-row:span ${t.h}" ${edit ? 'draggable="true"' : ""}>
    <div class="etools"><button title="Drag to move" style="cursor:grab">${I("drag-drop-vertical")}</button><button data-ed="left" title="Move earlier">${I("arrow-left-01")}</button><button data-ed="right" title="Move later">${I("arrow-right-01")}</button><span class="sz">${t.w}×${t.h}</span><button data-ed="narrow" title="Narrower">${I("minus-sign")}</button><button data-ed="wide" title="Wider">${I("plus-sign")}</button><button data-ed="short" title="Shorter">${I("arrow-up-01")}</button><button data-ed="tall" title="Taller">${I("arrow-down-01")}</button><button class="del" data-ed="del" title="Remove">${I("delete-02")}</button></div>
    <header class="th">${edit ? `<input value="${esc(t.title)}" data-rename="${t.id}" aria-label="Tile title">` : `<b>${esc(t.title)}</b>${src}`}<button class="icon-btn" data-tmenu="${t.id}" aria-label="Tile menu">${I("more-horizontal")}</button></header>
    ${tileBody(t, ctx, vid)}</section>`;
      }

      // ------------------------------------------------------------ pixel drawing (after layout)
      const P = 2; // one chart pixel = 2 CSS px
      function rect(x, y, w, h) {
        return `M${x} ${y}h${w}v${h}h-${w}z`;
      }
      function drawAll(root = document) {
        $$("[data-viz]", root).forEach((el) => {
          const V = VIZ[el.dataset.viz];
          if (!V) return;
          V.q.viz === "step" ? drawStep(el, V) : drawBars(el, V);
        });
        $$("[data-hm]", root).forEach((el) => {
          const V = VIZ[el.dataset.hm];
          if (V) drawHeat(el, V);
        });
      }
      function svgOpen(cols, rows, pid) {
        return `<svg width="${cols * P}" height="${rows * P}" viewBox="0 0 ${cols} ${rows}"><defs>
  <pattern id="${pid}s" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" style="fill:var(--ink-muted)"/></pattern>
  <pattern id="${pid}a" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" style="fill:var(--accent)"/></pattern>
  <pattern id="${pid}d" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" style="fill:var(--accent)"/><rect x="2" y="2" width="1" height="1" style="fill:var(--accent)"/></pattern></defs>`;
      }
      function gridLines(cols, rows) {
        let d = "";
        for (const f of [0.25, 0.5, 0.75]) {
          const y = Math.round(rows * f);
          for (let x = 0; x < cols; x += 3) d += rect(x, y, 1, 1);
        }
        return `<path d="${d}" style="fill:var(--line-strong)"/>`;
      }
      function drawBars(el, V) {
        const r = V.res,
          vals = r.bs ? r.vals : r.groups.map((g) => g.v || 0),
          labels = r.bs ? r.bs.map((b) => b.l) : r.groups.map((g) => g.l);
        const W = el.clientWidth,
          H = el.clientHeight;
        if (W < 20 || H < 20) return;
        const cols = Math.floor(W / P),
          rows = Math.floor(H / P),
          n = vals.length || 1,
          m = Math.max(...vals, 1);
        const slot = cols / n,
          gap = Math.max(1, Math.round(slot * 0.22)),
          pid = "p" + Math.random().toString(36).slice(2, 7);
        let solid = "",
          body = "",
          accS = "",
          accB = "",
          hz = "";
        vals.forEach((v, i) => {
          const x = Math.round(i * slot),
            bw = Math.max(1, Math.round((i + 1) * slot) - x - gap),
            bh = v ? Math.max(2, Math.round((v / m) * (rows - 8))) : 0,
            y = rows - bh;
          const hi = r.bs ? i === n - 1 : i === 0;
          if (bh) {
            hi
              ? ((accS += rect(x, y, bw, 2)), (accB += rect(x, y + 2, bw, bh - 2)))
              : ((solid += rect(x, y, bw, 2)), (body += rect(x, y + 2, bw, bh - 2)));
          }
          hz += `<rect class="hz" x="${x}" y="0" width="${bw}" height="${rows}" data-tip="${esc(labels[i])}|${esc(fmt(v, r.f))}"/>`;
        });
        el.innerHTML = `<span class="ymax">${fmt(m, r.f, true)}</span>${svgOpen(cols, rows, pid)}${gridLines(cols, rows)}<path d="${body}" fill="url(#${pid}s)"/><path d="${solid}" style="fill:var(--ink-muted)"/><path d="${accB}" fill="url(#${pid}a)"/><path d="${accS}" style="fill:var(--accent)"/><path d="${rect(0, rows - 1, cols, 1)}" style="fill:var(--line-strong)"/>${hz}</svg>`;
      }
      function drawStep(el, V) {
        const r = V.res,
          W = el.clientWidth,
          H = el.clientHeight;
        if (W < 20 || H < 20) return;
        const cols = Math.floor(W / P),
          rows = Math.floor(H / P),
          n = r.vals.length,
          m = Math.max(...r.vals, ...r.prev, 1),
          pid = "p" + Math.random().toString(36).slice(2, 7);
        const yOf = (v) => rows - 2 - Math.round((v / m) * (rows - 8)),
          xs = (i) => Math.round((i * cols) / n);
        let line = "",
          area = "",
          prev = "",
          hz = "";
        let py = null;
        r.vals.forEach((v, i) => {
          const x0 = xs(i),
            x1 = xs(i + 1),
            y = yOf(v);
          line += rect(x0, y, x1 - x0, 1);
          if (py != null && py !== y) line += rect(x0, Math.min(py, y), 1, Math.abs(py - y) + 1);
          area += rect(x0, y + 1, x1 - x0, rows - 1 - y - 1 > 0 ? rows - y - 2 : 0);
          py = y;
          const pv = r.prev[i],
            yp = yOf(pv);
          for (let x = x0; x < x1; x += 2) prev += rect(x, yp, 1, 1);
          hz += `<rect class="hz" x="${x0}" y="0" width="${x1 - x0}" height="${rows}" data-tip="${esc(r.bs[i].l)}|${fmt(v, r.f)} · before ${fmt(pv, r.f)}"/>`;
        });
        el.innerHTML = `<span class="ymax">${fmt(m, r.f, true)}</span>${svgOpen(cols, rows, pid)}${gridLines(cols, rows)}<path d="${area}" fill="url(#${pid}d)"/><path d="${prev}" style="fill:var(--ink-dim)"/><path d="${line}" style="fill:var(--accent)"/><path d="${rect(0, rows - 1, cols, 1)}" style="fill:var(--line-strong)"/>${hz}</svg>`;
      }
      function drawHeat(el, V) {
        const r = V.res,
          ctx = V.ctx,
          n = r.bs.length,
          W = el.clientWidth,
          H = el.clientHeight,
          lab = 84,
          gap = 3;
        const cellW = Math.floor((W - lab - gap * n) / n),
          cellH = Math.floor((H - 30 - gap * TEAMS.length) / TEAMS.length);
        const c = Math.max(6, Math.min(28, cellW, cellH)),
          mx = Math.max(...r.m.flat(), 1);
        const lvl = (v) => (!v ? 0 : Math.min(4, 1 + Math.floor((v / mx) * 3.999)));
        const step = n > 14 ? 7 : n > 8 ? 3 : 1;
        el.innerHTML = `<div class="hm" style="--cell:${c}px;grid-template-columns:${lab}px repeat(${n},${c}px)">
    ${TEAMS.map((t, ti) => {
      const dim = ctx.team !== "all" && ctx.team !== t ? " dim" : "";
      return (
        `<span class="rl${dim}">${t}</span>` +
        r.m[ti]
          .map(
            (v, i) =>
              `<span class="hc l${lvl(v)}${dim}" data-tip="${t} · ${r.bs[i].l}|${v} activities"></span>`,
          )
          .join("")
      );
    }).join("")}
    <span></span>${r.bs.map((b, i) => `<span class="xl">${i % step === 0 ? (n <= 7 ? b.l.slice(0, 3) : b.l) : ""}</span>`).join("")}</div>
    <div class="hm-key">Less <span class="hc"></span><span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span><span class="hc l4"></span> More</div>`;
      }

      // ------------------------------------------------------------ pages
      function home() {
        const rec = RECENTS.map(([k, id, t]) => {
          const o = k === "d" ? dashById(id) : qById(id);
          if (!o) return "";
          return `<a class="card tk-hover" href="#/${k === "d" ? "dashboard" : "question"}/${id}"><span class="tdot ${k === "d" ? "dash" : "q"}">${I(k === "d" ? "dashboard-square-01" : "bar-chart")}</span><b>${esc(o.name)}</b><span class="meta">${esc(collById(o.coll).name)} · ${ago(t)}</span></a>`;
        }).join("");
        const fav = [...FAVS]
          .map((id) => {
            const d = dashById(id),
              q = qById(id),
              o = d || q;
            if (!o) return "";
            return `<a class="card tk-hover" href="#/${d ? "dashboard" : "question"}/${id}"><span class="tdot ${d ? "dash" : "q"}">${I(d ? "dashboard-square-01" : "bar-chart")}</span><b>${esc(o.name)}</b><span class="meta">${I("star-fill")}${esc(collById(o.coll).name)}</span></a>`;
          })
          .join("");
        return (
          head(
            `<b>${I("home-01")}Home</b>`,
            `<button class="btn" data-new-q>${I("plus-sign")}New question</button>`,
          ) +
          `<div class="body">
    <div class="ph"><div class="ph-row"><div><h1>Good afternoon, Camille</h1><div class="sub">Tuesday 17 November 2026</div></div></div></div>
    <div class="sec"><div class="sec-h"><span class="eyebrow">Pick up where you left off</span></div><div class="cards">${rec}</div></div>
    <div class="sec" style="padding-top:0"><div class="sec-h"><span class="eyebrow">Favorites</span></div>${fav ? `<div class="cards">${fav}</div>` : `<div class="empty"><span>Star a dashboard or a question to keep it here</span></div>`}</div>
    <div class="sec" style="padding-top:0"><div class="sec-h"><span class="eyebrow">Collections</span></div><div class="cards">${COLLS.map(
      (c) => {
        const nd = DASHES.filter((d) => d.coll === c.id).length,
          nq = QUESTIONS.filter((q) => q.coll === c.id).length;
        return `<a class="card tk-hover" href="#/collection/${c.id}"><span class="tdot col">${I(c.id === "personal" ? "user" : "folder-01")}</span><b>${esc(c.id === "personal" ? "Your personal collection" : c.name)}</b><span class="meta">${nd} dashboard${nd === 1 ? "" : "s"} · ${nq} question${nq === 1 ? "" : "s"}</span></a>`;
      },
    ).join("")}</div></div>
  </div>`
        );
      }
      let collTab = "all";
      function collection(id) {
        const c = collById(id);
        if (!c) return stub("Collection not found");
        const items = [
          ...DASHES.filter((d) => d.coll === id).map((d) => ({ k: "d", o: d })),
          ...QUESTIONS.filter((q) => q.coll === id).map((q) => ({ k: "q", o: q })),
        ].filter((x) => collTab === "all" || x.k === collTab[0]);
        return (
          head(
            `<b>${I(c.id === "personal" ? "user" : "folder-01")}${esc(c.id === "personal" ? "Your personal collection" : c.name)}</b>`,
            `<button class="btn" data-new-dash="${id}">${I("dashboard-square-01")}New dashboard</button><button class="btn primary" data-new-q="${id}">${I("plus-sign")}New question</button>`,
          ) +
          `<div class="body">
    <div class="ph"><div class="ph-row"><div><h1>${esc(c.id === "personal" ? "Your personal collection" : c.name)}</h1><div class="sub">${c.id === "personal" ? "Only you see what is in here." : `Shared with the ${esc(c.name)} team and Direction.`}</div></div></div></div>
    <div class="sec"><div class="ltab seg">${[
      ["all", "All"],
      ["dash", "Dashboards"],
      ["q", "Questions"],
    ]
      .map(([k, l]) => `<button data-ctab="${k}" aria-pressed="${collTab === k}">${l}</button>`)
      .join("")}</div>
    ${
      items.length
        ? `<table class="list"><thead><tr><th style="width:36px"></th><th>Name</th><th class="hide-sm">Type</th><th class="hide-sm">Last edited by</th><th>Edited</th><th></th></tr></thead><tbody>${items
            .map(
              ({
                k,
                o,
              }) => `<tr class="r"><td><button class="starb" data-star="${o.id}" aria-pressed="${FAVS.has(o.id)}" aria-label="Favorite">${I(FAVS.has(o.id) ? "star-fill" : "star")}</button></td>
      <td><span class="nm"><span class="tdot ${k === "d" ? "dash" : "q"}">${I(k === "d" ? "dashboard-square-01" : "bar-chart")}</span><a href="#/${k === "d" ? "dashboard" : "question"}/${o.id}">${esc(o.name)}</a></span></td>

      <td class="end"><button class="icon-btn" data-imenu="${k}|${o.id}" aria-label="More">${I("more-horizontal")}</button></td></tr>`,
            )

    }</div></div>`
