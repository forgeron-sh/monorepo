      :root {
        --bg: #0a0a0a;
        --bg-raised: #111111;
        --bg-sunk: #050505;
        --line: #1c1c1c;
        --line-strong: #2e2e2e;
        --ink: #ededed;
        --ink-muted: #8f8f8f;
        --ink-dim: #5e5e5e;
        --accent: #ff4f1f;
        --accent-ink: #0a0a0a;
        --focus: var(--accent);
        --success: #3ddc84;
        --warning: #ffb020;
        --danger: #ff6b81;
        --info: #7aa2ff;
        --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.6);
        --font-pixel: "Forge Sans", "Geist Mono", ui-monospace, monospace;
        --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
        --hatch: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 9px);
        --ctl: 28px;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #f7f7f5;
        --bg-raised: #ededea;
        --bg-sunk: #ffffff;
        --line: #e2e2de;
        --line-strong: #c4c4be;
        --ink: #111111;
        --ink-muted: #5c5c58;
        --ink-dim: #80807a;
        --accent: #c93a10;
        --accent-ink: #0a0a0a;
        --success: #157a3e;
        --warning: #8a5300;
        --danger: #b4233f;
        --info: #2f5bd1;
        --shadow-pop: 0 8px 24px rgba(17, 17, 17, 0.12);
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border-radius: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/16px var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--accent);
        color: var(--accent-ink);
      }
      [data-i] {
        display: inline-flex;
        flex: none;
      }
      .px {
        display: inline-block;
        flex: none;
        width: 16px;
        height: 16px;
        shape-rendering: crispEdges;
      }
      .px .o {
        opacity: 0.4;
      }
      .eyebrow {
        font: 500 11px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .dim {
        color: var(--ink-dim);
      }
      .muted {
        color: var(--ink-muted);
      }
      .led {
        display: inline-block;
        flex: none;
        width: 6px;
        height: 6px;
        background: var(--ink-dim);
      }
      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border: 1px solid var(--line-strong);
        font: 500 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: var(--ctl);
        height: var(--ctl);
        flex: none;
        border: 1px solid transparent;
        color: var(--ink-muted);
      }
      .icon-btn:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .icon-btn.boxed {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        flex: none;
      }
      .btn:hover {
        border-color: var(--ink);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--ink));
      }
      .btn.ghost {
        border-color: transparent;
        color: var(--ink-muted);
      }
      .btn.ghost:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
      }
      .seg button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: calc(var(--ctl) - 2px);
        padding: 0 10px;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        white-space: nowrap;
      }
      .seg button + button {
        border-left: 1px solid var(--line-strong);
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }
      .seg button:hover:not([aria-pressed="true"]) {
        color: var(--ink);
      }
      .seg.icons button {
        width: calc(var(--ctl) - 2px);
        padding: 0;
        justify-content: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 7px;
        border: 1px solid var(--line-strong);
        font: 400 11.5px/1 var(--font-sans);
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .chip .sq {
        width: 6px;
        height: 6px;
        flex: none;
      }
      .chip .px {
        width: 12px;
        height: 12px;
      }
      .av {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        flex: none;
        background: var(--bg-sunk);
        border: 1px solid var(--line-strong);
        font: 500 8.5px/1 var(--font-mono);
        color: var(--ink);
      }
      .av.me {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        font: 700 9px/1 var(--font-pixel);
        text-transform: uppercase;
        color: var(--ink);
      }
      .logo.lg {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }
      .pop {
        position: fixed;
        z-index: 60;
        min-width: 220px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
        padding: 4px;
        display: none;
      }
      .pop.open {
        display: block;
      }
      .pop .h {
        padding: 8px 10px 6px;
      }
      .pop a,
      .pop button.r {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 30px;
        padding: 0 10px;
        color: var(--ink-muted);
        text-align: left;
      }
      .pop a:hover,
      .pop button.r:hover,
      .pop button.r[aria-selected="true"] {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .pop a kbd,
      .pop button.r kbd,
      .pop button.r .k {
        margin-left: auto;
      }
      .pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      /* app frame shared by the apps: a side, an inset panel with handles, a foot */
      .app {
        display: grid;
        grid-template-columns: var(--side) minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
      }
      .side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 8px 12px 0;
      }
      .side-head {
        display: flex;
        align-items: center;
        gap: 4px;
        height: var(--ctl);
        margin-bottom: 10px;
      }
      .ws {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px 0 4px;
        border: 1px solid transparent;
        min-width: 0;
        flex: 1;
      }
      .ws:hover {
        border-color: var(--line-strong);
      }
      .ws .tile {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .ws .tile .px {
        width: 12px;
        height: 12px;
      }
      .ws b {
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ws .chev {
        color: var(--ink-dim);
      }
      .searchbox {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        background: var(--bg-sunk);
        color: var(--ink-dim);
        width: 100%;
        text-align: left;
      }
      .searchbox:hover {
        border-color: var(--line-strong);
        color: var(--ink-muted);
      }
      .searchbox span:nth-child(2) {
        flex: 1;
      }
      .nav {
        flex: 1;
        overflow: auto;
        margin: 0 -4px;
        padding: 0 4px 12px;
        scrollbar-width: none;
      }
      .nav-sec {
        margin-top: 14px;
      }
      .nav-h {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        color: var(--ink-dim);
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        width: 100%;
        text-align: left;
      }
      .nav-h:hover {
        color: var(--ink-muted);
      }
      .nav-h .car {
        margin-left: auto;
        transition: transform 0.12s;
      }
      .nav-h[aria-expanded="false"] .car {
        transform: rotate(-90deg);
      }
      .it {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--nav-row, 28px);
        padding: 0 8px;
        color: var(--ink-muted);
        border: 1px solid transparent;
        white-space: nowrap;
        width: 100%;
        text-align: left;
      }
      .it:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .it[aria-current="page"] {
        color: var(--ink);
        background: var(--bg-raised);
        border-color: var(--line);
      }
      .it[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: -5px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--accent);
      }
      .it .lbl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .it .k {
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .side-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 44px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        margin: 0 -12px;
        padding-left: 12px;
        padding-right: 12px;
      }
      .mainwrap {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 8px 8px 0 0;
      }
      .panel {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line-strong);
        background: var(--bg);
      }
      .panel::before,
      .panel::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        pointer-events: none;
        z-index: 3;
      }
      .panel::before {
        top: -4px;
        left: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .panel::after {
        bottom: -4px;
        right: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        height: var(--ctl);
        margin: 4px 2px 4px 4px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .foot .led {
        background: var(--success);
      }
      .foot a:hover {
        color: var(--ink);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font: 500 13px/16px var(--font-sans);
      }
      .crumb a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 5px 0 4px;
        margin-left: -4px;
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .crumb a:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .crumb .sep {
        color: var(--ink-dim);
      }
      .crumb b {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .head .acts {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .menu {
        display: none !important;
      }
      .tk-hover:hover {
        --t: var(--accent);
        background-image:
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t));
        background-size:
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px;
        background-position:
          top left,
          top left,
          top right,
          top right,
          bottom left,
          bottom left,
          bottom right,
          bottom right;
        background-repeat: no-repeat;
      }
      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: fixed;
          inset: 0 auto 0 0;
          width: 280px;
          z-index: 30;
          background: var(--bg);
          border-right: 1px solid var(--line);
          transform: translateX(-100%);
          transition: transform 0.2s;
        }
        .app.drawer .side {
          transform: none;
          box-shadow: var(--shadow-pop);
        }
        .mainwrap {
          padding: 0;
        }
        .panel {
          border: 0;
        }
        .panel::before,
        .panel::after {
          display: none;
        }
        .menu {
          display: inline-grid !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* Client portal: Copilot / SuiteDash / HoneyBook portal structure (what needs you, shared project, files, billing, requests),
   Stripe-hosted invoice and Zendesk "My requests" patterns, drawn in the Forgeron language. */
      :root {
        --side: 248px;
      }
      .app.noacc {
        --accent: var(--ink);
      }
      .app.noacc .btn.primary {
        color: var(--bg);
      }
      .app.out {
        grid-template-columns: minmax(0, 1fr);
      }
      .app.out .side {
        display: none;
      }
      .app.out .mainwrap {
        padding-left: 8px;
      }
      .nav .badge {
        margin-left: auto;
        display: grid;
        place-items: center;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        background: var(--accent);
        color: var(--accent-ink);
        font: 500 10.5px/1 var(--font-mono);
      }
      .nav .badge[hidden] {
        display: none;
      }
      .nav .off {
        margin-left: auto;
        font: 400 10px/1 var(--font-mono);
        color: var(--ink-dim);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .side .who {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .side .who span:last-child {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .btn:disabled,
      .btn[disabled] {
        background: transparent;
        color: var(--ink-dim);
        border-color: var(--line);
        cursor: not-allowed;
      }
      .ws .sub {
        font: 400 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
        white-space: nowrap;
      }
      .mode {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 8px;
        margin: 0 0 8px;
        border: 1px dashed var(--line-strong);
        font: 400 10.5px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      .mode .led {
        background: var(--accent);
      }

      /* page */
      .pg {
        padding: 24px 28px 56px;
        max-width: 1180px;
        margin: 0 auto;
      }
      .pg.narrow {
        max-width: 860px;
      }
      .ph {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .ph .r {
        margin-left: auto;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pt {
        font: 500 22px/28px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .pt.lg {
        font-size: 30px;
        line-height: 36px;
      }
      .psub {
        margin-top: 6px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
        letter-spacing: 0.04em;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .small {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .grid2.even {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--bg);
        min-width: 0;
      }
      .ch {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 8px 0 12px;
        border-bottom: 1px solid var(--line);
      }
      .ch h2 {
        flex: 1;
        font: 500 13px/16px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .ch .cnt {
        font: 400 11px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .cb {
        padding: 12px;
      }
      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--ink-dim);
        background-image: var(--hatch);
        font: 400 11.5px/16px var(--font-mono);
      }
      .empty b {
        display: block;
        color: var(--ink-muted);
        font: 500 13px/18px var(--font-pixel);
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .src {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font: 400 10.5px/14px var(--font-mono);
        color: var(--ink-dim);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .src .px {
        width: 10px;
        height: 10px;
      }
      a.src {
        border-bottom: 1px dotted var(--line-strong);
      }
      a.src:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        min-width: 0;
      }
      .li:last-child {
        border-bottom: 0;
      }
      .li .tx {
        flex: 1;
        min-width: 0;
      }
      .li .tx b {
        display: block;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .li .tx .m {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 3px;
        font: 400 11px/14px var(--font-mono);
        color: var(--ink-dim);
      }
      .li .tx span > b {
        display: inline;
        white-space: normal;
        overflow: visible;
      }
      a.li:hover,
      button.li:hover {
        background: var(--bg-raised);
      }
      button.li {
        width: 100%;
        text-align: left;
      }
      .ico {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: none;
        border: 1px solid var(--line-strong);
        color: var(--ink);
      }
      .ico.acc {
        border-color: var(--accent);
        color: var(--accent);
      }
      .ico.warn {
        border-color: var(--warning);
        color: var(--warning);
      }
      .ico.bad {
        border-color: var(--danger);
        color: var(--danger);
      }
      .ico.ok {
        border-color: var(--success);
        color: var(--success);
      }
      .amt {
        font: 500 13px/16px var(--font-mono);
        white-space: nowrap;
      }
      .chip .sq {
        background: var(--c, var(--ink-dim));
      }
      .chip.sm {
        height: 20px;
        font-size: 11px;
      }
      .led.ok {
        background: var(--success);
      }
      .led.warn {
        background: var(--warning);
      }
      .led.bad {
        background: var(--danger);
      }
      .led.info {
        background: var(--info);
      }
      .led.acc {
        background: var(--accent);
      }
      .kv {
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr);
        gap: 8px 12px;
        font-size: 12.5px;
      }
      .kv dt {
        font: 400 11px/18px var(--font-mono);
        color: var(--ink-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .kv dd {
        margin: 0;
        line-height: 18px;
        min-width: 0;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 16px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs a,
      .tabs button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 10px;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
      }
      .tabs a:hover,
      .tabs button:hover {
        color: var(--ink);
      }
      .tabs [aria-current="page"],
      .tabs [aria-pressed="true"] {
        color: var(--ink);
        border-bottom-color: var(--accent);
      }

      /* hero */
      .hero {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px;
        border: 1px solid var(--line);
        margin-bottom: 16px;
        overflow: hidden;
        min-height: 120px;
      }
      .hero canvas {
        position: absolute;
        right: 0;
        top: 0;
        width: 42%;
        height: 100%;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .hero > *:not(canvas) {
        position: relative;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .blogo {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex: none;
        background: var(--accent);
        color: var(--accent-ink);
        font: 700 16px/1 var(--font-pixel);
      }
      .blogo .px {
        width: 22px;
        height: 22px;
      }
      .blogo.cl {
        background: var(--bg-sunk);
        color: var(--ink);
        border: 1px solid var(--line-strong);
      }
      .blogo.sm {
        width: 28px;
        height: 28px;
        font-size: 11px;
      }
      .blogo.sm .px {
        width: 14px;
        height: 14px;
      }
      .brand .x {
        font: 500 14px/1 var(--font-mono);
        color: var(--ink-dim);
      }

      /* what needs you */
      .todo {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .todo:last-child {
        border-bottom: 0;
      }
      .todo .tx {
        flex: 1;
        min-width: 0;
      }
      .todo .tx b {
        font-weight: 500;
      }
      .todo .tx p {
        margin-top: 3px;
        font: 400 11px/15px var(--font-mono);
        color: var(--ink-dim);
      }
      .todo.done {
        opacity: 0.55;
      }
      .todo.done .tx b {
        text-decoration: line-through;
      }

      /* progress, milestones */
      .prog {
        display: flex;
        gap: 2px;
        height: 8px;
      }
      .prog i {
        flex: 1;
        background: var(--line-strong);
      }
      .prog i.on {
        background: var(--accent);
      }
      .prog i.half {
        background: repeating-linear-gradient(90deg, var(--accent) 0 1px, transparent 1px 2px);
      }
      .ms {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border: 1px solid var(--line);
      }
      .ms > div {
        padding: 12px;
        border-right: 1px solid var(--line);
        min-width: 0;
      }
      .ms > div:last-child {
        border-right: 0;
      }
      .ms .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border: 1px solid var(--ink-dim);
        margin-right: 6px;
        vertical-align: 1px;
      }
      .ms .done .dot {
        background: var(--success);
        border-color: var(--success);
      }
      .ms .cur .dot {
        background: var(--accent);
        border-color: var(--accent);
      }
      .ms b {
        font: 500 12px/16px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .ms p {
        margin-top: 6px;
        font: 400 11px/14px var(--font-mono);
        color: var(--ink-dim);
      }
      .ms .cur {
        background-image: var(--hatch);
      }

      /* updates thread */
      .upd {
        display: flex;
        gap: 10px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .upd:last-child {
        border-bottom: 0;
      }
      .upd .bd {
        flex: 1;
        min-width: 0;
      }
      .upd .hd {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12.5px;
      }
      .upd .hd b {
        font-weight: 500;
      }
      .upd p {
        margin-top: 6px;
        line-height: 20px;
        white-space: pre-wrap;
        color: var(--ink);
      }
      .upd.reply {
        padding-left: 40px;
        background: var(--bg-sunk);
      }
      .av.cl {
        background: transparent;
        border-style: dashed;
      }
      .compose {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }
      .compose .r {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* forms */
      .fld {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .fld > span,
      .fld > label {
        font: 400 10.5px/14px var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      .in,
      .ta,
      .sel {
        width: 100%;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        font-size: 13px;
      }
      .ta {
        height: auto;
        min-height: 96px;
        padding: 8px;
        line-height: 19px;
        resize: vertical;
      }
      .in:focus,
      .ta:focus,
      .sel:focus {
        outline: none;
        border-color: var(--accent);
      }
      .in.m {
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .frow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }
      .chk {
        display: inline-flex;
        align-items: flex-start;
        gap: 8px;
        color: var(--ink-muted);
        cursor: pointer;
        text-align: left;
        line-height: 18px;
      }
      .chk .bx {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        flex: none;
        border: 1px solid var(--line-strong);
        margin-top: 1px;
      }
      .chk .bx .px {
        width: 12px;
        height: 12px;
        visibility: hidden;
      }
      .chk[aria-checked="true"] .bx {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .chk[aria-checked="true"] .bx .px {
        visibility: visible;
      }
      .tgl {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-muted);
        height: 24px;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .tgl:hover {
        color: var(--ink);
      }
      .tgl .sw {
        width: 28px;
        height: 14px;
        border: 1px solid var(--line-strong);
        position: relative;
        flex: none;
      }
      .tgl .sw::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 8px;
        height: 8px;
        background: var(--ink-dim);
        transition: left 0.12s;
      }
      .tgl[aria-checked="true"] .sw {
        border-color: var(--accent);
      }
      .tgl[aria-checked="true"] .sw::after {
        left: 16px;
        background: var(--accent);
      }
      .tgl[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* tables */
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .tbl th {
        height: 32px;
        padding: 0 12px;
        text-align: left;
        font: 400 10.5px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .tbl td {
        height: 44px;
        padding: 4px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      .tbl tr:last-child td {
        border-bottom: 0;
      }
      .tbl tr.row {
        cursor: pointer;
      }
      .tbl tr.row:hover td {
        background: var(--bg-raised);
      }
      .tbl .num {
        text-align: right;
      }
      .tbl .nm {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .tbl .nm b {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tbl .acts {
        display: flex;
        gap: 2px;
        justify-content: flex-end;
      }
      .ft {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        flex: none;
        border: 1px solid var(--line-strong);
        font: 500 8.5px/1 var(--font-mono);
        color: var(--ink-muted);
        text-transform: uppercase;
      }
      .ft.pdf {
        color: var(--danger);
      }
      .ft.xlsx {
        color: var(--success);
      }
      .ft.docx {
        color: var(--info);
      }
      .ft.png,
      .ft.jpg {
        color: var(--warning);
      }
      .bar-up {
        height: 2px;
        background: var(--line);
        margin-top: 4px;
        width: 120px;
      }
      .bar-up i {
        display: block;
        height: 2px;
        background: var(--accent);
        transition: width 0.2s;
      }
      .drop {
        border: 1px dashed var(--line-strong);
        padding: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--ink-muted);
        background-image: var(--hatch);
      }
      .drop > * {
        background: var(--bg);
      }
      .drop.over {
        border-color: var(--accent);
        color: var(--ink);
      }

      /* paper: invoice, quote, contract */
      .paper {
        background: var(--bg-sunk);
        border: 1px solid var(--line);
        padding: 28px 32px;
        font-size: 12.5px;
        line-height: 19px;
      }
      .paper .pt {
        font-size: 18px;
      }
      .paper table {
        width: 100%;
        border-collapse: collapse;
        margin: 18px 0;
      }
      .paper th {
        text-align: left;
        font: 400 10px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        padding: 8px 6px;
        border-bottom: 1px solid var(--line-strong);
      }
      .paper td {
        padding: 8px 6px;
        border-bottom: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .paper td:first-child {
        font-family: var(--font-sans);
        font-size: 12.5px;
      }
      .paper .tot {
        margin-left: auto;
        width: 260px;
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .paper .tot div {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
      }
      .paper .tot .g {
        border-top: 1px solid var(--ink);
        margin-top: 4px;
        padding-top: 8px;
        font-weight: 500;
        font-size: 13px;
      }
      .paper .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      .paper .l {
        font: 400 10px/14px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
        display: block;
        margin-bottom: 4px;
      }
      .paper h3 {
        font: 500 12px/16px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 18px 0 6px;
      }
      .paper p + p {
        margin-top: 8px;
      }
      .stamp {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--success);
        color: var(--success);
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .sig-line {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .sig-box {
        border: 1px dashed var(--line-strong);
        height: 76px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .sig-box.signed {
        border-style: solid;
        border-color: var(--success);
      }
      .sig-box .sg {
        font: 500 20px/1 var(--font-pixel);
        color: var(--ink);
      }
      .sig-box canvas {
        width: 100%;
        height: 44px;
        image-rendering: pixelated;
      }
      .notice {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--line-strong);
        border-left: 2px solid var(--warning);
        background: var(--bg-raised);
        font-size: 12.5px;
        line-height: 18px;
      }
      .notice .led {
        margin-top: 6px;
        background: var(--warning);
      }
      .notice.info {
        border-left-color: var(--info);
      }
      .notice.info .led {
        background: var(--info);
      }
      .notice.ok {
        border-left-color: var(--success);
      }
      .notice.ok .led {
        background: var(--success);
      }
      .notice .acts {
        margin-left: auto;
        display: flex;
        gap: 6px;
        flex: none;
      }
      .notice a {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .notice .acts a {
        text-decoration: none;
      }
      .copyrow {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 4px 0 10px;
        border: 1px solid var(--line);
        background: var(--bg-sunk);
        font: 400 12px/1 var(--font-mono);
      }
      .copyrow span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copyrow .k {
        flex: none;
        width: 70px;
        color: var(--ink-dim);
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* sign pad */
      .pad {
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        height: 120px;
        position: relative;
        cursor: crosshair;
        touch-action: none;
      }
      .pad canvas {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        display: block;
      }
      .pad .hint {
        position: absolute;
        left: 10px;
        bottom: 8px;
        font: 400 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
        pointer-events: none;
      }
      .typed {
        height: 120px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        font: 500 28px/1 var(--font-pixel);
        color: var(--ink);
      }
      .steps {
        display: flex;
        gap: 2px;
        margin-bottom: 14px;
      }
      .steps span {
        flex: 1;
        height: 26px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        border: 1px solid var(--line);
        font: 400 10.5px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      .steps span.on {
        border-color: var(--accent);
        color: var(--ink);
      }
      .steps span.ok {
        color: var(--success);
      }

      /* conversation */
      .msg {
        display: flex;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .msg .bd {
        flex: 1;
        min-width: 0;
      }
      .msg .hd {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .msg .hd b {
        font-weight: 500;
      }
      .msg p {
        margin-top: 6px;
        white-space: pre-wrap;
        line-height: 20px;
      }
      .msg.us {
        background: var(--bg-sunk);
      }
      .att {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        margin-top: 8px;
        border: 1px solid var(--line-strong);
        font: 400 11px/1 var(--font-mono);
        color: var(--ink-muted);
      }
      .att:hover {
        color: var(--ink);
        border-color: var(--ink-muted);
      }
      .kbres {
        margin-top: 6px;
        border: 1px solid var(--line);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
      }
      .search input {
        flex: 1;
        background: none;
        border: 0;
        outline: none;
        font-size: 14px;
      }
      .search .px {
        color: var(--ink-dim);
      }
      .article h2 {
        font: 500 14px/18px var(--font-pixel);
        text-transform: uppercase;
        margin: 16px 0 6px;
      }
      .article p {
        line-height: 21px;
        margin-top: 8px;
      }
      .article code {
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 1px 4px;
        border: 1px solid var(--line-strong);
      }

      /* bookings */
      .bk {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .bkc {
        border: 1px solid var(--line);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: left;
        width: 100%;
      }
      .bkc h3 {
        font: 500 14px/18px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .bkc p {
        color: var(--ink-muted);
        line-height: 19px;
      }
      .bkc .m {
        font: 400 11px/14px var(--font-mono);
        color: var(--ink-dim);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 2px;
      }
      .days button {
        height: 52px;
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font: 400 11px/1 var(--font-mono);
        color: var(--ink-muted);
      }
      .days button b {
        font: 500 14px/1 var(--font-mono);
        color: var(--ink);
      }
      .days button[disabled] {
        background-image: var(--hatch);
        color: var(--ink-dim);
        cursor: default;
      }
      .days button[disabled] b {
        color: var(--ink-dim);
      }
      .days button[aria-pressed="true"] {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .days button:not([disabled]):hover {
        border-color: var(--ink-muted);
      }
      .slots {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        gap: 6px;
      }
      .slots button {
        height: 32px;
        border: 1px solid var(--line-strong);
        font: 400 12px/1 var(--font-mono);
      }
      .slots button:hover {
        border-color: var(--ink);
      }
      .slots button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }

      /* stock */
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border: 1px solid var(--line);
        margin-bottom: 16px;
      }
      .kpi {
        padding: 14px;
        border-right: 1px solid var(--line);
        min-width: 0;
      }
      .kpi:last-child {
        border-right: 0;
      }
      .kpi .v {
        font: 500 26px/30px var(--font-pixel);
        margin-top: 6px;
      }
      .kpi .v small {
        font: 400 12px/1 var(--font-mono);
        color: var(--ink-dim);
        margin-left: 4px;
      }
      .kpi .d {
        font: 400 11px/14px var(--font-mono);
        color: var(--ink-dim);
        margin-top: 4px;
      }
      .chart {
        padding: 14px 12px 8px;
      }
      .chart svg {
        display: block;
        width: 100%;
        height: 140px;
        shape-rendering: crispEdges;
        color: var(--ink-muted);
      }
      .chart .ax {
        display: grid;
        font: 400 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
        margin-top: 6px;
        text-align: center;
      }
      .legend {
        display: flex;
        gap: 14px;
        font: 400 11px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .legend i {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        vertical-align: 0;
      }

      /* admin */
      .srcrow {
        display: grid;
        grid-template-columns: 30px minmax(0, 1.1fr) minmax(0, 1.4fr) 110px 92px 28px;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      .srcrow:last-child {
        border-bottom: 0;
      }
      .srcrow b {
        font-weight: 500;
      }
      .srcrow .s {
        font: 400 11px/14px var(--font-mono);
        color: var(--ink-dim);
        margin-top: 2px;
      }
      .srcrow.off > *:not(.keep) {
        opacity: 0.45;
      }
      .setrow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .setrow:last-child {
        border-bottom: 0;
      }
      .setrow b {
        font-weight: 500;
        display: block;
      }
      .setrow p {
        margin-top: 3px;
        color: var(--ink-dim);
        font: 400 11px/15px var(--font-mono);
      }
      .logos {
        display: flex;
        gap: 8px;
      }
      .logos button {
        padding: 6px;
        border: 1px solid var(--line);
      }
      .logos button[aria-pressed="true"] {
        border-color: var(--accent);
      }
      .pvcard {
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        padding: 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }
      .pvcard .pt {
        font-size: 16px;
        line-height: 20px;
      }
      .pvbar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 34px;
        padding: 0 8px 0 14px;
        background: color-mix(in srgb, var(--accent) 14%, var(--bg));
        border-bottom: 1px solid var(--accent);
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.04em;
        flex: none;
      }
      .pvbar .led {
        background: var(--accent);
      }
      .pvbar .btn {
        margin-left: auto;
        height: 24px;
      }
      .who-f {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .logrow {
        display: grid;
        grid-template-columns: 118px 22px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 12.5px;
      }
      .logrow:last-child {
        border-bottom: 0;
      }
      .logrow .t {
        font: 400 11px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .logrow.new {
        animation: flash 1.6s;
      }
      @keyframes flash {
        from {
          background: color-mix(in srgb, var(--accent) 18%, transparent);
        }
        to {
          background: transparent;
        }
      }

      /* sign-in */
      .signin {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 24px;
        background-image: var(--hatch);
      }
      .signin .box {
        width: 100%;
        max-width: 380px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .signin .or {
        display: flex;
        align-items: center;
        gap: 8px;
        font: 400 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .signin .or::before,
      .signin .or::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--line);
      }
      .signin .pow {
        font: 400 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
        text-align: center;
      }

      /* overlays */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: color-mix(in srgb, var(--bg) 70%, transparent);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 10vh 16px 16px;
        overflow: auto;
      }
      .scrim.open {
        display: flex;
      }
      .modal {
        width: 100%;
        max-width: 520px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
      }
      .modal.wide {
        max-width: 680px;
      }
      .modal .mh {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .modal .mh b {
        font: 500 13px/16px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .modal .mh .icon-btn {
        margin-left: auto;
      }
      .modal .mb {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .modal .mb p {
        color: var(--ink-muted);
        line-height: 20px;
      }
      .modal .mf {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 10px 16px;
        border-top: 1px solid var(--line);
      }
      .modal .mf .sp {
        margin-right: auto;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 44px;
        z-index: 90;
        transform: translate(-50%, 8px);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px 8px 12px;
        background: var(--ink);
        color: var(--bg);
        font-size: 12.5px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.15s,
          transform 0.15s;
        max-width: calc(100vw - 32px);
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      .toast a {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: underline;
        text-underline-offset: 3px;
        white-space: nowrap;
      }
      .spin {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 1px solid currentColor;
        border-right-color: transparent;
        animation: sp 0.7s steps(8) infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .hide {
        display: none !important;
      }

      @media (max-width: 1080px) {
        .grid2,
        .grid2.even {
          grid-template-columns: minmax(0, 1fr);
        }
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .kpi:nth-child(2) {
          border-right: 0;
        }
        .kpi:nth-child(-n + 2) {
          border-bottom: 1px solid var(--line);
        }
        .srcrow {
          grid-template-columns: 30px minmax(0, 1fr) 92px 28px;
        }
        .srcrow .hm {
          display: none;
        }
      }
      @media (max-width: 860px) {
        .pg {
          padding: 16px 16px 48px;
        }
        .pt.lg {
          font-size: 22px;
          line-height: 28px;
        }
        .hero canvas {
          display: none;
        }
        .ms {
          grid-template-columns: minmax(0, 1fr);
        }
        .ms > div {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .bk {
          grid-template-columns: minmax(0, 1fr);
        }
        .frow {
          grid-template-columns: minmax(0, 1fr);
        }
        .tbl .hm {
          display: none;
        }
        .head .acts .hm {
          display: none;
        }
        .kv {
          grid-template-columns: 110px minmax(0, 1fr);
        }
        .logrow {
          grid-template-columns: 70px 18px minmax(0, 1fr);
        }
        .logrow > :last-child {
          display: none;
        }
        .paper {
          padding: 18px;
        }
        .paper .two,
        .sig-line {
          grid-template-columns: minmax(0, 1fr);
        }
        .notice {
          flex-wrap: wrap;
        }
        .notice .acts {
          margin-left: 0;
        }
      }
      .app.collapsed {
        grid-template-columns: 0 minmax(0, 1fr);
      }
      .app.collapsed .side {
        display: none;
      }
      .app.collapsed .mainwrap {
        padding-left: 8px;
      }
      .app.collapsed .menu {
        display: inline-grid !important;
      }
      @media (max-width: 860px) {
        .app.collapsed .side {
          display: flex;
        }
        .app.collapsed .mainwrap {
          padding-left: 0;
        }
      }
      @media (max-width: 600px) {
        .card {
          overflow-x: auto;
        }
        .card > .ch {
          position: sticky;
          left: 0;
        }
        .seg {
          max-width: 100%;
          overflow-x: auto;
        }
        .seg > button {
          flex: none;
        }
        .tbl .num .small {
          display: none;
        }
        .tbl td.mono {
          white-space: nowrap;
        }
        .notice > span:not(.led):not(.acts) {
          flex: 1;
          min-width: 0;
        }
        .notice .acts {
          flex-basis: 100%;
        }
        .foot .hm-f,
        .foot .hm-f + span {
          display: none;
        }
        .todo {
          flex-wrap: wrap;
        }
        .todo .tx {
          flex: 1 1 200px;
        }
        .todo > .btn,
        .todo > .chip {
          margin-left: auto;
        }
        .hero {
          flex-wrap: wrap;
        }
      }

      // ------------------------------------------------------------ charts: pixels on or off
      function pxBars(groups, { h = 60, bw = 6, gap = 2, ggap = 6, min = 0 } = {}) {
        const all = groups.flat().map((b) => b.v || 0);
        const max = Math.max(1, ...all) - min;
        let x = 0;
        const P = { solid: "", step: "", dith: "", plan: "" };
        groups.forEach((g) => {
          g.forEach((b) => {
            const v = Math.max(0, (b.v || 0) - min);
            const bh = b.v ? Math.max(1, Math.round((v / max) * (h - 2))) : 0;
            for (let y = h - bh; y < h; y++) {
              let run = -1;
              for (let i = 0; i <= bw; i++) {
                const X = x + i;
                let ok = i < bw;
                if (ok && b.k === "step" && y % 2) ok = false;
                if (ok && b.k === "dith" && bayer(X, y) > 0.55) ok = false;
                if (ok && b.k === "plan" && bayer(X, y) > 0.2) ok = false;
                if (ok && run < 0) run = X;
                if (!ok && run >= 0) {
                  P[b.k] += `M${run} ${y}h${X - run}v1h-${X - run}z`;
                  run = -1;
                }
              }
            }
            x += bw + gap;
          });
          x += ggap;
        });
        const W = x - ggap - gap;
        return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true"><path fill="var(--accent)" d="${P.solid}"/><path fill="var(--ink-muted)" d="${P.step}"/><path fill="var(--ink-muted)" d="${P.dith}"/><path fill="var(--ink-dim)" d="${P.plan}"/></svg>`;

      function slotsFor(b, d) {

        const u = USERS.find((x) => x.e === e) || CUSERS.find((x) => x.e === e);
        u.st = "revoked";
        toast(`Access revoked for ${esc(u.n)}`);
        route();
      };
      ACT.logWho = (b) => {
        S.logF.who = b.dataset.k;
        route();
      };
      ACT.logCsv = () => toast("portal-activity-lyon-logistique.csv downloaded");

      // ------------------------------------------------------------ router
      function curPath() {
        return (location.hash.replace(/^#\/?/, "") || "home").split("?")[0];
      }
      function route() {
        const path = curPath();
        const parts = path.split("/").map((p) => {
          try {
            return decodeURIComponent(p);
          } catch (e) {
            return p;
          }
        });
        S.admin = parts[0] === "admin";
        if (S.admin) S.preview = false;
        if (!S.admin && !S.signedIn && parts[0] !== "signin") {
          location.replace("#/signin");
          return;
        }
        if (parts[0] === "signin" && S.signedIn && !S.sent) {
          S.signedIn = false;
        }
        const panel = $("#panel");
        const keep =
          panel.dataset.path === path
            ? [...panel.querySelectorAll(".body")].map((e) => e.scrollTop)
            : null;
        $("#app").classList.toggle("out", parts[0] === "signin");
        let html,
          nav = parts[0];
        if (S.admin) {
          const k = parts[1] || "";
          nav = k ? "admin/" + k : "admin";
          html =
            k === "visibility"
              ? aVisibility()
              : k === "branding"
                ? aBranding()
                : k === "access"
                  ? aAccess()
                  : k === "activity"
                    ? aActivity()
                    : aSources();
        } else if (parts[0] === "signin") html = signin();
        else if (SEC[parts[0]] && !on(SEC[parts[0]])) html = offPage(parts[0]);
        else
          switch (parts[0]) {
            case "home":
              html = home();
              break;
            case "projects":
              html = projects();
              break;
            case "documents":
              html = documents();
              break;
            case "invoices":
              html = parts[1] ? invoicePage(parts[1]) : invoices();
              break;
            case "contracts":
              html = parts[2] === "sign" ? signPage(parts[1]) : contracts();
              break;
            case "support":
              nav = parts[1] === "kb" ? "kb" : "support";
              html =
                parts[1] === "kb"
                  ? kbPage(parts[2])
                  : parts[1] === "new"
                    ? newRequest()
                    : parts[1]
                      ? ticketPage(parts[1])
                      : support();
              break;
            case "bookings":
              html = parts[1] ? bookPage(parts[1]) : bookings();
              break;
            case "stock":
              html = stock();
              break;
            case "team":
              html = team();
              break;
            case "notifications":
              html = notifications();
              break;
            case "profile":
              html = profile();
              break;
            default:
              html = notFound("This page does not exist.");
          }
        panel.innerHTML = html;
        panel.dataset.path = path;
        if (keep)
          panel.querySelectorAll(".body").forEach((e, i) => {
            if (keep[i]) e.scrollTop = keep[i];
          });
        renderSide(nav);
        bind();
        $("#app").classList.remove("drawer");
        LOG.forEach((l) => {
          if (S.admin) l.fresh = false;
        });
      }
      function bind() {
        const cv = $("#heroCv");
        if (cv) greyDither(cv, 3);
        const dz = $("#drop");
        if (dz) {
          dz.ondragover = (e) => {
            e.preventDefault();
            dz.classList.add("over");
          };
          dz.ondragleave = () => dz.classList.remove("over");
          dz.ondrop = (e) => {
            e.preventDefault();
            dz.classList.remove("over");
            if (e.dataTransfer.files.length) addUploads(e.dataTransfer.files);
          };
          dz.onclick = () => ACT.upload({ dataset: {} });
          dz.style.cursor = "pointer";
        }
        const kq = $("#kbQ");
        if (kq)
          kq.oninput = () => {
            S.kbQ = kq.value;
            const q = S.kbQ.toLowerCase();
            $("#kbList").innerHTML = kbList(
              ARTS.filter((a) => !q || (a.t + " " + a.h).toLowerCase().includes(q)),
              [...new Set(ARTS.map((a) => a.c))],
            );
          };
        const ns = $("#nrS");
        if (ns)
          ns.oninput = () => {
            S.newReq.s = ns.value;
            const s = ns.value.toLowerCase();
            $("#nrSug").innerHTML = sugBox(
              s.trim().length > 2
                ? ARTS.filter((a) =>
                    s
                      .split(/\s+/)
                      .some((w) => w.length > 3 && (a.t + " " + a.h).toLowerCase().includes(w)),
                  ).slice(0, 3)
                : [],
            );
          };
        const nb = $("#nrB");
        if (nb)
          nb.oninput = () => {
            S.newReq.b = nb.value;
          };
        const nc = $("#nrC");
        if (nc)
          nc.onchange = () => {
            S.newReq.cat = nc.value;
          };
        const sn = $("#sgName");
        if (sn)
          sn.oninput = () => {
            S.sign.name = sn.value;
            $("#sgTyped").textContent = sn.value || " ";
          };
        const pad = $("#padCv");
        if (pad) initPad(pad);
        $$("select[data-role]").forEach(
          (s) =>
            (s.onchange = () => {
              const u = USERS.find((x) => x.id === s.dataset.role);
              u.role = s.value;
              toast(`${esc(u.n)} is now ${s.value}`);
              log("act", "user-circle", `made <b>${esc(u.n)}</b> ${s.value}`, null);
            }),
        );
        $$("[data-set]").forEach((el) => {
          el.oninput = el.onchange = () => {
            S[el.dataset.set] = el.value;
            if (el.tagName === "SELECT") {
              toast("Saved");
              return;
            }
            const pv = $(".pvcard");
            if (pv) {
              clearTimeout(bind.t);
              bind.t = setTimeout(() => {
                const pos = el.selectionStart,
                  k = el.dataset.set;
                route();
                const n = $(`[data-set="${k}"]`);
                if (n) {
                  n.focus();
                  try {
                    n.setSelectionRange(pos, pos);
                  } catch (e) {}
                }
              }, 500);
            }
          };
        });
        $$("select[data-share]").forEach(
          (s) =>
            (s.onchange = () => {
              if (s.dataset.share === "folder") {
                SHARE.folder = s.value;
                toast(`Documents now shows ${esc(s.value)}`);
              } else toast("Saved");
            }),
        );
        const lk = $("[data-logkind]");
        if (lk)
          lk.onchange = () => {
            S.logF.kind = lk.value;
            route();
          };
      }
      // The landing's field dither, in greys: orange stays on the logo tile alone.
      function greyDither(canvas, seed) {
        const cs = getComputedStyle(document.documentElement),
          fg = cs.getPropertyValue("--line-strong").trim(),
          bg = cs.getPropertyValue("--bg-sunk").trim();
        const w = (canvas.width = Math.ceil(canvas.clientWidth / 4)),
          h = (canvas.height = Math.ceil(canvas.clientHeight / 4));
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = fg;
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const v =
              0.5 +
              0.5 * Math.sin((x / w) * Math.PI * (1.2 + seed * 0.3) + seed) * (1 - y / h) -
              0.35 +
              (y / h) * 0.15 * Math.cos(x / 9 + seed);
            if (v > bayer(x, y)) ctx.fillRect(x, y, 1, 1);
          }
      }
      function initPad(c) {
        const ctx = c.getContext("2d");
        let down = false,
          last = null;
        if (S.sign.drawn && S.sign.img) {
          const im = new Image();
          im.onload = () => ctx.drawImage(im, 0, 0);
          im.src = S.sign.img;
        }
        const col = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
        const pt = (e) => {
          const r = c.getBoundingClientRect();
          return [
            Math.floor(((e.clientX - r.left) / r.width) * c.width),
            Math.floor(((e.clientY - r.top) / r.height) * c.height),
          ];
        };
        const dot = (x, y) => {
          ctx.fillStyle = col;
          ctx.fillRect(x, y, 2, 2);
        };
        c.onpointerdown = (e) => {
          down = true;
          c.setPointerCapture(e.pointerId);
          last = pt(e);
          dot(...last);
          S.sign.drawn = true;
          c.parentElement.querySelector(".hint").style.display = "none";
        };
        c.onpointermove = (e) => {
          if (!down) return;
          const p = pt(e);
          const n = Math.max(Math.abs(p[0] - last[0]), Math.abs(p[1] - last[1]), 1);
          for (let i = 0; i <= n; i++)
            dot(
              Math.round(last[0] + ((p[0] - last[0]) * i) / n),
              Math.round(last[1] + ((p[1] - last[1]) * i) / n),
            );
          last = p;
        };
        c.onpointerup = () => {
          down = false;
          S.sign.img = c.toDataURL();
        };
      }

      // ------------------------------------------------------------ wiring
      addEventListener("hashchange", () => {
        closeModal();
        route();
      });
      const wsBtn = $("#wsBtn"),
        wsPop = $("#wsPop");
      wsBtn.onclick = (e) => {
        e.stopPropagation();
        const r = wsBtn.getBoundingClientRect();
        wsPop.style.left = r.left + "px";
        wsPop.style.top = r.bottom + 4 + "px";
        wsPop.classList.toggle("open");
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#wsPop")) wsPop.classList.remove("open");
        const a = e.target.closest("[data-act]");
        if (a && ACT[a.dataset.act] && !a.disabled) {
          e.preventDefault();
          e.stopPropagation();
          ACT[a.dataset.act](a, e);
          return;
        }
        const h = e.target.closest("[data-href]");
        if (h && !e.target.closest("a,button")) {
          location.hash = h.dataset.href;
          return;
        }
        if (!e.target.closest(".side,[data-act=menu]")) $("#app").classList.remove("drawer");
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (mScrim.classList.contains("open")) {
            closeModal();
            return;
          }
          if (pop.classList.contains("open")) {
            closePop();
            return;
          }
          wsPop.classList.remove("open");
          $("#app").classList.remove("drawer");
        }
      });
      function toggleTheme() {
        const r = document.documentElement;
        r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
        store.set("theme", r.dataset.theme);
        route();
      }
      document.querySelector("[data-theme-toggle]").onclick = () => {
        toggleTheme();
        wsPop.classList.remove("open");
      };
      {
        const t = store.get("theme", null);
        if (t) document.documentElement.dataset.theme = t;
      }
      route();
    </script>
  </body>
</html>
