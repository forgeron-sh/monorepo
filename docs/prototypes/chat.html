      // ------------------------------------------------------------ rich text
      const REACTS = [
        "thumbs-up",
        "heart",
        "fire",
        "tick-01",
        "eye",
        "rocket-01",
        "smile",
        "star",
        "sparkles",
        "bulb",
        "trophy",
        "award-01",
        "coffee-01",
        "hammer",
        "anvil",
        "wrench-01",
        "flag-01",
        "pin",
        "bolt",
        "checkmark-circle-01",
        "alert-circle",
        "help-circle",
        "thumbs-down",
        "sad-01",
        "hourglass",
        "truck",
        "bug-01",
        "money-01",
        "gift",
        "crown",
        "target-01",
        "shield-01",
        "clock-01",
        "calendar-03",
        "bookmark-01",
        "heart-check",
        "flower",
        "sun-01",
        "moon-02",
        "snow",
        "leaf-01",
        "mountain",
        "music-note-01",
        "game-controller-01",
        "diamond",
        "bell",
      ].filter((n) => ICONS[n]);
      const QUICK = ["thumbs-up", "heart", "fire", "tick-01"];
      function fmtText(s) {
        if (!s) return "";
        const keep = [];
        const K = (h) => {
          keep.push(h);
          return `\u0001${keep.length - 1}\u0002`;
        };
        s = esc(s);
        s = s.replace(/```\n?([\s\S]*?)```/g, (_, c) => K(`<pre class="cb">${c}</pre>`));
        s = s.replace(/`([^`\n]+)`/g, (_, c) => K(`<code>${c}</code>`));
        s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) =>
          K(`<a class="lnk" href="${u}">${t}</a>`),
        );
        s = s.replace(
          /(^|[\s(])((?:https?:\/\/|(?:crm|tasks|invoices|notes|helpdesk|drive|console-home|timeoff|dashboard|datahub)\.html)[^\s<)]*)/g,
          (_, p, u) => p + K(`<a class="lnk" href="${u}">${u.replace(/^https?:\/\//, "")}</a>`),
        );
        s = s.replace(/@\{([A-Z]{2})\}/g, (_, id) =>
          P[id]
            ? K(
                `<button class="men${id === ME ? " me" : ""}" data-person="${id}">@${P[id].n}</button>`,
              )
            : "@" + id,
        );
        s = s.replace(/@(here|channel)\b/g, (_, w) => K(`<span class="men me">@${w}</span>`));
        s = s.replace(/#\{([a-z0-9-]+)\}/g, (_, id) => {
          const c = chById(id);
          return c ? K(`<a class="men" href="#/c/${id}">#${c.name}</a>`) : "#" + id;
        });
        s = s.replace(/:([a-z0-9-]+):/g, (m, n) =>
          ICONS[n] ? K(`<span class="ico" title="${n}">${px(n)}</span>`) : m,
        );
        s = s
          .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
          .replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<i>$2</i>")
          .replace(/~~([^~\n]+)~~/g, "<s>$1</s>");
        const out = [];
        let list = null;
        const close = () => {
          if (list) {
            out.push(`<${list.t}>${list.items.map((i) => `<li>${i}</li>`).join("")}</${list.t}>`);
            list = null;
          }
        };
        s.split("\n").forEach((l) => {
          let mm;
          if ((mm = l.match(/^\s*[-•] (.*)/))) {
            if (!list || list.t !== "ul") {
              close();
              list = { t: "ul", items: [] };
            }
            list.items.push(mm[1]);
          } else if ((mm = l.match(/^\s*\d+\. (.*)/))) {
            if (!list || list.t !== "ol") {
              close();
              list = { t: "ol", items: [] };
            }
            list.items.push(mm[1]);
          } else if ((mm = l.match(/^&gt; ?(.*)/))) {
            close();
            out.push(`<blockquote>${mm[1]}</blockquote>`);
          } else {
            close();
            out.push(l + "<br>");
          }
        });
        close();
        let h = out.join("").replace(/(<br>)+$/, "");
        for (let k = 0; k < 3; k++) h = h.replace(/\u0001(\d+)\u0002/g, (_, i) => keep[i]);
        return h;
      }
      const plain = (s) =>
        (s || "")
          .replace(/@\{([A-Z]{2})\}/g, (_, id) => "@" + (P[id] ? P[id].n : id))
          .replace(/#\{([a-z0-9-]+)\}/g, "#$1")
          .replace(/[*`~]/g, "");
      function encode(s) {
        Object.keys(P)
          .sort((a, b) => P[b].n.length - P[a].n.length)
          .forEach((id) => {
            s = s.split("@" + P[id].n).join(`@{${id}}`);
          });
        return s.replace(/(^|[\s(])#([a-z0-9-]+)/g, (m, p, n) =>
          chById(n) && !chById(n).dm ? `${p}#{${n}}` : m,
        );
      }
      const decode = (s) =>
        s
          .replace(/@\{([A-Z]{2})\}/g, (_, id) => "@" + P[id].n)
          .replace(/#\{([a-z0-9-]+)\}/g, "#$1");
      const mentionsMe = (m) => /@\{CR\}|@here|@channel/.test(m.text || "");

      // ------------------------------------------------------------ state
      let S = {
        ch: "lyon-depot",
        topic: {},
        right: null, // right: {k:"thread",id} | {k:"details",tab}
        draft: {},
        ctopic: {},
        editing: null,
        pending: [],
        hl: null,
        divider: {},
        fold: pref.get("fold", {}),
        typing: {},
        huddle: null,
        eph: {},
        opsSeq: 43,
        browse: { q: "", team: "all" },
        notifPaused: false,
      };

      // ------------------------------------------------------------ unread
      const chMsgs = (id) => MS.filter((m) => m.ch === id);
      function unread(c) {
        return chMsgs(c.id).filter((m) => m.id > c.read && m.who !== ME && !m.sys).length;
      }
      function mentionsN(c) {
        return (
          chMsgs(c.id).filter((m) => m.id > c.read && m.who !== ME && mentionsMe(m)).length +
          (c.dm ? unread(c) : 0)
        );
      }

      // ------------------------------------------------------------ sidebar
      function sideItem(c) {
        const u = unread(c),
          mn = mentionsN(c),
          cur = S.view === "c" && S.ch === c.id;
        const cls = `it${u && !c.muted ? " unr" : ""}${c.muted ? " muted" : ""}`;
        let ic;
        if (c.dm) {
          const o = others(c);
          ic = o.length === 1 ? pav(o[0]) : `<span class="gav">${o.length + 1}</span>`;
        } else ic = `<span data-i="${chIcon(c)}">${px(chIcon(c))}</span>`;
        const badge = mn && !c.muted ? `<span class="badge">${mn}</span>` : "";
        const st =
          c.dm && others(c).length === 1 && P[others(c)[0]].p === "dnd"
            ? `<span class="dim" style="margin-left:auto">${px("notification-off-01")}</span>`
            : "";
        return `<a class="${cls}" href="#/c/${c.id}" aria-current="${cur ? "page" : "false"}" data-ch="${c.id}">${ic}<span class="lbl">${esc(chTitle(c))}</span>${badge || st}</a>`;
      }
      function section(key, title, items, add) {
        const open = !S.fold[key];
        const vis = open
          ? items
          : items.filter((c) => (S.view === "c" && S.ch === c.id) || (unread(c) && !c.muted));
        return `<div class="nav-sec"><button class="nav-h" aria-expanded="${open}" data-fold="${key}">${title}${add ? `<span class="add" data-add="${add}" title="${add === "dm" ? "New message" : "Add a channel"}">${px("plus-sign")}</span>` : ""}<span class="car">${px("arrow-down-01")}</span></button><div>${vis.map(sideItem).join("")}</div></div>`;
      }
      function renderSide() {
        const j = CH.filter(joined);
        const thrN = MS.filter((m) => m.replies.some((r) => r.unread)).length;
        const menN = CH.filter(joined).reduce(
          (a, c) =>
            a + chMsgs(c.id).filter((m) => m.id > c.read && m.who !== ME && mentionsMe(m)).length,
          0,
        );
        let h = `<a class="it" href="#/threads" aria-current="${S.view === "threads"}" data-v="threads">${px("message-01")}<span class="lbl">Threads</span>${thrN ? `<span class="badge">${thrN}</span>` : ""}</a>
    <a class="it" href="#/mentions" aria-current="${S.view === "mentions"}">${px("notification-01")}<span class="lbl">Mentions</span>${menN ? `<span class="badge">${menN}</span>` : ""}</a>
    <a class="it" href="#/saved" aria-current="${S.view === "saved"}">${px("bookmark-01")}<span class="lbl">Saved</span></a>
    <a class="it" href="#/browse" aria-current="${S.view === "browse"}">${px("hashtag")}<span class="lbl">Browse channels</span></a>`;
        const st = j.filter((c) => c.starred);
        if (st.length) h += section("starred", "Starred", st);
        h += section(
          "ws",
          "Workspace",
          j.filter((c) => !c.team && !c.dm && !c.starred),
          "ch:",
        );
        TEAMS.forEach((t) => {
          const list = j.filter((c) => c.team === t && !c.starred);
          if (list.length) h += section("t-" + t, t, list, "ch:" + t);
        });
        h += section(
          "dm",
          "Direct messages",
          j.filter((c) => c.dm && !c.starred),
          "dm",
        );
        $("#sideNav").innerHTML = h;
        const me = P[ME];
        $("#meAv").innerHTML = pav(ME).replace(/^<span class="pav">|<\/span>$/g, "");
        $("#meSt").textContent = S.notifPaused ? "Notifications paused" : me.s || PRES[me.p][0];
      }
      $("#sideNav").addEventListener("click", (e) => {
        const add = e.target.closest("[data-add]");
        if (add) {
          e.preventDefault();
          e.stopPropagation();
          const a = add.dataset.add;
          if (a === "dm") openNewDm(add);
          else openCreate(a.slice(3) || null);
          return;
        }
        const f = e.target.closest("[data-fold]");
        if (f) {
          S.fold[f.dataset.fold] = !S.fold[f.dataset.fold];
          pref.set("fold", S.fold);
          renderSide();
        }
      });

      // ------------------------------------------------------------ message rendering
      function fileCard(f) {
        if (f.kind === "img")
          return `<a class="imgc" href="${f.href}" title="Open in Drive"><canvas data-dither="${f.name.length}"></canvas><span class="cap">${px("image-01")}${esc(f.name)}<span style="margin-left:auto">${f.size}</span></span></a>`;
        return `<a class="card tk-hover" href="${f.href}" title="Open in Drive"><span class="ft ${f.kind}">${f.kind}</span><span style="min-width:0"><span class="ti" style="display:block">${esc(f.name)}</span><span class="su" style="display:block">${f.size} · Drive / ${esc(f.folder)}</span></span><span class="go">${px("arrow-up-right-01")}</span></a>`;
      }
      function unfurls(text) {
        const urls = [
          ...new Set(
            (text || "").match(/(?:crm|tasks|invoices|notes|console-home)\.html#\/[^\s)]+/g) || [],
          ),
        ];
        return urls
          .map((u) => {
            const x = UNF[u];
            if (!x) return "";
            return `<a class="unf tk-hover" href="${u}"><span class="ah"><span class="bav">${px(x.i)}</span>${x.app}<span class="go">${px("arrow-up-right-01")}</span></span><div class="tt">${esc(x.title)}</div><div class="ds">${esc(x.ds)}</div>${x.f ? `<dl>${x.f.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>` : ""}</a>`;
          })
          .join("");
      }
      function botBody(m) {
        const b = m.bot;
        if (b.kind === "ticket") {
          const href = `helpdesk.html#/inbox/all/${b.id}`;
          return `<div class="unf"><span class="ah">${px("ticket-01")}New ticket · #${b.id}<span class="go">${b.prio === "High" ? `<span class="chip" style="height:18px"><span class="sq" style="background:var(--danger)"></span>High</span>` : ""}</span></span><div class="tt">${esc(b.title)}</div><div class="ds">${esc(b.from)}</div>
      <div class="bact">${b.as ? `<span class="done">${px("checkmark-circle-01")}Taken by ${nm(b.as)}</span>` : `<button class="btn" data-bot="take" data-m="${m.id}">Take it</button>`}<a class="btn ghost" href="${href}">Open in Helpdesk</a></div></div>`;
        }
        if (b.kind === "task") {
          return `<div class="unf"><span class="ah">${px("tick-01")}${esc(b.from)}</span><div class="tt"><a href="tasks.html#/issue/${b.id}">${b.id}</a> · ${esc(b.title)}</div>
      <dl><div><dt>Status</dt><dd><span class="led" style="--c:${b.state === "Done" ? "var(--success)" : b.state === "Todo" ? "var(--ink-dim)" : "var(--info)"}"></span>${b.state}</dd></div><div><dt>Assignee</dt><dd>${b.as ? nm(b.as) : "Camille Roy"}</dd></div>${b.due ? `<div><dt>Due</dt><dd>${b.due}</dd></div>` : ""}</dl>
      <div class="bact"><a class="btn" href="tasks.html#/issue/${b.id}">Open issue</a>${b.state !== "Done" ? `<button class="btn ghost" data-bot="done" data-m="${m.id}">Mark done</button>` : `<span class="done">${px("checkmark-circle-01")}Done</span>`}</div></div>`;
        }
        if (b.kind === "build") {
          const ok = b.state === "ok",
            c = ok ? "var(--success)" : b.state === "fail" ? "var(--danger)" : "var(--warning)";
          return `<div class="unf" style="border-left-color:${c}"><span class="ah"><span class="led" style="background:${c}"></span>${ok ? "Deployed to production" : b.state === "fail" ? "Build failed" : "Building"} · ${b.dur}</span>
      <div class="tt">${b.app} ${b.ver} <span class="mono dim" style="font-weight:400;font-size:12px">${b.commit}</span></div><div class="ds">${esc(b.msg)} · ${esc(b.by)}</div>
      ${b.err ? `<pre class="cb" style="margin-top:8px;font:400 12px/18px var(--font-mono);border:1px solid var(--line);padding:6px 8px;background:var(--bg-sunk);color:var(--danger)">${esc(b.err)}</pre>` : ""}
      <div class="bact"><a class="btn" href="console-home.html#/deployments/${b.app}">View deployment</a>${b.state === "fail" ? `<button class="btn ghost" data-bot="retry" data-m="${m.id}">Retry</button>` : ok && !b.rolled ? `<button class="btn ghost" data-bot="rollback" data-m="${m.id}">Roll back</button>` : ""}${b.rolled ? `<span class="done">${px("rollback")}Rolled back by Camille Roy</span>` : ""}</div></div>`;
        }
        if (b.kind === "remind") return `<div class="tx">${fmtText(b.text)}</div>`;
        return "";
      }
      function pollBody(m) {
        const p = m.poll,
          total = new Set(p.opts.flatMap((o) => o[1])).size,
          max = Math.max(1, ...p.opts.map((o) => o[1].length));
        return `<div class="poll"><div class="ph">${px("bar-chart")}${esc(p.q)}<span class="k">${total} voter${total === 1 ? "" : "s"}${p.multi ? " · several choices" : ""}</span></div>
    ${p.opts
      .map(([l, v], i) => {
        const on = Math.round((v.length / Math.max(1, total)) * 20);
        return `<button class="opt${v.includes(ME) ? " me" : ""}${v.length === max && v.length ? " lead" : ""}" data-vote="${m.id}:${i}"><span class="ol"><span class="ck"></span>${esc(l)}</span><span class="cells">${Array.from({ length: 20 }, (_, k) => `<i class="${k < on ? "on" : ""}"></i>`).join("")}</span><span class="n">${v.length}</span><span class="vs">${v
          .slice(0, 4)
          .map((w) => av(w))
          .join("")}</span></button>`;
      })
      .join("")}</div>`;
      }
      function rxRow(m) {
        const ks = Object.keys(m.rx).filter((k) => m.rx[k].length);
        if (!ks.length) return "";
        return `<div class="rx">${ks.map((k) => `<button class="rxb${m.rx[k].includes(ME) ? " me" : ""}" data-rx="${m.id}:${k}" title="${m.rx[k].map(nm).join(", ")}">${px(k)}${m.rx[k].length}</button>`).join("")}<button class="rxb add" data-pick="${m.id}" title="Add reaction">${px("smile")}</button></div>`;
      }
      function thrRow(m) {
        if (!m.replies.length) return "";
        const ws = [...new Set(m.replies.map((r) => r.who))].slice(0, 4),
          last = m.replies[m.replies.length - 1];
        return `<button class="thr" data-thread="${m.id}"><span class="avs">${ws.map((w) => av(w)).join("")}</span><b>${m.replies.length} repl${m.replies.length === 1 ? "y" : "ies"}</b><span class="l">Last reply ${shortWhen(last.t)}</span><span class="go">${px("arrow-right-01")}</span></button>`;
      }
      function msgHTML(m, opt = {}) {
        if (m.sys)
          return `<div class="sys" data-mid="${m.id}">${px(m.icon || "information-circle")}<span>${fmtText(m.text)}</span><span class="t">${hm(m.t)}</span></div>`;
        const cont = opt.cont,
          inThread = !!m.parent;
        const name = isBot(m.who)
          ? `<span class="nm">${nm(m.who)}</span><span class="apptag">APP</span>`
          : `<span class="nm" data-person="${m.who}">${nm(m.who)}</span>`;
        const topic =
          opt.showTopic && m.topic
            ? `<span class="tpc" data-topic="${esc(m.topic)}">${px("arrow-right-01").replace('class="px"', 'class="px" style="width:10px;height:10px;vertical-align:-1px"')} ${esc(m.topic)}</span>`
            : "";
        const head = cont
          ? ""
          : `<div class="who">${name}<span class="t" title="${m.t}">${hm(m.t)}</span>${topic}</div>`;
        const gut = cont
          ? `<span class="tm">${hm(m.t)}</span>`
          : isBot(m.who)
            ? av(m.who)
            : `<span data-person="${m.who}">${av(m.who)}</span>`;
        const mine = m.who === ME;
        const acts = `<div class="mact">${QUICK.slice(0, 3)
          .map((k) => `<button class="qr" data-rx="${m.id}:${k}" title="React">${px(k)}</button>`)
          .join(
            "",
          )}<button data-pick="${m.id}" title="Add reaction">${px("smile")}</button>${inThread ? "" : `<button data-thread="${m.id}" title="Reply in thread">${px("message-01")}</button>`}${inThread ? "" : `<button data-pin="${m.id}" class="${m.pinned ? "on" : ""}" title="${m.pinned ? "Unpin" : "Pin to channel"}">${px("pin")}</button>`}<button data-save="${m.id}" class="${m.saved ? "on" : ""}" title="${m.saved ? "Remove from saved" : "Save"}">${px(m.saved ? "bookmark-01-fill" : "bookmark-01")}</button><button data-more="${m.id}" title="More">${px("more-horizontal")}</button></div>`;
        const body =
          (m.text
            ? `<div class="tx">${fmtText(m.text)}${m.edited ? `<span class="edited">(edited)</span>` : ""}</div>`
            : "") +
          (m.bot ? botBody(m) : "") +
          (m.poll ? pollBody(m) : "") +
          (m.files.length || unfurls(m.text)
            ? `<div class="cards">${m.files.map(fileCard).join("")}${unfurls(m.text)}</div>`
            : "") +
          rxRow(m) +
          (inThread || opt.root ? "" : thrRow(m));
        const pin = m.pinned && !cont ? `<div class="pinf">${px("pin")}Pinned</div>` : "";
        return `<div class="m${cont ? " cont" : ""}${mentionsMe(m) && m.who !== ME ? " mine-men" : ""}" data-mid="${m.id}"><div class="gut">${gut}</div><div style="min-width:0">${pin}${head}${body}</div>${acts}</div>`;
      }
      function listHTML(list, opts = {}) {
        let h = "",
          prevDay = "",
          prev = null;
        list.forEach((m) => {
          const d = m.t.slice(0, 10);
          if (d !== prevDay) {
            h += `<div class="day"><span>${dayLabel(d)}</span></div>`;
            prevDay = d;
            prev = null;
          }
          if (opts.divider != null && m.id > opts.divider && !opts.divDone && m.who !== ME) {
            h += `<div class="newline">New</div>`;
            opts.divDone = true;
            prev = null;
          }
          const cont =
            prev &&
            !m.sys &&
            !prev.sys &&
            !m.bot &&
            !m.poll &&
            prev.who === m.who &&
            prev.topic === m.topic &&
            mins(m.t) - mins(prev.t) < 6 &&
            !m.pinned;
          h += msgHTML(m, { cont, showTopic: opts.showTopic });
          prev = m;
        });
        return h;
      }

      // ------------------------------------------------------------ channel view
      function head(crumb, acts = "") {
        return `<header class="head"><button class="icon-btn menu" id="menuBtn" aria-label="Navigation">${px("sidebar-left")}</button>${crumb}<div class="acts">${acts}</div></header>`;
      }
      function channelView() {
        const c = chById(S.ch);
        const topics = [
          ...new Set(
            chMsgs(c.id)
              .filter((m) => m.topic)
              .map((m) => m.topic),
          ),
        ];
        const ft = S.topic[c.id] || "";
        const team = c.team
          ? `<a href="#/browse/${c.team}">${c.team}</a><span class="sep">/</span>`
          : c.dm
            ? `<a href="#/c/${c.id}">Direct messages</a><span class="sep">/</span>`
            : `<a href="#/browse">Workspace</a><span class="sep">/</span>`;
        const title = c.dm
          ? others(c).length === 1
            ? `${pav(others(c)[0])} ${esc(nm(others(c)[0]))}`
            : `<span class="gav">${others(c).length + 1}</span>${esc(chTitle(c))}`
          : `${px(chIcon(c))}${esc(c.name)}`;
        const crumb = `<div class="crumb">${team}<b>${title}</b>${c.dm ? "" : `<button class="icon-btn star${c.starred ? " on" : ""}" data-star title="${c.starred ? "Unstar" : "Star"}" style="width:24px;height:24px">${px(c.starred ? "star-fill" : "star")}</button>`}</div>${c.dm || !c.desc ? "" : `<span class="desc">${esc(c.desc)}</span>`}`;
        const mem = c.members.slice(0, 3);
        const hud = S.huddle && S.huddle.ch === c.id;
        const pinnedN = chMsgs(c.id).filter((m) => m.pinned).length;
        const acts = `<button class="stack hide-sm" data-details="members" title="Members">${mem.map((w) => av(w)).join("")}<span class="n">${c.members.length}</span></button>
    <button class="btn${hud ? " live" : ""}" data-huddle>${px("headphones")}<span class="lbl">${hud ? "In huddle" : "Huddle"}</span></button>
    <button class="icon-btn" data-meet title="Start a meeting">${px("video-01")}</button>
    <button class="icon-btn${S.right && S.right.k === "details" && S.right.tab === "pinned" ? " on" : ""}" data-details="pinned" title="Pinned (${pinnedN})">${px("pin")}</button>
    <button class="icon-btn${S.right && S.right.k === "details" && S.right.tab !== "pinned" ? " on" : ""}" data-details="about" title="Channel details">${px("sidebar-right")}</button>`;
        const tbar =
          c.dm || !topics.length
            ? ""
            : `<div class="topics" id="topics"><span class="eyebrow">Topics</span><button class="tp" data-ftopic="" aria-pressed="${!ft}">All</button>${topics
                .map((t) => {
                  const u = chMsgs(c.id).some(
                    (m) => m.topic === t && m.id > (S.divider[c.id] ?? c.read) && m.who !== ME,
                  );
                  return `<button class="tp" data-ftopic="${esc(t)}" aria-pressed="${ft === t}">${u ? `<span class="u"></span>` : ""}${esc(t)}</button>`;
                })
                .join("")}</div>`;
        return (
          head(crumb, acts) +
          tbar +
          `<div class="split"><section class="chat"><div class="msgs" id="msgs"></div><div class="compw" id="compw"></div><div class="typing" id="typing"></div></section><aside class="rp" id="rp" hidden></aside></div>`
        );
      }
      function intro(c) {
        if (c.dm) {
          const o = others(c);
          return `<div class="intro"><h2>${o.length === 1 ? esc(nm(o[0])) : esc(chTitle(c))}</h2><br><p>${o.length === 1 ? `${esc(P[o[0]].r)} · ${P[o[0]].t}. This conversation is between you two.` : "A group conversation. Add people anytime, no channel needed."}</p></div>`;
        }
        return `<div class="intro"><h2>${px(chIcon(c))}${esc(c.name)}</h2><br><p>${esc(c.desc)} Created by ${nm(c.by)}${c.team ? ` in ${c.team}` : ""}.</p><div class="row"><button class="btn" data-details="members">${px("user-add-01")}Add people</button><button class="btn ghost" data-details="settings">${px("notification-01")}Notifications</button></div></div>`;
      }
      function renderMsgs(scroll) {
        const c = chById(S.ch),
          box = $("#msgs");
        if (!box) return;
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
        const ft = S.topic[c.id] || "";
        const list = chMsgs(c.id).filter((m) => !ft || m.topic === ft || (m.sys && !m.topic));
        const y = box.scrollTop;
        box.innerHTML =
          intro(c) +
          listHTML(list, { divider: S.divider[c.id], showTopic: !c.dm && !ft }) +
          (S.eph[c.id] || [])
            .map(
              (e) =>
                `<div class="eph">${px(e.i)}<span>${e.html}</span><span class="dim mono" style="font-size:11px">Only visible to you</span><button class="icon-btn x" data-eph="${e.id}">${px("cancel-01")}</button></div>`,
            )
            .join("");
        drawDithers(box);
        if (S.hl) {
          const el = box.querySelector(`[data-mid="${S.hl}"]`);
          if (el) {
            el.scrollIntoView({ block: "center" });
            el.classList.add("hl");
          }
          S.hl = null;
        } else if (scroll === "bottom" || (scroll !== "keep" && atBottom))
          box.scrollTop = box.scrollHeight;
        else box.scrollTop = y;
      }
      function drawDithers(root) {
        root.querySelectorAll("canvas[data-dither]").forEach((cv) => {
          if (cv.clientWidth) ditherCover(cv, +cv.dataset.dither);
        });
      }

      // ------------------------------------------------------------ composer
      const TOOLS = [
        ["text-bold", "Bold", "**"],
        ["text-italic", "Italic", "*"],
        ["code", "Code", "`"],
        ["list-view", "Bulleted list", "- "],
        ["sorting-01", "Numbered list", "1. "],
        ["quote-up", "Quote", "> "],
        ["link-01", "Link", "link"],
        ["command-line", "Code block", "```"],
      ];
      function composerHTML(where) {
        const c = chById(S.ch),
          thread = where === "thread";
        if (!thread && !joined(c))
          return `<div class="ro"><span>You are previewing #${esc(c.name)}. </span><button class="btn primary" data-join="${c.id}" style="margin-left:8px">Join channel</button></div>`;
        const ed = !thread && S.editing;
        const ph = thread ? "Reply…" : c.dm ? `Message ${chTitle(c)}` : `Message #${c.name}`;
        const tp =
          !thread && !c.dm
            ? `<label class="tpin" title="Topic of this message">${px("arrow-right-01")}<input id="ctopic" list="topicList" placeholder="Topic" value="${esc(S.ctopic[c.id] ?? (S.topic[c.id] || lastTopic(c)))}"><datalist id="topicList">${[
                ...new Set(
                  chMsgs(c.id)
                    .map((m) => m.topic)
                    .filter(Boolean),
                ),
              ]
                .map((t) => `<option value="${esc(t)}">`)
                .join("")}</datalist></label>`
            : "";
        return `<div class="comp${ed ? " editing" : ""}" data-where="${where}">
    <div class="ctb">${TOOLS.map(([i, l, w]) => `<button class="icon-btn" data-fmt="${esc(w)}" title="${l}">${px(i)}</button>${i === "code" || i === "quote-up" ? '<span class="sp"></span>' : ""}`).join("")}${ed ? `<span class="eb">${px("pencil")}Editing · Esc to cancel</span>` : ""}</div>
    ${!thread && S.pending.length ? `<div class="pend">${S.pending.map((f, i) => `<span class="chip">${px("attachment-01")}${esc(f.name)}<span class="dim mono">${f.size}</span><button data-unpend="${i}" title="Remove">${px("cancel-01")}</button></span>`).join("")}</div>` : ""}
    <textarea rows="1" placeholder="${esc(ph)}" data-ta="${where}">${esc(thread ? S.draft["t" + S.right.id] || "" : ed ? decode(ed.text) : S.draft[c.id] || "")}</textarea>
    <div class="cbt">${thread ? "" : `<button class="icon-btn" data-attach title="Attach">${px("attachment-01")}</button>`}<button class="icon-btn" data-ins="@" title="Mention someone">${px("user")}</button>${thread ? "" : `<button class="icon-btn" data-ins="#" title="Link a channel">${px("hashtag")}</button>`}<button class="icon-btn" data-icon-pick="${where}" title="Insert an icon">${px("smile")}</button>${thread ? "" : `<button class="icon-btn" data-ins="/" title="Slash commands">${px("command-line")}</button>`}${tp}<span class="hint">Enter to send · Shift+Enter new line${thread ? "" : " · ↑ edit"}</span><button class="send" data-send="${where}" title="Send">${px("sent")}</button></div>
  </div>${thread ? `<label class="also"><input type="checkbox" id="alsoSend"> Also send to ${c.dm ? "the conversation" : "#" + esc(c.name)}</label>` : ""}`;
      }
      function lastTopic(c) {
        const l = chMsgs(c.id).filter((m) => m.topic);
        return l.length ? l[l.length - 1].topic : "General";
      }
      function renderComposer() {
        const w = $("#compw");
        if (!w) return;
        w.innerHTML = composerHTML("main");
        bindTa($("textarea", w));
      }
      function grow(ta) {
        ta.style.height = "auto";
        ta.style.height = Math.min(220, ta.scrollHeight) + "px";
        const s = ta.closest(".comp").querySelector(".send");
        if (s)
          s.classList.toggle(
            "ok",
            !!ta.value.trim() || (ta.dataset.ta === "main" && S.pending.length > 0),
          );
      }
      function bindTa(ta) {
        if (!ta) return;
        grow(ta);
        ta.addEventListener("input", () => {
          const w = ta.dataset.ta;
          if (w === "main" && !S.editing) S.draft[S.ch] = ta.value;
          if (w === "thread") S.draft["t" + S.right.id] = ta.value;
          grow(ta);
          acUpdate(ta);
        });
        ta.addEventListener("keydown", (e) => {
          if (AC.open && acKey(e, ta)) return;
          if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            send(ta.dataset.ta);
            return;
          }
          if (e.key === "ArrowUp" && !ta.value && ta.dataset.ta === "main") {
            const mine = chMsgs(S.ch).filter((m) => m.who === ME && !m.sys && !m.poll);
            if (mine.length) {
              e.preventDefault();
              S.editing = mine[mine.length - 1];
              renderComposer();
              const t = $("#compw textarea");
              t.focus();
              t.setSelectionRange(t.value.length, t.value.length);
            }
            return;
          }
          if (e.key === "Escape" && S.editing) {
            e.stopPropagation();
            S.editing = null;
            renderComposer();
            $("#compw textarea").focus();
            return;
          }
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") {
            e.preventDefault();
            applyFmt(ta, "**");
          }
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "i") {
            e.preventDefault();
            applyFmt(ta, "*");
          }
        });
        ta.addEventListener("blur", () =>
          setTimeout(() => {
            if (!document.activeElement || !document.activeElement.closest(".ac")) acClose();
          }, 150),
        );
      }
      function applyFmt(ta, w) {
        const a = ta.selectionStart,
          b = ta.selectionEnd,
          v = ta.value,
          sel = v.slice(a, b);
        let ins, ca, cb;
        if (w === "- " || w === "1. " || w === "> ") {
          const ls = v.lastIndexOf("\n", a - 1) + 1;
          const lines = (sel || "").split("\n");
          ins =
            (a === ls ? "" : "\n") +
            (sel ? lines.map((l, i) => (w === "1. " ? `${i + 1}. ` : w) + l).join("\n") : w);
          ta.setRangeText(ins, a, b, "end");
        } else if (w === "link") {
          ins = `[${sel || "text"}](https://)`;
          ta.setRangeText(ins, a, b, "select");
          ta.setSelectionRange(a + ins.length - 9, a + ins.length - 1);
        } else if (w === "```") {
          ins = "```\n" + (sel || "") + "\n```";
          ta.setRangeText(ins, a, b, "end");
          ta.setSelectionRange(a + 4, a + 4 + sel.length);
        } else {
          ins = w + (sel || "") + w;
          ta.setRangeText(ins, a, b, "end");
          if (!sel) {
            ca = a + w.length;
            ta.setSelectionRange(ca, ca);
          }
        }
        ta.focus();
        ta.dispatchEvent(new Event("input"));
      }

      // ------------------------------------------------------------ autocomplete (@ # /)
      const CMDS = [
        ["task", "Create a task in Tasks", "/task Call Lyon Logistique about Friday"],
        ["remind", "Set a reminder", "/remind me to send the proposal tomorrow 9:00"],
        ["call", "Start a huddle in this conversation", "/call"],
        ["poll", "Create a poll", "/poll Question | Option A | Option B"],
        ["topic", "Change the topic of your next messages", "/topic Truck 12"],
      ];
      const AC = { open: false, items: [], i: 0, ta: null, start: 0, kind: "" };
      function acUpdate(ta) {
        const pos = ta.selectionStart,
          before = ta.value.slice(0, pos);
        let mm = before.match(/(^|[\s(])([@#])([\wÀ-ÿ-]*)$/),
          kind,
          q,
          start;
        if (mm) {
          kind = mm[2];
          q = mm[3].toLowerCase();
          start = pos - mm[3].length - 1;
        } else if (ta.dataset.ta === "main" && (mm = before.match(/^\/(\w*)$/))) {
          kind = "/";
          q = mm[1].toLowerCase();
          start = 0;
        } else return acClose();
        const c = chById(S.ch);
        let items = [];
        if (kind === "@") {
          const pool = [...c.members, ...ALL.filter((w) => !c.members.includes(w))];
          items = pool
            .filter(
              (w) =>
                P[w].n
                  .toLowerCase()
                  .split(" ")
                  .some((p) => p.startsWith(q)) || P[w].n.toLowerCase().startsWith(q),
            )
            .slice(0, 7)
            .map((w) => ({
              h: `${pav(w)}<span>${esc(P[w].n)}</span><span class="d">${c.members.includes(w) ? esc(P[w].r) : "Not in this channel"}</span>`,
              ins: "@" + P[w].n + " ",
            }));
          if ("here".startsWith(q) && !c.dm)
            items.push({
              h: `${px("notification-01")}<span>@here</span><span class="d">Notify everyone online</span>`,
              ins: "@here ",
            });
        }
        if (kind === "#")
          items = CH.filter((x) => !x.dm && (joined(x) || !x.priv) && x.name.includes(q))
            .slice(0, 7)
            .map((x) => ({
              h: `${px(chIcon(x))}<span>${esc(x.name)}</span><span class="d">${x.team || "Workspace"}</span>`,
              ins: "#" + x.name + " ",
            }));
        if (kind === "/")
          items = CMDS.filter((x) => x[0].startsWith(q)).map((x) => ({
            h: `<span class="c">/${x[0]}</span><span>${x[1]}</span><span class="d">${esc(x[2])}</span>`,
            ins: "/" + x[0] + " ",
          }));
        if (!items.length) return acClose();
        Object.assign(AC, { open: true, items, i: 0, ta, start, kind });
        let box = ta.closest(".compw").querySelector(".ac");
        if (!box) {
          box = document.createElement("div");
          box.className = "ac";
          ta.closest(".compw").appendChild(box);
          box.addEventListener("mousedown", (e) => {
            e.preventDefault();
            const b = e.target.closest("[data-ac]");
            if (b) {
              AC.i = +b.dataset.ac;
              acPick();
            }
          });
        }
        box.innerHTML =
          `<div class="h eyebrow">${kind === "@" ? "People" : kind === "#" ? "Channels" : "Commands"}</div>` +
          items
            .map((x, i) => `<button data-ac="${i}" aria-selected="${i === 0}">${x.h}</button>`)
            .join("");
      }
      function acKey(e, ta) {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          AC.i = (AC.i + (e.key === "ArrowDown" ? 1 : -1) + AC.items.length) % AC.items.length;
          $$(".ac [data-ac]").forEach((b, i) => b.setAttribute("aria-selected", i === AC.i));
          return true;
        }
        if (e.key === "Enter" || e.key === "Tab") {
          e.preventDefault();
          acPick();
          return true;
        }
        if (e.key === "Escape") {
          e.stopPropagation();
          acClose();
          return true;
        }
        return false;
      }
      function acPick() {
        const ta = AC.ta,
          it = AC.items[AC.i];
        if (!it) return;
        const pos = ta.selectionStart;
        ta.setRangeText(it.ins, AC.start, pos, "end");
        acClose();
        ta.focus();
        ta.dispatchEvent(new Event("input"));
      }
      function acClose() {
        AC.open = false;
        $$(".ac").forEach((b) => b.remove());
      }

      // ------------------------------------------------------------ sending
      function addMsg(ch, who, text, o = {}) {
        const m = M(ch, who, o.t || nowT(), text, o);
        return m;
      }
      function send(where) {
        const c = chById(S.ch);
        if (where === "thread") {
          const ta = $("#rp textarea"),
            v = ta.value.trim();
          if (!v) return;
          const p = MS.find((m) => m.id === S.right.id);
          p.replies.push({
            id: ++seq,
            who: ME,
            t: nowT(),
            text: encode(v),
            rx: {},
            files: [],
            edited: false,
            parent: p.id,
            ch: p.ch,
          });
          if ($("#alsoSend") && $("#alsoSend").checked)
            addMsg(p.ch, ME, encode(v), { topic: p.topic });
          S.draft["t" + p.id] = "";
          renderRight();
          renderMsgs();
          renderSide();
          const rb = $("#rp .rp-b");
          if (rb) rb.scrollTop = rb.scrollHeight;
          $("#rp textarea").focus();
          simulateReply(p.ch, p);
          return;
        }
        const ta = $("#compw textarea"),
          raw = ta.value.trim();
        if (S.editing) {
          if (raw) {
            S.editing.text = encode(raw);
            S.editing.edited = true;
          }
          S.editing = null;
          renderComposer();
          renderMsgs("keep");
          $("#compw textarea").focus();
          return;
        }
        if (!raw && !S.pending.length) return;
        const topic = c.dm ? "" : (($("#ctopic") || {}).value || "").trim() || lastTopic(c);
        if (raw.startsWith("/") && !S.pending.length) {
          if (slash(raw, c, topic)) {
            ta.value = "";
            S.draft[c.id] = "";
            grow(ta);
            return;
          }
        }
        addMsg(c.id, ME, encode(raw), { topic, files: S.pending.splice(0) });
        S.ctopic[c.id] = topic;
        c.read = seq;
        S.draft[c.id] = "";
        renderComposer();
        renderMsgs("bottom");
        renderSide();
        refreshTopics();
        $("#compw textarea").focus();
        simulateReply(c.id);
      }
      function slash(raw, c, topic) {
        const [cmd, ...rest] = raw.slice(1).split(" "),
          arg = rest.join(" ").trim();
        if (cmd === "task") {
          if (!arg) {
            toast("Add a title: /task Call Lyon Logistique");
            return true;
          }
          const id = "OPS-" + S.opsSeq++;
          addMsg(c.id, "@tasks", "", {
            topic,
            bot: {
              kind: "task",
              id,
              title: arg,
              from: `Created by Camille Roy from #${c.dm ? "direct message" : c.name}`,
              state: "Todo",
              as: ME,
              due: "No date",
            },
          });
          c.read = seq;
          renderMsgs("bottom");
          renderSide();
          toast(`${id} created in Tasks.`);
          return true;
        }
        if (cmd === "remind") {
          const txt = arg || "check this conversation";
          pushEph(
            c.id,
            "clock-01",
            `Reminder set: <b>${esc(txt.replace(/^me to /, ""))}</b>. I will message you at the time you asked.`,
          );
          return true;
        }
        if (cmd === "call") {
          startHuddle(c.id);
          return true;
        }
        if (cmd === "topic") {
          if (arg) {
            S.ctopic[c.id] = arg;
            renderComposer();
            toast(`Your next messages go to “${arg}”.`);
          }
          return true;
        }
        if (cmd === "poll") {
          const parts = arg
            .split("|")
            .map((s) => s.trim())
            .filter(Boolean);
          if (parts.length < 3) {
            pushEph(
              c.id,
              "bar-chart",
              "Write <code>/poll Question | Option A | Option B</code>, up to 6 options.",
            );
            return true;
          }
          const m = addMsg(c.id, ME, "", {
            topic,
            poll: { q: parts[0], opts: parts.slice(1, 7).map((o) => [o, []]), multi: false },
          });
          c.read = seq;
          renderMsgs("bottom");
          renderSide();
          const voters = others(c)
            .filter((w) => P[w].p !== "off")
            .slice(0, 3);
          voters.forEach((w, i) =>
            setTimeout(
              () => {
                const o = m.poll.opts[(i * 2 + 1) % m.poll.opts.length];
                if (!o[1].includes(w)) o[1].push(w);
                if (S.view === "c" && S.ch === c.id) renderMsgs("keep");
              },
              1800 + i * 1700,
            ),
          );
          return true;
        }
        pushEph(
          c.id,
          "help-circle",
          `Unknown command <code>/${esc(cmd)}</code>. Try /task, /remind, /call, /poll or /topic.`,
        );
        return true;
      }
      let ephSeq = 0;
      function pushEph(ch, i, html) {
        (S.eph[ch] = S.eph[ch] || []).push({ id: ++ephSeq, i, html });
        renderMsgs("bottom");
      }
      const CANNED = {
        "dm-LM": ["Perfect, see you in the huddle.", "I'll send you the layout too."],
        "dm-HB": ["Noted, I'll look after lunch."],
        "dm-PM": ["Thanks Camille."],
        "dm-NP": ["I'll check after the close."],
        "g-depot": ["Works for me.", "OK, noted."],
      };
      function simulateReply(ch, parent) {
        const c = chById(ch);
        let who;
        const last = parent
          ? parent.replies[parent.replies.length - 1]
          : chMsgs(ch)
              .filter((m) => m.who === ME)
              .pop();
        const ment = (last.text.match(/@\{([A-Z]{2})\}/) || [])[1];
        if (ment && ment !== ME && c.members.includes(ment)) who = ment;
        else if (c.dm) who = others(c).find((w) => P[w].p !== "off");
        else if (parent) who = parent.who !== ME && !isBot(parent.who) ? parent.who : null;
        if (!who || P[who].p === "off" || P[who].p === "dnd") return;
        const lines = CANNED[ch] || [
          "Noted, thanks.",
          "On it.",
          "Good, I'll follow up.",
          "Thanks, I'll check.",
        ];
        const txt = lines[Math.floor(Math.random() * lines.length)];
        setTimeout(() => {
          S.typing[ch] = who;
          renderTyping();
        }, 900);
        setTimeout(() => {
          S.typing[ch] = null;
          if (parent) {
            parent.replies.push({
              id: ++seq,
              who,
              t: nowT(),
              text: txt,
              rx: {},
              files: [],
              edited: false,
              parent: parent.id,
              ch,
              unread: !(S.right && S.right.id === parent.id),
            });
          } else addMsg(ch, who, txt, { topic: last.topic });
          if (S.view === "c" && S.ch === ch) {
            chById(ch).read = parent ? chById(ch).read : seq;
            renderMsgs();
            if (S.right && S.right.k === "thread") {
              const d = S.draft;
              renderRight();
              const rb = $("#rp .rp-b");
              if (rb) rb.scrollTop = rb.scrollHeight;
            }
          }
          renderTyping();
          renderSide();
        }, 3600);
      }
      function renderTyping() {
        const el = $("#typing");
        if (!el) return;
        const w = S.typing[S.ch];
        el.innerHTML = w
          ? `<span class="dots"><i></i><i></i><i></i></span>${esc(nm(w))} is typing…`
          : "";
      }

      // ------------------------------------------------------------ right panel: thread, details
      function renderRight() {
        const mb = $("#msgs"),
          bot = mb && mb.scrollHeight - mb.scrollTop - mb.clientHeight < 60;
        renderRight0();
        if (bot) mb.scrollTop = mb.scrollHeight;

      function hudTime() {

      function startMeetAnim() {
        stopMeetAnim();
        const cs = getComputedStyle(document.documentElement),
          ink = cs.getPropertyValue("--ink-muted").trim(),
          bg = cs.getPropertyValue("--bg-sunk").trim(),
          acc = cs.getPropertyValue("--accent").trim(),
          line = cs.getPropertyValue("--line-strong").trim();
        let last = 0;
        const step = (ts) => {
          meetRAF = requestAnimationFrame(step);
          if (ts - last < 140) return;
          last = ts;
          $$("#meet canvas").forEach((cv) => {
            const w = (cv.width = Math.max(8, Math.ceil(cv.clientWidth / 5))),
              h = (cv.height = Math.max(8, Math.ceil(cv.clientHeight / 5))),
              ctx = cv.getContext("2d"),
              seed = +cv.dataset.seed,
              t = ts / 1000;
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, w, h);
            if (cv.dataset.kind === "screen") {
              ctx.fillStyle = line;
              ctx.fillRect(2, 2, w - 4, 3);
              ctx.fillStyle = ink;
              for (let y = 8; y < h - 4; y += 4)
                ctx.fillRect(
                  Math.round(w * 0.08),
                  y,
                  Math.round(w * (0.3 + 0.5 * Math.abs(Math.sin(y * 1.7)))),

                );
              ctx.fillStyle = acc;
              ctx.fillRect(Math.round(w * 0.62), 8, Math.round(w * 0.3), Math.round(h * 0.4));
              return;
            }
            const sway = Math.sin(t * 1.3 + seed) * w * 0.015,
              cx = w / 2 + sway + ((seed % 3) - 1) * w * 0.06,
              hy = h * 0.42,
              hr = h * 0.17;
            ctx.fillStyle = ink;
            for (let y = 0; y < h; y++)
              for (let x = 0; x < w; x++) {

                  dy = (y - hy) / (hr * 1.15),

                  sy = (y - h * 0.98) / (h * 0.32),
                  body = sx * sx + sy * sy < 1 && y > hy + hr * 0.6;

          const changed = S.view !== "c" || S.ch !== parts[1];

            const old = chById(S.ch);

          if (changed || S.divider[c.id] == null) S.divider[c.id] = c.read;
          pref.set("last", S.ch);
          panel.innerHTML = channelView();
          const hl = S.hl;
          renderMsgs(hl ? "keep" : "bottom");
          renderComposer();
          renderRight();
          renderTyping();
          if (!hl) {
            const tb = () => {
              const b = $("#msgs");
              if (b) b.scrollTop = b.scrollHeight;
            };
            requestAnimationFrame(tb);
            if (document.fonts) document.fonts.ready.then(tb);
          }
          if (joined(c) && S.markedUnread !== c.id) c.read = seq;
          S.markedUnread = null;
          if (innerWidth > 860 && !S.right)
            setTimeout(() => {
              const ta = $("#compw textarea");
              if (ta && document.activeElement === document.body) ta.focus();
            }, 0);
        } else if (parts[0] === "call" && chById(parts[1])) {
          S.view = "call";
          S.ch = parts[1];
          if (!S.huddle || S.huddle.ch !== parts[1]) startHuddle(parts[1]);
          panel.innerHTML = meetView(parts[1]);
          renderMeet();
        } else if (parts[0] === "threads") {
          S.view = "threads";
          panel.innerHTML = threadsView();
          MS.forEach((m) => m.replies.forEach((r) => (r.unread = false)));
        } else if (parts[0] === "mentions") {
          S.view = "mentions";
          panel.innerHTML = mentionsView();
        } else if (parts[0] === "saved") {
          S.view = "saved";
          panel.innerHTML = savedView();
        } else if (parts[0] === "browse") {
          S.view = "browse";
          if (parts[1]) S.browse.team = TEAMS.includes(parts[1]) ? parts[1] : "all";
          panel.innerHTML = browseView();
          bindBrowse();
        } else {
          location.replace(
            "#/c/" +
              (chById(pref.get("last", "lyon-depot"))
                ? pref.get("last", "lyon-depot")
                : "lyon-depot"),
          );
          return;
        }
        renderSide();
        renderHud();
        bindMenu();
        $("#app").classList.remove("drawer");
      }
      function bindBrowse() {
        const bq = $("#bq");
        bq.oninput = () => {
          S.browse.q = bq.value;
          const p = bq.selectionStart;
          $("#panel").innerHTML = browseView();
          bindBrowse();
          bindMenu();
          const n = $("#bq");
          n.focus();
          n.setSelectionRange(p, p);
        };
        $("#bteam").onchange = (e) => {
          S.browse.team = e.target.value;
          $("#panel").innerHTML = browseView();
          bindBrowse();
          bindMenu();
        };
      }
      addEventListener("hashchange", route);

      // ------------------------------------------------------------ toast, chrome, keys
      let toastT;
      function toast(msg, undo) {
        const t = $("#toast"),
          u = $("#toastUndo");
        $("#toastMsg").textContent = msg;
        u.hidden = !undo;
        u.onclick = () => {
          undo();
          t.classList.remove("open");
        };
        t.classList.add("open");
        clearTimeout(toastT);
        toastT = setTimeout(() => t.classList.remove("open"), 4500);
      }
      $("#wsBtn").onclick = (e) => {
        e.stopPropagation();
        const r = $("#wsBtn").getBoundingClientRect(),
          w = $("#wsPop");
        w.style.left = r.left + "px";
        w.style.top = r.bottom + 4 + "px";
        w.classList.toggle("open");
      };
      $("#cmdBtn").onclick = () => openSearch();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (scrim.classList.contains("open")) {
            closeModal();
            return;
          }
          if (pop.classList.contains("open")) {
            closePop();
            return;
          }
          if ($("#wsPop").classList.contains("open")) {
            $("#wsPop").classList.remove("open");
            return;
          }
          if ($("#app").classList.contains("drawer")) {
            $("#app").classList.remove("drawer");
            return;
          }
          if (S.view === "c" && S.right && !e.target.closest("textarea")) {
            S.right = null;
            renderRight();
            rerenderHead();
            return;
          }
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          openSearch();
        }
      });
      try {
        const th = pref.get("theme", null);
        if (th) document.documentElement.dataset.theme = th;
      } catch (_) {}

      // a living workspace: someone types in #lyon-depot, a carrier update lands in #carriers
      setTimeout(() => {
        S.typing["lyon-depot"] = "KB";
        renderTyping();
      }, 2500);
      setTimeout(() => {
        S.typing["lyon-depot"] = null;
        addMsg("lyon-depot", "KB", "Scanner 4 swapped, all good :tick-01:", { topic: "Truck 12" });
        if (S.view === "c" && S.ch === "lyon-depot") {
          chById("lyon-depot").read = seq;
          renderMsgs();
        }
        renderTyping();
        renderSide();
      }, 7000);
      setTimeout(() => {
        addMsg("carriers", "JR", "Replacement truck arrived at dock 2, unloading now.", {
          topic: "Transalp",
        });
        if (S.view === "c" && S.ch === "carriers") {
          chById("carriers").read = seq;
          renderMsgs();
        }
        renderSide();
      }, 16000);
      route();
    </script>
  </body>
</html>
