      :root {
        --bg: #0a0a0a;
        --bg-raised: #111111;
        --bg-sunk: #050505;
        --line: #1c1c1c;
        --line-strong: #2e2e2e;
        --ink: #ededed;
        --ink-muted: #8f8f8f;
        --ink-dim: #5e5e5e;
        --accent: #ff4f1f;
        --accent-ink: #0a0a0a;
        --focus: var(--accent);
        --success: #3ddc84;
        --warning: #ffb020;
        --danger: #ff6b81;
        --info: #7aa2ff;
        --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.6);
        --font-pixel: "Forge Sans", "Geist Mono", ui-monospace, monospace;
        --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", monospace;
        --hatch: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 9px);
        --ctl: 28px;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #f7f7f5;
        --bg-raised: #ededea;
        --bg-sunk: #ffffff;
        --line: #e2e2de;
        --line-strong: #c4c4be;
        --ink: #111111;
        --ink-muted: #5c5c58;
        --ink-dim: #80807a;
        --accent: #c93a10;
        --accent-ink: #0a0a0a;
        --success: #157a3e;
        --warning: #8a5300;
        --danger: #b4233f;
        --info: #2f5bd1;
        --shadow-pop: 0 8px 24px rgba(17, 17, 17, 0.12);
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border-radius: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/16px var(--font-sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--accent);
        color: var(--accent-ink);
      }
      [data-i] {
        display: inline-flex;
        flex: none;
      }
      .px {
        display: inline-block;
        flex: none;
        width: 16px;
        height: 16px;
        shape-rendering: crispEdges;
      }
      .px .o {
        opacity: 0.4;
      }
      .eyebrow {
        font: 500 11px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .dim {
        color: var(--ink-dim);
      }
      .muted {
        color: var(--ink-muted);
      }
      .led {
        display: inline-block;
        flex: none;
        width: 6px;
        height: 6px;
        background: var(--ink-dim);
      }
      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border: 1px solid var(--line-strong);
        font: 500 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: var(--ctl);
        height: var(--ctl);
        flex: none;
        border: 1px solid transparent;
        color: var(--ink-muted);
      }
      .icon-btn:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .icon-btn.boxed {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        flex: none;
      }
      .btn:hover {
        border-color: var(--ink);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--ink));
      }
      .btn.ghost {
        border-color: transparent;
        color: var(--ink-muted);
      }
      .btn.ghost:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
      }
      .seg button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: calc(var(--ctl) - 2px);
        padding: 0 10px;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-dim);
        white-space: nowrap;
      }
      .seg button + button {
        border-left: 1px solid var(--line-strong);
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }
      .seg button:hover:not([aria-pressed="true"]) {
        color: var(--ink);
      }
      .seg.icons button {
        width: calc(var(--ctl) - 2px);
        padding: 0;
        justify-content: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 7px;
        border: 1px solid var(--line-strong);
        font: 400 11.5px/1 var(--font-sans);
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .chip .sq {
        width: 6px;
        height: 6px;
        flex: none;
      }
      .chip .px {
        width: 12px;
        height: 12px;
      }
      .av {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        flex: none;
        background: var(--bg-sunk);
        border: 1px solid var(--line-strong);
        font: 500 8.5px/1 var(--font-mono);
        color: var(--ink);
      }
      .av.me {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        font: 700 9px/1 var(--font-pixel);
        text-transform: uppercase;
        color: var(--ink);
      }
      .logo.lg {
        width: 40px;
        height: 40px;
        font-size: 15px;
      }
      .pop {
        position: fixed;
        z-index: 60;
        min-width: 220px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
        padding: 4px;
        display: none;
      }
      .pop.open {
        display: block;
      }
      .pop .h {
        padding: 8px 10px 6px;
      }
      .pop a,
      .pop button.r {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 30px;
        padding: 0 10px;
        color: var(--ink-muted);
        text-align: left;
      }
      .pop a:hover,
      .pop button.r:hover,
      .pop button.r[aria-selected="true"] {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .pop a kbd,
      .pop button.r kbd,
      .pop button.r .k {
        margin-left: auto;
      }
      .pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      /* app frame shared by the apps: a side, an inset panel with handles, a foot */
      .app {
        display: grid;
        grid-template-columns: var(--side) minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
      }
      .side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 8px 12px 0;
      }
      .side-head {
        display: flex;
        align-items: center;
        gap: 4px;
        height: var(--ctl);
        margin-bottom: 10px;
      }
      .ws {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px 0 4px;
        border: 1px solid transparent;
        min-width: 0;
        flex: 1;
      }
      .ws:hover {
        border-color: var(--line-strong);
      }
      .ws .tile {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .ws .tile .px {
        width: 12px;
        height: 12px;
      }
      .ws b {
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ws .chev {
        color: var(--ink-dim);
      }
      .searchbox {
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl);
        padding: 0 8px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        background: var(--bg-sunk);
        color: var(--ink-dim);
        width: 100%;
        text-align: left;
      }
      .searchbox:hover {
        border-color: var(--line-strong);
        color: var(--ink-muted);
      }
      .searchbox span:nth-child(2) {
        flex: 1;
      }
      .nav {
        flex: 1;
        overflow: auto;
        margin: 0 -4px;
        padding: 0 4px 12px;
        scrollbar-width: none;
      }
      .nav-sec {
        margin-top: 14px;
      }
      .nav-h {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        color: var(--ink-dim);
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        width: 100%;
        text-align: left;
      }
      .nav-h:hover {
        color: var(--ink-muted);
      }
      .nav-h .car {
        margin-left: auto;
        transition: transform 0.12s;
      }
      .nav-h[aria-expanded="false"] .car {
        transform: rotate(-90deg);
      }
      .it {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--nav-row, 28px);
        padding: 0 8px;
        color: var(--ink-muted);
        border: 1px solid transparent;
        white-space: nowrap;
        width: 100%;
        text-align: left;
      }
      .it:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .it[aria-current="page"] {
        color: var(--ink);
        background: var(--bg-raised);
        border-color: var(--line);
      }
      .it[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: -5px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--accent);
      }
      .it .lbl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .it .k {
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .side-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 44px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        margin: 0 -12px;
        padding-left: 12px;
        padding-right: 12px;
      }
      .mainwrap {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 8px 8px 0 0;
      }
      .panel {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line-strong);
        background: var(--bg);
      }
      .panel::before,
      .panel::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        pointer-events: none;
        z-index: 3;
      }
      .panel::before {
        top: -4px;
        left: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .panel::after {
        bottom: -4px;
        right: -4px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        height: var(--ctl);
        margin: 4px 2px 4px 4px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .foot .led {
        background: var(--success);
      }
      .foot a:hover {
        color: var(--ink);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font: 500 13px/16px var(--font-sans);
      }
      .crumb a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 5px 0 4px;
        margin-left: -4px;
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .crumb a:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .crumb .sep {
        color: var(--ink-dim);
      }
      .crumb b {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .head .acts {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .menu {
        display: none !important;
      }
      .tk-hover:hover {
        --t: var(--accent);
        background-image:
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t)),
          linear-gradient(var(--t), var(--t)), linear-gradient(var(--t), var(--t));
        background-size:
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px,
          7px 1.5px,
          1.5px 7px;
        background-position:
          top left,
          top left,
          top right,
          top right,
          bottom left,
          bottom left,
          bottom right,
          bottom right;
        background-repeat: no-repeat;
      }
      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: fixed;
          inset: 0 auto 0 0;
          width: 280px;
          z-index: 30;
          background: var(--bg);
          border-right: 1px solid var(--line);
          transform: translateX(-100%);
          transition: transform 0.2s;
        }
        .app.drawer .side {
          transform: none;
          box-shadow: var(--shadow-pop);
        }
        .mainwrap {
          padding: 0;
        }
        .panel {
          border: 0;
        }
        .panel::before,
        .panel::after {
          display: none;
        }
        .menu {
          display: inline-grid !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      /* Slack's frame (sections, threads panel, huddles) with Zulip's channel + topic model, drawn in the Forgeron language. */
      :root {
        --side: 256px;
        --rp: 380px;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .hide {
        display: none !important;
      }
      /* sidebar */
      .nav .badge,
      .badge {
        margin-left: auto;
        display: grid;
        place-items: center;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        background: var(--accent);
        color: var(--accent-ink);
        font: 500 10.5px/1 var(--font-mono);
      }
      .badge.soft {
        background: transparent;
        border: 1px solid var(--line-strong);
        color: var(--ink-muted);
      }
      .it .px {
        color: var(--ink-dim);
      }
      .it.unr {
        color: var(--ink);
        font-weight: 600;
      }
      .it.unr .px {
        color: var(--ink-muted);
      }
      .it.muted {
        color: var(--ink-dim);
      }
      .it .lk {
        width: 12px;
        height: 12px;
        margin-left: -4px;
      }
      .it .lk .px {
        width: 12px;
        height: 12px;
      }
      .nav-h .add {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        color: var(--ink-dim);
        margin-left: auto;
      }
      .nav-h .add + .car {
        margin-left: 2px;
      }
      .nav-h .add:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .nav-h .tsq {
        width: 6px;
        height: 6px;
        background: var(--ink-dim);
      }
      .pav {
        position: relative;
        display: inline-grid;
        flex: none;
      }
      .pav .pl {
        position: absolute;
        right: -3px;
        bottom: -3px;
        width: 7px;
        height: 7px;
        border: 1px solid var(--bg);
        background: var(--c, var(--ink-dim));
      }
      .pav .pl.off {
        background: var(--bg);
        box-shadow: inset 0 0 0 1px var(--ink-dim);
      }
      .gav {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        flex: none;
        border: 1px solid var(--line-strong);
        font: 500 10px/1 var(--font-mono);
        color: var(--ink-muted);
      }
      .side-foot .me-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        height: 32px;
        padding: 0 6px 0 2px;
        border: 1px solid transparent;
      }
      .side-foot .me-btn:hover {
        border-color: var(--line-strong);
      }
      .side-foot .me-btn .st {
        display: block;
        font-size: 11px;
        color: var(--ink-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 140px;
        text-align: left;
      }
      .side-foot .me-btn .nm {
        display: block;
        text-align: left;
      }
      /* head */
      .head .crumb .star {
        color: var(--ink-dim);
      }
      .head .crumb .star:hover,
      .head .crumb .star.on {
        color: var(--accent);
      }
      .head .desc {
        color: var(--ink-dim);
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
        padding-left: 8px;
        border-left: 1px solid var(--line);
        margin-left: 4px;
      }
      .stack {
        display: inline-flex;
        align-items: center;
        height: var(--ctl);
        padding: 0 6px 0 4px;
        border: 1px solid transparent;
      }
      .stack:hover {
        border-color: var(--line-strong);
      }
      .stack .av {
        margin-left: -4px;
        box-shadow: 0 0 0 1px var(--bg);
      }
      .stack .av:first-child {
        margin-left: 0;
      }
      .stack .n {
        margin-left: 6px;
        font: 400 11px/1 var(--font-mono);
        color: var(--ink-muted);
      }
      .icon-btn.on {
        color: var(--accent);
        border-color: var(--line-strong);
      }
      .btn.live {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* topic bar (Zulip) */
      .topics {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 36px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        scrollbar-width: none;
        flex: none;
      }
      .topics .eyebrow {
        margin-right: 4px;
        font-size: 10px;
      }
      .tp {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border: 1px solid var(--line);
        color: var(--ink-muted);
        white-space: nowrap;
        font-size: 12px;
      }
      .tp:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .tp[aria-pressed="true"] {
        border-color: var(--ink-muted);
        color: var(--ink);
        background: var(--bg-raised);
      }
      .tp .u {
        width: 6px;
        height: 6px;
        background: var(--accent);
      }
      .tp .n {
        font: 400 10.5px/1 var(--font-mono);
        color: var(--ink-dim);
      }
      /* main split */
      .split {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .chat {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .msgs {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 8px 0 12px;
      }
      .rp[hidden] {
        display: none;
      }
      .rp {
        width: var(--rp);
        flex: none;
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg);
      }
      .rp-h {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 14px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .rp-h b {
        font: 700 13px/16px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .rp-h .s {
        color: var(--ink-dim);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rp-h .icon-btn {
        margin-left: auto;
      }
      .rp-b {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      /* intro */
      .intro {
        margin: 18px 20px 10px;
        padding: 18px;
        border: 1px solid var(--line);
        background-image: var(--hatch);
      }
      .intro > * {
        background: var(--bg);
      }
      .intro h2 {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: 700 22px/24px var(--font-pixel);
        text-transform: uppercase;
        padding: 2px 6px 2px 0;
      }
      .intro p {
        display: inline-block;
        color: var(--ink-muted);
        margin-top: 8px;
        padding: 2px 6px 2px 0;
      }
      .intro .row {
        display: flex;
        gap: 6px;
        margin-top: 12px;
        background: none;
      }
      /* day separator */
      .day {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0 4px;
        padding: 0 20px;
        height: 24px;
      }
      .day::before,
      .day::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .day span {
        font: 500 10.5px/22px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
        border: 1px solid var(--line);
        padding: 0 8px;
        background: var(--bg);
      }
      .newline {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        padding: 0 20px;
        color: var(--accent);
        font: 500 10px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .newline::before {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--accent);
      }
      /* message */
      .m {
        position: relative;
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        gap: 0 10px;
        padding: 6px 20px 4px;
      }
      .m.cont {
        padding-top: 1px;
        padding-bottom: 2px;
      }
      .m:hover,
      .m.hl-hover {
        background: var(--bg-raised);
      }
      .m.hl {
        animation: hl 2.4s ease-out;
      }
      @keyframes hl {
        0%,
        40% {
          background: color-mix(in srgb, var(--accent) 16%, transparent);
        }
        100% {
          background: transparent;
        }
      }
      .m.mine-men {
        box-shadow: inset 2px 0 0 var(--accent);
        background: color-mix(in srgb, var(--accent) 5%, transparent);
      }
      .m .gut {
        padding-top: 2px;
      }
      .m .gut .av {
        width: 36px;
        height: 36px;
        font-size: 12px;
        cursor: pointer;
      }
      .m .gut .tm {
        display: none;
        font: 400 10px/20px var(--font-mono);
        color: var(--ink-dim);
        text-align: right;
        width: 36px;
      }
      .m.cont:hover .gut .tm {
        display: block;
      }
      .m .who {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 1px;
      }
      .m .who .nm {
        font-weight: 600;
        cursor: pointer;
      }
      .m .who .nm:hover {
        text-decoration: underline;
      }
      .m .who .t {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .m .who .tpc {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-muted);
        border: 1px solid var(--line);
        padding: 0 5px;
        cursor: pointer;
      }
      .m .who .tpc:hover {
        color: var(--ink);
        border-color: var(--line-strong);
      }
      .m .who .apptag {
        font: 500 9.5px/14px var(--font-mono);
        letter-spacing: 0.06em;
        padding: 0 4px;
        border: 1px solid var(--line-strong);
        color: var(--ink-muted);
      }
      .bav {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .bav.sm {
        width: 20px;
        height: 20px;
      }
      .bav.sm .px {
        width: 12px;
        height: 12px;
      }
      .tx {
        line-height: 20px;
        overflow-wrap: anywhere;
      }
      .tx b {
        font-weight: 600;
      }
      .tx code {
        font: 400 12px/18px var(--font-mono);
        padding: 0 4px;
        border: 1px solid var(--line);
        background: var(--bg-sunk);
        color: var(--ink);
      }
      .tx pre.cb {
        margin: 4px 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        background: var(--bg-sunk);
        font: 400 12px/18px var(--font-mono);
        white-space: pre-wrap;
        overflow: auto;
      }
      .tx ul,
      .tx ol {
        margin: 2px 0;
        padding-left: 18px;
      }
      .tx ul li {
        list-style: none;
        position: relative;
      }
      .tx ul li::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 8px;
        width: 4px;
        height: 4px;
        background: var(--ink-muted);
      }
      .tx ol li {
        list-style: decimal;
        font-variant-numeric: tabular-nums;
      }
      .tx ol li::marker {
        font-family: var(--font-mono);
        color: var(--ink-muted);
        font-size: 12px;
      }
      .tx blockquote {
        margin: 2px 0;
        padding-left: 10px;
        border-left: 2px solid var(--line-strong);
        color: var(--ink-muted);
      }
      .tx .lnk {
        color: var(--info);
        text-decoration: underline;
        text-decoration-color: color-mix(in srgb, var(--info) 40%, transparent);
        text-underline-offset: 2px;
      }
      .tx .ico {
        display: inline-flex;
        vertical-align: -3px;
        color: var(--accent);
      }
      .men {
        display: inline;
        padding: 0 2px;
        color: var(--info);
        background: color-mix(in srgb, var(--info) 12%, transparent);
        font-weight: 500;
      }
      .men.me {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .men:hover {
        text-decoration: underline;
      }
      .edited {
        font: 400 10.5px/16px var(--font-mono);
        color: var(--ink-dim);
        margin-left: 4px;
      }
      .sys {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 20px 4px 66px;
        color: var(--ink-dim);
        font-size: 12.5px;
      }
      .sys .px {
        width: 14px;
        height: 14px;
      }
      .sys .t {
        font: 400 11px/16px var(--font-mono);
      }
      .eph {
        margin: 4px 20px;
        padding: 8px 12px;
        border: 1px dashed var(--line-strong);
        color: var(--ink-muted);
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 12.5px;
      }
      .eph .x {
        margin-left: auto;
      }
      /* hover toolbar */
      .mact {
        position: absolute;
        right: 20px;
        top: -14px;
        z-index: 4;
        display: none;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
      }
      .m:hover .mact,
      .m.hl-hover .mact {
        display: flex;
      }
      .mact button {
        display: grid;
        place-items: center;
        width: 30px;
        height: 28px;
        color: var(--ink-muted);
      }
      .mact button:hover {
        color: var(--ink);
        background: var(--bg-raised);
      }
      .mact button.on {
        color: var(--accent);
      }
      .mact .qr {
        border-right: 1px solid var(--line);
      }
      /* reactions */
      .rx {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 5px;
      }
      .rxb {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 7px 0 5px;
        border: 1px solid var(--line-strong);
        font: 400 11px/1 var(--font-mono);
        color: var(--ink-muted);
      }
      .rxb .px {
        width: 14px;
        height: 14px;
        color: var(--ink);
      }
      .rxb:hover {
        border-color: var(--ink-muted);
        color: var(--ink);
      }
      .rxb.me {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        color: var(--ink);
      }
      .rxb.me .px {
        color: var(--accent);
      }
      .rxb.add {
        width: 28px;
        padding: 0;
        justify-content: center;
        opacity: 0;
      }
      .m:hover .rxb.add {
        opacity: 1;
      }
      /* thread summary */
      .thr {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 5px;
        height: 28px;
        padding: 0 8px 0 4px;
        border: 1px solid transparent;
        max-width: 100%;
      }
      .thr:hover {
        border-color: var(--line-strong);
        background: var(--bg);
      }
      .thr .avs {
        display: flex;
        gap: 2px;
      }
      .thr b {
        color: var(--info);
        font-weight: 500;
        font-size: 12.5px;
      }
      .thr .l {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .thr .go {
        color: var(--ink-dim);
        display: none;
      }
      .thr:hover .go {
        display: inline-flex;
      }
      .pinf {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font: 400 10.5px/16px var(--font-mono);
        color: var(--warning);
        margin-bottom: 1px;
      }
      .pinf .px {
        width: 12px;
        height: 12px;
      }
      /* cards: files, unfurls, bots */
      .cards {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 6px;
        max-width: 520px;
      }
      .card {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid var(--line-strong);
        background: var(--bg);
      }
      .card .ft {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--line-strong);
        font: 500 9px/1 var(--font-mono);
        color: var(--ink-muted);
        background: var(--bg-sunk);
        text-transform: uppercase;
      }
      .card .ft.pdf {
        color: var(--danger);
      }
      .card .ft.xlsx {
        color: var(--success);
      }
      .card .ft.img {
        color: var(--info);
      }
      .card .ft.docx {
        color: var(--info);
      }
      .card .ti {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .su {
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .go {
        color: var(--ink-dim);
      }
      .imgc {
        display: block;
        border: 1px solid var(--line-strong);
        max-width: 360px;
        background: var(--bg-sunk);
      }
      .imgc canvas {
        display: block;
        width: 360px;
        height: 200px;
        image-rendering: pixelated;
      }
      .imgc .cap {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 8px;
        border-top: 1px solid var(--line);
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-muted);
      }
      .unf {
        display: block;
        max-width: 520px;
        border: 1px solid var(--line-strong);
        border-left: 2px solid var(--accent);
        background: var(--bg);
        padding: 10px 12px;
      }
      .unf .ah {
        display: flex;
        align-items: center;
        gap: 8px;
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .unf .ah .bav {
        width: 18px;
        height: 18px;
      }
      .unf .ah .bav .px {
        width: 12px;
        height: 12px;
      }
      .unf .ah .go {
        margin-left: auto;
        color: var(--ink-dim);
      }
      .unf .tt {
        font-weight: 600;
        margin-top: 8px;
      }
      .unf .ds {
        color: var(--ink-muted);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .unf dl {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, auto));
        gap: 4px 18px;
        margin: 10px 0 0;
        justify-content: start;
      }
      .unf dt {
        font: 500 9.5px/14px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      .unf dd {
        margin: 0;
        font-size: 12.5px;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .unf dd .led {
        background: var(--c);
      }
      .bact {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .bact .btn {
        height: 26px;
      }
      .bact .done {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-muted);
        font-size: 12.5px;
      }
      .bact .done .px {
        color: var(--success);
      }
      /* poll */
      .poll {
        border: 1px solid var(--line-strong);
        max-width: 520px;
        margin-top: 6px;
      }
      .poll .ph {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
      }
      .poll .ph .k {
        margin-left: auto;
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
        font-weight: 400;
      }
      .opt {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 120px 28px auto;
        gap: 12px;
        align-items: center;
        width: 100%;
        padding: 8px 12px;
        text-align: left;
        border-top: 1px solid var(--line);
      }
      .opt:first-of-type {
        border-top: 0;
      }
      .opt:hover {
        background: var(--bg-raised);
      }
      .opt .ol {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .opt .ck {
        width: 12px;
        height: 12px;
        border: 1px solid var(--line-strong);
        flex: none;
      }
      .opt.me .ck {
        background: var(--accent);
        border-color: var(--accent);
      }
      .opt .cells {
        display: flex;
        gap: 1px;
      }
      .opt .cells i {
        width: 5px;
        height: 10px;
        background: var(--line);
      }
      .opt .cells i.on {
        background: var(--ink-muted);
      }
      .opt.me .cells i.on,
      .opt.lead .cells i.on {
        background: var(--accent);
      }
      .opt .n {
        font: 400 12px/16px var(--font-mono);
        text-align: right;
      }
      .opt .vs {
        display: flex;
        gap: 2px;
        min-width: 40px;
      }
      .opt .vs .av {
        width: 16px;
        height: 16px;
        font-size: 7.5px;
      }
      /* composer */
      .compw {
        flex: none;
        padding: 0 20px 2px;
        position: relative;
      }
      .comp {
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
      }
      .comp:focus-within {
        border-color: var(--ink-muted);
      }
      .comp.editing {
        border-color: var(--warning);
      }
      .ctb {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 32px;
        padding: 0 4px;
        border-bottom: 1px solid var(--line);
      }
      .ctb .icon-btn {
        width: 26px;
        height: 26px;
      }
      .ctb .sp {
        width: 1px;
        height: 16px;
        background: var(--line);
        margin: 0 4px;
      }
      .ctb .eb {
        margin-left: auto;
        font: 400 11px/16px var(--font-mono);
        color: var(--warning);
        padding-right: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .comp textarea {
        display: block;
        width: 100%;
        min-height: 40px;
        max-height: 220px;
        padding: 10px 12px 6px;
        border: 0;
        background: transparent;
        resize: none;
        outline: 0;
        line-height: 20px;
      }
      .cbt {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 34px;
        padding: 0 4px;
      }
      .cbt .icon-btn {
        width: 26px;
        height: 26px;
      }
      .cbt .tpin {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        margin-left: 6px;
        padding: 0 6px;
        border: 1px solid var(--line);
        color: var(--ink-dim);
        font: 400 11px/1 var(--font-mono);
      }
      .cbt .tpin input {
        width: 150px;
        border: 0;
        background: transparent;
        outline: 0;
        font: 400 12px/1 var(--font-sans);
        color: var(--ink);
      }
      .cbt .tpin:focus-within {
        border-color: var(--ink-muted);
      }
      .cbt .hint {
        margin-left: auto;
        margin-right: 8px;
        font: 400 10.5px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .send {
        display: grid;
        place-items: center;
        width: 30px;
        height: 26px;
        background: var(--line-strong);
        color: var(--ink-dim);
      }
      .send.ok {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .pend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 8px 0;
      }
      .pend .chip {
        background: var(--bg);
      }
      .pend .chip button {
        color: var(--ink-dim);
      }
      .typing {
        height: 22px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 22px;
        font-size: 11.5px;
        color: var(--ink-dim);
        flex: none;
      }
      .typing .dots {
        display: inline-flex;
        gap: 2px;
      }
      .typing .dots i {
        width: 3px;
        height: 3px;
        background: var(--ink-muted);
        animation: blink 1s steps(2) infinite;
      }
      .typing .dots i:nth-child(2) {
        animation-delay: 0.33s;
      }
      .typing .dots i:nth-child(3) {
        animation-delay: 0.66s;
      }
      @keyframes blink {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0.15;
        }
      }
      .ro {
        margin: 0 20px 6px;
        padding: 12px;
        border: 1px solid var(--line);
        background-image: var(--hatch);
        text-align: center;
      }
      .ro span {
        background: var(--bg);
        padding: 2px 8px;
        color: var(--ink-muted);
      }
      /* autocomplete + pickers */
      .ac {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: calc(100% + 4px);
        z-index: 20;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
        padding: 4px;
        max-height: 280px;
        overflow: auto;
      }
      .ac .h {
        padding: 6px 8px 4px;
      }
      .ac button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 32px;
        padding: 0 8px;
        text-align: left;
        color: var(--ink-muted);
      }
      .ac button[aria-selected="true"] {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .ac button .d {
        margin-left: auto;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
      }
      .ac button .c {
        font: 500 12.5px/16px var(--font-mono);
        color: var(--ink);
      }
      .pick {
        width: 296px;
        padding: 0;
      }
      .pick input {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        outline: 0;
      }
      .pick .grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 2px;
        padding: 6px;
        max-height: 220px;
        overflow: auto;
      }
      .pick .grid button {
        display: grid;
        place-items: center;
        height: 32px;
        color: var(--ink-muted);
        border: 1px solid transparent;
      }
      .pick .grid button:hover,
      .pick .grid button[aria-selected="true"] {
        border-color: var(--line-strong);
        color: var(--accent);
        background: var(--bg-raised);
      }
      .pick .ft {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 10px;
        border-top: 1px solid var(--line);
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .pick .eyebrow {
        padding: 6px 10px 0;
        font-size: 10px;
      }
      .pop .pp {
        display: flex;
        gap: 12px;
        padding: 10px;
        align-items: center;
      }
      .pop .pp .av {
        width: 44px;
        height: 44px;
        font-size: 15px;
      }
      .pop .pp b {
        display: block;
        font-weight: 600;
      }
      .pop .pp .s {
        color: var(--ink-muted);
        font-size: 12px;
      }
      .pop .ln {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 10px 8px;
        color: var(--ink-muted);
        font-size: 12px;
      }
      .pop .ln .led {
        background: var(--c);
      }
      .pop .row {
        display: flex;
        gap: 6px;
        padding: 4px 10px 10px;
      }
      .pop .row .btn {
        flex: 1;
      }
      .pop .r .led {
        background: var(--c);
      }
      .pop .r.sel {
        color: var(--ink);
      }
      .pop .r .ck {
        margin-left: auto;
        color: var(--accent);
      }
      /* thread panel */
      .tp-root {
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .tp-root .m,
      .rp .m {
        padding-left: 14px;
        padding-right: 14px;
      }
      .rp .mact {
        right: 12px;
      }
      .rcount {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px 4px;
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .rcount::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .rp .compw {
        padding: 8px 14px 2px;
        border-top: 1px solid var(--line);
      }
      .rp .also {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 2px 4px;
        color: var(--ink-muted);
        font-size: 12px;
      }
      .rp .also input {
        accent-color: var(--accent);
      }
      /* details */
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        padding: 0 10px;
        flex: none;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 8px;
        color: var(--ink-muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
      }
      .tabs button[aria-selected="true"] {
        color: var(--ink);
        border-bottom-color: var(--accent);
      }
      .tabs button .n {
        font: 400 10.5px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .dsec {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }
      .dsec .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 10px;
      }
      .dsec .eyebrow .btn {
        margin-left: auto;
        height: 22px;
        padding: 0 6px;
        font-size: 10px;
      }
      .dsec p {
        color: var(--ink-muted);
        line-height: 19px;
      }
      .kv {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 8px 12px;
        font-size: 12.5px;
      }
      .kv dt {
        color: var(--ink-dim);
      }
      .kv dd {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .kv dd a:hover {
        color: var(--info);
      }
      .prow {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 4px 14px;
      }
      .prow:hover {
        background: var(--bg-raised);
      }
      .prow .av {
        width: 26px;
        height: 26px;
        font-size: 9.5px;
      }
      .prow .n {
        font-weight: 500;
      }
      .prow .s {
        color: var(--ink-dim);
        font-size: 11.5px;
      }
      .prow .r {
        margin-left: auto;
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .prow .role {
        font: 400 10.5px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .frow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
      }
      .frow:hover {
        background: var(--bg-raised);
      }
      .frow .ft {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid var(--line-strong);
        font: 500 8.5px/1 var(--font-mono);
        color: var(--ink-muted);
        text-transform: uppercase;
        flex: none;
      }
      .frow .ti {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .frow .su {
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .frow > div {
        min-width: 0;
        flex: 1;
      }
      .pinc {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .pinc:hover {
        background: var(--bg-raised);
      }
      .pinc .h {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 4px;
      }
      .pinc .h b {
        font-weight: 600;
      }
      .pinc .h .t {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .pinc .h .icon-btn {
        margin-left: auto;
        width: 22px;
        height: 22px;
      }
      .pinc .tx {
        color: var(--ink-muted);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .radio {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        text-align: left;
        margin-top: 4px;
      }
      .radio .o {
        width: 12px;
        height: 12px;
        border: 1px solid var(--line-strong);
        flex: none;
        margin-top: 2px;
      }
      .radio[aria-checked="true"] {
        border-color: var(--ink-muted);
        background: var(--bg-raised);
      }
      .radio[aria-checked="true"] .o {
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: inset 0 0 0 2px var(--bg-raised);
      }
      .radio .s {
        display: block;
        color: var(--ink-dim);
        font-size: 12px;
        margin-top: 2px;
      }
      .tg {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        color: var(--ink-muted);
        font-size: 12.5px;
        padding: 6px 0;
        text-align: left;
      }
      .tg .bx {
        position: relative;
        width: 28px;
        height: 16px;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        flex: none;
        margin-left: auto;
      }
      .tg .bx::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        background: var(--ink-dim);
      }
      .tg[aria-checked="true"] .bx {
        border-color: var(--accent);
      }
      .tg[aria-checked="true"] .bx::after {
        left: 14px;
        background: var(--accent);
      }
      .empty {
        margin: 14px;
        padding: 22px 12px;
        background-image: var(--hatch);
        text-align: center;
        border: 1px solid var(--line);
      }
      .empty span {
        background: var(--bg);
        padding: 2px 8px;
        color: var(--ink-dim);
      }
      /* lists (threads, mentions, saved, browse) */
      .page {
        padding: 20px 24px 40px;
        max-width: 900px;
      }
      .h1 {
        font: 700 22px/24px var(--font-pixel);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .sub {
        color: var(--ink-muted);
        margin-top: 6px;
      }
      .lst {
        border: 1px solid var(--line-strong);
        margin-top: 16px;
      }
      .lst > .m {
        border-top: 1px solid var(--line);
        padding-top: 10px;
        padding-bottom: 10px;
      }
      .lst > .m:first-child {
        border-top: 0;
      }
      .lst .where {
        display: flex;
        align-items: center;
        gap: 6px;
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
        margin-bottom: 4px;
      }
      .lst .where a:hover {
        color: var(--ink);
      }
      .tcard {
        border-top: 1px solid var(--line);
      }
      .tcard:first-child {
        border-top: 0;
      }
      .tcard .tch {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px 0;
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .tcard .tch .btn {
        margin-left: auto;
        height: 24px;
      }
      .tcard .more {
        padding: 0 20px 8px 66px;
        color: var(--ink-dim);
        font: 400 11px/16px var(--font-mono);
      }
      .bar2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .inp {
        height: var(--ctl);
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        outline: 0;
        min-width: 0;
      }
      .inp:focus {
        border-color: var(--ink-muted);
      }
      .sel {
        height: var(--ctl);
        padding: 0 6px;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
        font-size: 12.5px;
        outline: 0;
      }
      .brow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 120px 90px 84px;
        gap: 12px;
        align-items: center;
        min-height: 56px;
        padding: 8px 14px;
        border-top: 1px solid var(--line);
      }
      .brow:first-child {
        border-top: 0;
      }
      .brow:hover {
        background: var(--bg-raised);
      }
      .brow .n {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
      }
      .brow .n .px {
        color: var(--ink-dim);
      }
      .brow .d {
        color: var(--ink-dim);
        font-size: 12px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brow .tm {
        color: var(--ink-muted);
        font-size: 12px;
      }
      .brow .c {
        font: 400 11.5px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      .brow .chip {
        font-size: 11px;
        height: 20px;
      }
      /* modal */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: color-mix(in srgb, var(--bg-sunk) 70%, transparent);
        display: none;
        place-items: center;
        padding: 16px;
      }
      .scrim.open {
        display: grid;
      }
      .scrim.top {
        place-items: start center;
        padding-top: 10vh;
      }
      .modal {
        width: min(520px, 100%);
        max-height: calc(100dvh - 32px);
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-pop);
        position: relative;
      }
      .modal::before {
        content: "";
        position: absolute;
        top: -4px;
        left: -4px;
        width: 7px;
        height: 7px;
        background: var(--bg);
        border: 1px solid var(--ink-dim);
      }
      .mh {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .mh b {
        font: 700 14px/16px var(--font-pixel);
        text-transform: uppercase;
      }
      .mh .icon-btn {
        margin-left: auto;
      }
      .mbd {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .lbl2 {
        display: block;
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
        margin-bottom: 6px;
      }
      .fld {
        display: flex;
        align-items: center;
        border: 1px solid var(--line-strong);
        background: var(--bg-sunk);
      }
      .fld:focus-within {
        border-color: var(--ink-muted);
      }
      .fld .pre {
        padding-left: 10px;
        color: var(--ink-dim);
      }
      .fld input,
      .fld textarea {
        flex: 1;
        height: 32px;
        padding: 0 10px 0 6px;
        border: 0;
        background: transparent;
        outline: 0;
        min-width: 0;
      }
      .fld textarea {
        height: 60px;
        padding: 8px 10px;
        resize: vertical;
      }
      .hint2 {
        color: var(--ink-dim);
        font-size: 12px;
        margin-top: 6px;
      }
      .err {
        color: var(--danger) !important;
      }
      .mfoot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
      }
      .mfoot .l {
        color: var(--ink-dim);
        font-size: 12px;
        flex: 1;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .pchips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .pchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px 0 4px;
        border: 1px solid var(--line);
        color: var(--ink-dim);
        font-size: 12px;
      }
      .pchip[aria-pressed="true"] {
        border-color: var(--ink-muted);
        color: var(--ink);
        background: var(--bg-raised);
      }
      .pchip .av {
        width: 16px;
        height: 16px;
        font-size: 7.5px;
      }
      /* search */
      .srch {
        width: min(680px, 100%);
      }
      .srch .si {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 48px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
      }
      .srch .si input {
        flex: 1;
        height: 100%;
        border: 0;
        background: transparent;
        outline: 0;
        font-size: 15px;
      }
      .srch .sf {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .srch .sf .seg button {
        height: 24px;
      }
      .srch .sf .sel {
        height: 26px;
        font-size: 12px;
      }
      .srch .sf .fchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        font-size: 12px;
        color: var(--ink-dim);
      }
      .srch .sf .fchip[aria-pressed="true"] {
        color: var(--ink);
        border-color: var(--ink-muted);
        background: var(--bg-raised);
      }
      .srch .res {
        max-height: 52vh;
        overflow: auto;
        padding: 4px;
      }
      .srch .res .eyebrow {
        padding: 8px 10px 4px;
        font-size: 10px;
      }
      .sr {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        text-align: left;
        color: var(--ink-muted);
      }
      .sr[aria-selected="true"] {
        background: var(--bg-raised);
        color: var(--ink);
      }
      .sr .av,
      .sr .bav {
        margin-top: 1px;
      }
      .sr .bav {
        width: 18px;
        height: 18px;
      }
      .sr .bav .px {
        width: 12px;
        height: 12px;
      }
      .sr .b {
        min-width: 0;
        flex: 1;
      }
      .sr .b .t1 {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .sr .b .t1 b {
        color: var(--ink);
        font-weight: 500;
      }
      .sr .b .t1 .w {
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
        margin-left: auto;
        white-space: nowrap;
      }
      .sr .b .t2 {
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sr mark {
        background: color-mix(in srgb, var(--accent) 30%, transparent);
        color: var(--ink);
      }
      .srch .sft {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 30px;
        padding: 0 12px;
        border-top: 1px solid var(--line);
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
      }
      /* huddle bar */
      .hud {
        position: fixed;
        left: 12px;
        bottom: 52px;
        width: calc(var(--side) - 24px);
        z-index: 40;
        background: var(--bg);
        border: 1px solid var(--accent);
        box-shadow: var(--shadow-pop);
      }
      .hud .hh {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
        font: 500 10.5px/16px var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .hud .hh .tm {
        margin-left: auto;
        color: var(--ink-muted);
        letter-spacing: 0;
      }
      .hud .hh .led {
        background: var(--accent);
        animation: blink 1.2s steps(2) infinite;
      }
      .hud .hp {
        display: flex;
        gap: 6px;
        padding: 8px;
        flex-wrap: wrap;
      }
      .hud .hp .av {
        width: 28px;
        height: 28px;
        font-size: 10px;
        position: relative;
      }
      .hud .hp .av.spk {
        outline: 2px solid var(--success);
        outline-offset: 1px;
      }
      .hud .hp .av .mu {
        position: absolute;
        right: -5px;
        bottom: -5px;
        display: grid;
        place-items: center;
        width: 13px;
        height: 13px;
        background: var(--danger);
        color: var(--bg);
      }
      .hud .hp .av .mu .px {
        width: 9px;
        height: 9px;
      }
      .hud .hc {
        display: flex;
        gap: 4px;
        padding: 0 8px 8px;
      }
      .hud .hc .icon-btn {
        border-color: var(--line-strong);
        flex: 1;
        width: auto;
      }
      .hud .hc .icon-btn.off {
        color: var(--danger);
      }
      .hud .hc .icon-btn.leave {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--bg);
      }
      .app.in-hud .nav {
        padding-bottom: 160px;
      }
      /* meeting */
      .meet {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg-sunk);
      }
      .tiles {
        flex: 1;
        min-height: 0;
        display: grid;
        gap: 8px;
        padding: 12px;
        grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
        grid-auto-rows: minmax(0, 1fr);
      }
      .vt {
        position: relative;
        border: 1px solid var(--line-strong);
        background: var(--bg);
        min-height: 120px;
        overflow: hidden;
      }
      .vt.spk {
        border-color: var(--success);
        box-shadow: inset 0 0 0 1px var(--success);
      }
      .vt canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .vt .off {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background-image: var(--hatch);
      }
      .vt .off .av {
        width: 72px;
        height: 72px;
        font: 700 26px/1 var(--font-pixel);
      }
      .vt .nm {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 6px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        font-size: 12px;
      }
      .vt .nm .px {
        width: 12px;
        height: 12px;
        color: var(--danger);
      }
      .vt .tg2 {
        position: absolute;
        right: 8px;
        top: 8px;
        font: 500 10px/16px var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 0 5px;
        background: var(--bg);
        border: 1px solid var(--line-strong);
        color: var(--ink-muted);
      }
      .mctl {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 60px;
        border-top: 1px solid var(--line);
        background: var(--bg);
        flex: none;
        position: relative;
      }
      .mctl .icon-btn {
        width: 40px;
        height: 36px;
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .mctl .icon-btn.off {
        color: var(--danger);
        border-color: var(--danger);
      }
      .mctl .icon-btn.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      .mctl .btn.leave {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--bg);
        height: 36px;
      }
      .mctl .l {
        position: absolute;
        left: 16px;
        font: 400 11px/16px var(--font-mono);
        color: var(--ink-dim);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .mctl .l .led {
        background: var(--danger);
        animation: blink 1.2s steps(2) infinite;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 44px;
        transform: translateX(-50%);
        z-index: 80;
        display: none;
        align-items: center;
        gap: 12px;
        padding: 8px 8px 8px 12px;
        background: var(--ink);
        color: var(--bg);
        font-size: 12.5px;
        box-shadow: var(--shadow-pop);
      }
      .toast.open {
        display: flex;
      }
      .toast button {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 6px 8px;
        border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent);
      }
      @media (max-width: 1180px) {
        :root {
          --rp: 340px;
        }
        .head .desc {
          display: none;
        }
      }
      @media (max-width: 860px) {
        .rp {
          position: fixed;
          inset: 0;
          z-index: 35;
          width: auto;
          border-left: 0;
        }
        .hud {
          left: auto;
          right: 8px;
          bottom: 8px;
          width: 240px;
        }
        .compw {
          padding: 0 8px 2px;
        }
        .m {
          padding-left: 10px;
          padding-right: 10px;
        }
        .mact {
          right: 8px;
        }
        .cbt .hint,
        .hide-sm {
          display: none !important;
        }
        .cbt .tpin input {
          width: 90px;
        }
        .brow {
          grid-template-columns: minmax(0, 1fr) 84px;
        }
        .brow .tm,
        .brow .c {
          display: none;
        }
        .page {
          padding: 16px;
        }
        .unf dl {
          grid-template-columns: repeat(2, minmax(0, auto));
        }
        .imgc canvas {
          width: 100%;
        }
        .tiles {
          --cols: 1 !important;
        }
        .head .btn .lbl {
          display: none;
        }
      }
    </style>
  </head>
  <body>

    <script>
      const ICONS = {
        "leaf-01": [
          "............",
          "..........#.",
          ".......###..",
          ".....##.o#..",
          "....#..o.#..",
          "...#..o.#...",
          "...#.o..#...",
          "..#.o..#....",
          "..#o.##.....",

      };
      function px(name) {
        const rows = ICONS[name];
        if (!rows) return "";
        const n = rows.length;
        let a = "",
          b = "";
        rows.forEach((r, y) => {
          let x = 0;
          while (x < r.length) {
            const c = r[x];
            if (c !== "#" && c !== "o") {
              x++;
              continue;
            }
            const s = x;
            while (x < r.length && r[x] === c) x++;
            const d = `M${s} ${y}h${x - s}v1h-${x - s}z`;
            if (c === "#") a += d;
            else b += d;
          }
        });
        return `<svg class="px" viewBox="0 0 ${n} ${n}" aria-hidden="true"><path fill="currentColor" d="${a}"/>${b ? `<path class="o" fill="currentColor" d="${b}"/>` : ""}</svg>`;
      }
      const I = (n) => `<span data-i="${n}">${px(n)}</span>`;
      function fillIcons(...els) {
        for (const el of els)
          if (el) el.innerHTML = el.innerHTML.replace(/%%I:([a-z0-9-]+)%%/g, (_, n) => I(n));
      }
      function bayer(x, y) {
        const m = [
          [0, 8, 2, 10],
          [12, 4, 14, 6],
          [3, 11, 1, 9],
          [15, 7, 13, 5],
        ];
        return (m[y & 3][x & 3] + 0.5) / 16;
      }
      // A dithered cover: pixels on or off, accent over the background.
      function ditherCover(canvas, seed = 1) {
        const cs = getComputedStyle(document.documentElement),
          acc = cs.getPropertyValue("--accent").trim(),
          bg = cs.getPropertyValue("--bg-sunk").trim();
        const w = (canvas.width = Math.ceil(canvas.clientWidth / 4)),
          h = (canvas.height = Math.ceil(canvas.clientHeight / 4));
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = acc;
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const v =
              0.5 +
              0.5 * Math.sin((x / w) * Math.PI * (1.2 + seed * 0.3) + seed) * (1 - y / h) -
              0.35 +
              (y / h) * 0.15 * Math.cos(x / 9 + seed);
            if (v > bayer(x, y)) ctx.fillRect(x, y, 1, 1);
          }
      }

        },

          f: [["Status", '<span class="led" style="--c:var(--warning)"></span>Needs a key']],
