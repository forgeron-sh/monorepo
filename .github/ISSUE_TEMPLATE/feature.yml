name: Idée
description: Proposer une fonctionnalité ou une amélioration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Le besoin
      description: Le problème à résoudre, du point de vue de la personne concernée (développeur, admin, utilisateur métier).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: La proposition
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
