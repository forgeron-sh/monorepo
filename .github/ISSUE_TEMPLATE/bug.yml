name: Bug
description: Report unexpected behavior
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [SDK, CLI, Runtime, Console, Gateway, Catalog template, Site, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: forgeron 0.4.2, or the commit
  - type: textarea
    id: description
    attributes:
      label: What happens
      description: The observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. forgeron init …
        2. forgeron dev …
        3. See…
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node, local / preview / production
