name: Forgeron deploy
description: >-
  For every tool of the repository, installs its dependencies, then runs forgeron test, forgeron
  change check and forgeron deploy. The build happens here, in the repository's CI: the platform
  builds nothing (D-004). With `permissions: id-token: write`, no token is needed: GitHub tells
  Forgeron which repository this is, and Forgeron deploys the tool linked to it (D-123).
  Use it as forgeron-sh/monorepo/.github/actions/deploy@v<version>.
inputs:
  token:
    description: >-
      Deployment token (FORGERON_TOKEN). Optional on GitHub with `id-token: write`. With neither, the
      tools are tested and checked, not deployed.
    required: false
    default: ""
  endpoint:
    description: >-
      The workspace's address (https://<workspace>.<domain>), for a tool whose .forgeron/project.json
      does not name it.
    required: false
    default: ""
  args:
    description: Extra arguments for forgeron deploy, such as --allow-destructive.
    required: false
    default: ""
  command:
    description: The command line of the Forgeron CLI. By default, the CLI of this action's release.
    required: false
    default: ""
  install:
    description: '"false" skips installing the dependencies (bun if bun.lock, else npm).'
    required: false
    default: "true"
  working-directory:
    description: Where to look for tools (folders with a forgeron.config.ts).
    required: false
    default: "."
  close:
    description: >-
      "true" closes the preview of the branch for every tool (forgeron preview close) instead of
      testing and deploying: for a deleted branch, or a pull request that is closed or merged.
    required: false
    default: "false"
  branch:
    description: >-
      With close, the branch whose preview goes; by default the pull request's. A deleted branch
      gives its own name here (github.event.ref).
    required: false
    default: ""
outputs:
  urls:
    description: One "<tool> <address>" line per tool that was deployed (empty when nothing was).
    value: ${{ steps.run.outputs.urls }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24.21.0
    - id: run
      run: bash "$GITHUB_ACTION_PATH/run.sh" "$ROOT"
      shell: bash
      env:
        ROOT: ${{ inputs.working-directory }}
        FORGERON_TOKEN: ${{ inputs.token }}
        FORGERON_ENDPOINT: ${{ inputs.endpoint }}
        FORGERON_ARGS: ${{ inputs.args }}
        FORGERON_CMD: ${{ inputs.command }}
        FORGERON_INSTALL: ${{ inputs.install }}
        FORGERON_CLOSE: ${{ inputs.close }}
        FORGERON_BRANCH: ${{ inputs.branch }}
