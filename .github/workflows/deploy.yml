name: Deploy

on:
  push:
    branches: [staging, production]
  workflow_call:
    inputs:
      environment:
        description: Target environment (staging or production)
        required: true
        type: string

# Environment: the pushed branch, or the input when the workflow is called by Release.

# One deployment at a time per environment, without cancelling the one in progress.
concurrency:
  group: deploy-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || github.ref_name }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Migrate the platform D1
        run: bun run --cwd packages/registry migrate
        env:
          PLATFORM_D1_ID: ${{ vars.PLATFORM_D1_ID }}
      - name: Build and deploy
        run: bun run deploy:${{ inputs.environment || github.ref_name }}
