name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Merging the release PR advances `staging` to the tagged commit (fast-forward, no force).
  # A push made with GITHUB_TOKEN does not trigger deploy.yml: we call it directly instead.
  promote-staging:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # GITHUB_TOKEN cannot push changes to .github/workflows: the step may fail without blocking the deployment.
      - name: Advance staging
        continue-on-error: true
        run: git push origin "${GITHUB_SHA}:refs/heads/staging"

  deploy-staging:
    needs: [release-please, promote-staging]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
