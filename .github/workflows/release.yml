name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      # The platform's own release (the root component): it deploys staging.
      release_created: ${{ steps.release.outputs.release_created }}
      # Any release: the npm packages are released with the platform, under one version (D-122).
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Merging the release PR advances `staging` to the tagged commit (fast-forward, no force).
  # A push made with GITHUB_TOKEN does not trigger deploy.yml: we call it directly instead.
  promote-staging:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # GITHUB_TOKEN cannot push changes to .github/workflows: the step may fail without blocking the deployment.
      - name: Advance staging
        continue-on-error: true
        run: git push origin "${GITHUB_SHA}:refs/heads/staging"

  deploy-staging:
    needs: [release-please, promote-staging]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  # The npm packages (D-086, D-122): built, installed from their archives and used as a developer
  # would, then published with their provenance. npm authenticates by trusted publishing; NPM_TOKEN
  # is only for a package's first publication, before its trusted publisher is set on npmjs.com.
  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Trusted publishing needs npm 11.5.1 or later: Node 24.21 ships 11.19.
      - run: bun run packages:build
      - run: bun run packages:smoke
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          fi
          bun scripts/publish.ts
