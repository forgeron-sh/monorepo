name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

# Every job after release-please checks out the release's tag, not the commit that started the run: runs
# wait for each other (`concurrency`), so the run of a commit merged before the release PR can be the one
# that creates the release, and its own commit is then older than the release (v0.8.2 was built from the
# code and version of 0.8.1 that way).
jobs:
  release-please:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      # The platform's own release (the root component): it deploys staging.
      release_created: ${{ steps.release.outputs.release_created }}
      # Any release: the npm packages are released with the platform, under one version (D-122).
      releases_created: ${{ steps.release.outputs.releases_created }}
      # The root component's version and tag (`v<version>`): the platform artifact is attached to it.
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Merging the release PR advances `staging` to the tagged commit (fast-forward, no force).
  # A push made with GITHUB_TOKEN does not trigger deploy.yml: we call it directly instead.
  promote-staging:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      # GITHUB_TOKEN cannot push changes to .github/workflows: the step may fail without blocking the deployment.
      - name: Advance staging
        continue-on-error: true
        run: git push origin "HEAD:refs/heads/staging"

  deploy-staging:
    needs: [release-please, promote-staging]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # The npm packages (D-086, D-122): built, installed from their archives and used as a developer
  # would, then published by trusted publishing (OIDC): no token is stored. It needs a runner hosted
  # by GitHub (not Blacksmith) and npm 11.5.1 or later (Node 24.21 ships 11.19). Provenance is added
  # by npm itself once the repository is public. Each package's first publication is made by hand
  # (D-122); its trusted publisher points at this file.
  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup
      - run: bun run packages:build
      - run: bun run packages:smoke
      - run: bun scripts/publish.ts

  # The platform artifact (D-138): the built gateway, console and migrations, with their checksum,
  # attached to the platform's release so that a self-hosted gateway can update itself from the console.
  platform-artifact:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/gateway build
      - run: bun run --cwd apps/console build
      - run: bun run platform:artifact
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/forgeron-platform.json dist/forgeron-platform.json.sha256 --clobber
