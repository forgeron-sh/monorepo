name: Templates preview

# Templates are the SDK's integration tests (docs/ARCHITECTURE.md): on every pull request each one
# is tested, checked and deployed as a preview of the branch, through the same action a tool
# repository uses. A template that breaks fails the pull request. The preview is announced in a
# comment of the pull request and torn down when the pull request is closed or merged (D-045).
#
# Needs a workspace: the repository variable FORGERON_WORKSPACE and one secret per template (named
# in the matrices below, created with `forgeron token create`). Without them (forks, or before the
# workspace exists) the templates are tested and checked, and nothing is deployed, commented or
# closed: every step that needs them skips.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: templates-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  template:
    if: ${{ github.event.action != 'closed' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Comments need write access to pull requests; a fork's token is read-only, and it has no
    # secrets either, so nothing is deployed for it.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # Every folder of templates/ is listed here: `bun run templates:check` refuses the others.
        include:
          - { template: crm, secret: FORGERON_TOKEN_CRM }
          - { template: dashboard, secret: FORGERON_TOKEN_DASHBOARD }
          - { template: inventory, secret: FORGERON_TOKEN_INVENTORY }
          - { template: odoo-gateway, secret: FORGERON_TOKEN_ODOO_GATEWAY }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # A deployment token is bound to one tool: each template has its own secret, named in the
      # matrix. Without it (a fork, no workspace yet) the template is tested and checked only.
      - name: Link the template to the workspace
        if: ${{ vars.FORGERON_WORKSPACE != '' }}
        working-directory: templates/${{ matrix.template }}
        run: |
          mkdir -p .forgeron
          [ -f .forgeron/project.json ] || echo '{"tool":"${{ matrix.template }}"}' > .forgeron/project.json
          bun ${{ github.workspace }}/apps/cli/src/index.ts link --workspace "${{ vars.FORGERON_WORKSPACE }}"
      - uses: ./.github/actions/deploy
        id: deploy
        with:
          working-directory: templates/${{ matrix.template }}
          command: bun ${{ github.workspace }}/apps/cli/src/index.ts
          token: ${{ vars.FORGERON_WORKSPACE != '' && secrets[matrix.secret] || '' }}
      # One comment per template, edited on each push: found by its hidden marker.
      - name: Announce the preview on the pull request
        if: ${{ steps.deploy.outputs.urls != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TEMPLATE: ${{ matrix.template }}
          URLS: ${{ steps.deploy.outputs.urls }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- forgeron-preview:${TEMPLATE} -->"
          address="$(printf '%s\n' "$URLS" | head -n1 | cut -d' ' -f2)"
          body="${marker}"$'\n'"Preview of the \`${TEMPLATE}\` template for ${SHA:0:7}: ${address}"$'\n\n'"It is torn down when this pull request is closed."
          id="$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi

  # The preview of a closed or merged branch is torn down: each tool of a preview uses a Worker,
  # and the account holds 500 (D-009).
  close:
    if: ${{ github.event.action == 'closed' && vars.FORGERON_WORKSPACE != '' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { template: crm, secret: FORGERON_TOKEN_CRM }
          - { template: dashboard, secret: FORGERON_TOKEN_DASHBOARD }
          - { template: inventory, secret: FORGERON_TOKEN_INVENTORY }
          - { template: odoo-gateway, secret: FORGERON_TOKEN_ODOO_GATEWAY }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Link the template to the workspace
        working-directory: templates/${{ matrix.template }}
        run: |
          mkdir -p .forgeron
          [ -f .forgeron/project.json ] || echo '{"tool":"${{ matrix.template }}"}' > .forgeron/project.json
          bun ${{ github.workspace }}/apps/cli/src/index.ts link --workspace "${{ vars.FORGERON_WORKSPACE }}"
      - uses: ./.github/actions/deploy
        with:
          close: "true"
          working-directory: templates/${{ matrix.template }}
          command: bun ${{ github.workspace }}/apps/cli/src/index.ts
          token: ${{ secrets[matrix.secret] }}
