name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Independent jobs run side by side; `check` stays the one status that gates a merge.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run test

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip
      - run: bun run deps
      - run: bun run deps:selftest
      - run: bun run neutral
      - run: bun run templates:check
      - run: bun run tokens:check

  check:
    if: always()
    needs: [typecheck, test, static]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All the jobs passed
        run: |
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.static.result }}" = success

  # The PR title becomes the squash message: it must follow Conventional Commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint
