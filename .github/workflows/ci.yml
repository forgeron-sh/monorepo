name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job on one machine, and the one status that gates a merge: it keeps the name `check`.
  check:
    runs-on: [self-hosted, perf]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # moon compares with the default branch
      - uses: ./.github/actions/setup
      # The PR title becomes the squash message: it must follow Conventional Commits.
      - name: Check the PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run deps
      - run: bun run deps:selftest
      - run: bun run neutral
      - run: bun run templates:check
      - run: bun run tokens:check
      # The templates are the SDK's integration tests (docs/ARCHITECTURE.md): they are built and tested here.
      - run: bun run test
