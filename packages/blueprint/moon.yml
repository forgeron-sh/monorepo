language: typescript

tasks:
  # Every suite, with the parity of the Rust core against the TypeScript reference and its perf
  # budgets (test/, under Node). Uses the committed module (packages/blueprint/wasm/): no Rust.
  test:
    command: vitest run --config vitest.config.ts
    inputs:
      [
        "src/**/*",
        "test/**/*",
        "wasm/**/*",
        "vitest.config.ts",
        "/apps/site/src/illustrations/**/*",
      ]
  # The presenters in headless Chrome (chrome-headless-shell of Playwright's cache, or CHROME):
  # WebGL2 `readPixels` equals the 2D presenter's RGBA for ten scenes.
  presenters:
    command: bun ../../scripts/blueprint/check-presenters.ts
    inputs:
      [
        "src/**/*",
        "test/browser/**/*",
        "wasm/**/*",
        "/scripts/blueprint/check-presenters.ts",
        "/apps/site/src/illustrations/**/*",
      ]
