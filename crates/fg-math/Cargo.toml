[package]
name = "fg-math"
version = "0.0.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
publish = false
description = "The shared math of the Rust crates: vectors, quarter turns, iso 2:1 projection and fit, JavaScript-exact rounding, hypot and hash, and V8-exact trig (fdlibm with contraction)."

[dependencies]
# pow and atan2 (fdlibm.rs ports V8's own sin and cos for parity under Node).
libm = "=0.2.16"
