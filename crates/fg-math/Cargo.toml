[package]
name = "fg-math"
version = "0.0.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
publish = false
description = "The shared math of the Rust crates: vectors, quarter turns, iso 2:1 projection and fit, JavaScript-exact rounding and trig (libm)."

[dependencies]
# fdlibm, as V8's Math.sin/cos: parity with the TypeScript renderer is defined under Node.
libm = "=0.2.16"
