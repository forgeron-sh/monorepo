# `apps/richtext` and `packages/richtext` share a folder name: this project takes its own id.
id: "richtext-site"
language: typescript

tasks:
  dev:
    command: astro dev
    preset: server
  build:
    command: astro build
    inputs:
      [
        "src/**/*",
        "public/**/*",
        "astro.config.ts",
        "package.json",
        "/packages/richtext/src/plugins/docs/*.ts",
        "/packages/richtext/src/plugins/editor/*",
      ]
    outputs: ["dist"]

  # `tsc` does not read `.astro` files: `astro check` type-checks them along with the TypeScript, after
  # generating the content collections' types (`astro-check` alone does not: a fresh CI checkout
  # failed). A script, not a command: moon adds `--noEmit` to a typecheck command's arguments.
  typecheck:
    script: astro check
    inputs:
      [
        "src/**/*",
        "public/**/*",
        "tsconfig.json",
        "astro.config.ts",
        "package.json",
        "/packages/richtext/src/plugins/docs/*.ts",
      ]

  # The built site: every internal link and anchor resolves, every plugin of the catalog has its page.
  links:
    command: bun scripts/check-links.ts
    deps: ["~:build"]
    inputs: ["dist/**/*", "scripts/check-links.ts"]
